---
name: CI - Validate & Lint

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "playbooks/**/*.yaml"
      - "playbooks/**/*.yml"
      - "files/**"
      - "roles/**"
      - "vars/**/*.yaml"
      - "vault/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "playbooks/**/*.yaml"
      - "playbooks/**/*.yml"
      - "files/**"
      - "roles/**"
      - "vars/**/*.yaml"
      - "vault/**"
      - ".github/workflows/**"

env:
  ANSIBLE_FORCE_COLOR: "true"
  ANSIBLE_HOST_KEY_CHECKING: "false"
  PIP_BREAK_SYSTEM_PACKAGES: "1"

# Least privilege: these workflows only ever check out the repository.
# The repo default is read, and declaring it here keeps that true even if
# the default is ever widened again.
permissions:
  contents: read

jobs:
  validate-yaml:
    name: Validate YAML Syntax
    runs-on: [self-hosted, homelab, ansible]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user --quiet pyyaml

      - name: Validate YAML files
        run: |
          echo "Validating YAML syntax..."
          find playbooks -name "*.yaml" -o -name "*.yml" | while read file; do
            echo "Checking $file"
            python3 -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
          done
          echo "✓ All YAML files are valid"

  validate-ansible:
    name: Validate Ansible Playbooks
    runs-on: [self-hosted, homelab, ansible]
    environment: Github Actions CI
    needs: validate-yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python3 -m pip install --user --break-system-packages --quiet ansible
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Ansible installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ansible --version

      - name: Validate playbook syntax
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          # Create temporary vault password file
          echo "$ANSIBLE_VAULT_PASSWORD" > /tmp/.vault_pass
          chmod 600 /tmp/.vault_pass

          # Some *.yaml under playbooks/ are task includes (e.g.
          # terminalbench_model.yaml, pulled in via include_tasks), not plays.
          # --syntax-check treats every file as a playbook and errors on those,
          # so skip anything that isn't a list of plays. A play entry has a
          # `hosts` key or an `*import_playbook` key (FQCN ansible.builtin.import_playbook
          # is the house style, so match the suffix, not the bare name).
          is_playbook() {
            python3 -c "import yaml,sys; d=yaml.safe_load(open(sys.argv[1])); sys.exit(0 if isinstance(d,list) and d and all(isinstance(i,dict) and any(k=='hosts' or k.endswith('import_playbook') for k in i) for i in d) else 1)" "$1"
          }

          echo "Validating Ansible playbook syntax..."
          # Cover the whole tree (incl. operations/ and tasks/), skipping
          # deprecated/ and task-include files. is_playbook gates each file.
          find playbooks -name "*.yaml" -not -path "playbooks/deprecated/*" | sort | while read playbook; do
            if is_playbook "$playbook"; then
              echo "Checking $playbook"
              ansible-playbook --syntax-check --vault-password-file=/tmp/.vault_pass -i .github/ci_inventory.ini "$playbook"
            else
              echo "Skipping $playbook (task include, not a playbook)"
            fi
          done

          # Clean up
          rm -f /tmp/.vault_pass

          echo "✓ All Ansible playbooks have valid syntax"

  lint-ansible:
    name: Lint Ansible Playbooks
    runs-on: [self-hosted, homelab, ansible]
    environment: Github Actions CI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible and ansible-lint
        run: |
          python3 -m pip install --user --break-system-packages --quiet ansible ansible-lint
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Lint playbooks
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          # ansible-lint loads vars_files (incl. the encrypted vault), so give
          # it the password; otherwise it reports load-failure (a min-profile
          # rule). Profile is pinned to `min` in .ansible-lint.
          echo "$ANSIBLE_VAULT_PASSWORD" > /tmp/.vault_pass
          chmod 600 /tmp/.vault_pass
          trap 'rm -f /tmp/.vault_pass' EXIT
          export ANSIBLE_VAULT_PASSWORD_FILE=/tmp/.vault_pass
          ansible-lint playbooks/ roles/

  validate-templates:
    name: Validate Jinja2 Templates
    runs-on: [self-hosted, homelab, ansible]
    needs: validate-yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Jinja2
        run: |
          python3 -m pip install --user --quiet jinja2

      - name: Check Jinja2 templates
        run: |
          echo "Validating Jinja2 templates..."
          find files roles -name "*.j2" | while read template; do
            echo "Checking $template"
            python3 -c "from jinja2 import Template; Template(open('$template').read())" || exit 1
          done
          echo "✓ All Jinja2 templates are valid"

  security-scan:
    name: Security Scan
    runs-on: [self-hosted, homelab, ansible]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This job used to end in `|| echo "✓ no obvious credentials"`, so it
      # exited 0 whether it found a secret or not. It ran that way for months
      # while three live API keys and a third-party account password sat in
      # files/ocean-bazarr/config.ini.j2 — a directory and file extension it
      # did not even scan. A gate that cannot go red is decoration.
      - name: Scan for hardcoded secrets
        run: bash .github/workflows/lib/scan-hardcoded-secrets.sh

      # And the scanner needs its own test, or it rots back into decoration
      # without anyone noticing: this plants a secret and requires a non-zero
      # exit.
      - name: Secret scanner catches a planted secret
        run: bash .github/workflows/lib/scan-hardcoded-secrets.test.sh

  check-vault:
    name: Verify Vault Files
    runs-on: [self-hosted, homelab, ansible]
    environment: Github Actions CI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python3 -m pip install --user --break-system-packages --quiet ansible
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Check vault encryption
        run: |
          echo "Checking vault files are encrypted..."
          for vault in vault/*.yaml; do
            if [ -f "$vault" ] && [ "$vault" != "vault/secrets.yaml.template" ]; then
              if ! head -n 1 "$vault" | grep -q "ANSIBLE_VAULT"; then
                echo "ERROR: $vault is not encrypted!"
                exit 1
              else
                echo "✓ $vault is encrypted"
              fi
            fi
          done
          echo "✓ All vault files are properly encrypted"

      # A template can reference a vault variable its playbook never loads, or a
      # vault path that does not exist. The first kills the apply with
      # "'media_services' is undefined"; the second renders an empty string, so
      # the deploy succeeds and the service breaks silently. Neither is visible
      # to a syntax check, because --syntax-check never resolves variables.
      # bazarr hit the first on 2026-09-01 and CI was fully green.
      - name: Vault references resolve
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          echo "$ANSIBLE_VAULT_PASSWORD" > /tmp/.vault_pass
          chmod 600 /tmp/.vault_pass
          trap 'rm -f /tmp/.vault_pass' EXIT
          python3 .github/workflows/lib/check-vault-refs.py /tmp/.vault_pass

      - name: Vault reference check catches a planted bug
        run: bash .github/workflows/lib/check-vault-refs.test.sh

      - name: Check no vault keys were dropped
        if: github.event_name == 'pull_request'
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A vault edit that merges an older copy silently deletes secrets, and the
          # ciphertext diff shows every line changed, so review can't see it. Compare
          # the decrypted KEY PATHS (never values - this log is not a safe place for
          # them) against the base branch and fail on anything that disappeared.
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          echo "$ANSIBLE_VAULT_PASSWORD" > /tmp/.vault_pass
          chmod 600 /tmp/.vault_pass
          trap 'rm -f /tmp/.vault_pass /tmp/vault-base.yaml' EXIT
          export ANSIBLE_VAULT_PASSWORD_FILE=/tmp/.vault_pass

          git fetch --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:vault/secrets.yaml" > /tmp/vault-base.yaml

          HOMELAB_VAULT=/tmp/vault-base.yaml scripts/vault.py list | cut -d: -f1 | sort > /tmp/keys-base
          scripts/vault.py list | cut -d: -f1 | sort > /tmp/keys-head

          removed=$(comm -23 /tmp/keys-base /tmp/keys-head)
          if [ -n "$removed" ]; then
            echo "ERROR: this PR removes vault keys that exist on the base branch:"
            echo "$removed" | sed 's/^/  - /'
            echo ""
            echo "If the removal is intentional, a human must confirm it and override this check."
            echo "If it is not, you have merged an older copy of the vault - re-do the edit"
            echo "on top of the current file (scripts/vault.py rotate) instead of replacing it."
            exit 1
          fi
          echo "✓ no vault keys dropped ($(wc -l < /tmp/keys-head) keys, $(comm -13 /tmp/keys-base /tmp/keys-head | wc -l) added)"

  validate-deploy-mapping:
    name: Validate Deploy Mapping
    runs-on: [self-hosted, homelab, ansible]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # detector's service_ports key-diff reads the base commit

      - name: Install Python deps
        run: python3 -m pip install --user --quiet pyyaml

      # The push-time detector decides which playbooks a change deploys. These
      # tests are the guardrail against a change silently fanning out across the
      # fleet (or a new service resolving to nothing): unit cases pin specific
      # mappings, and the coverage check proves every files/, vars/, and roles/
      # input resolves to an owner or a declared no-op.
      - name: Detector unit tests
        run: bash .github/workflows/lib/detect-impacted-playbooks.test.sh

      - name: Concurrency-group unit tests
        run: bash .github/workflows/lib/resolve-concurrency-group.test.sh

      - name: Ownership coverage (no un-owned inputs)
        run: bash .github/workflows/lib/ownership-coverage.test.sh

      # An issue body is a prompt for an agent that pushes code, so every point
      # where the fleet picks work up has to check who wrote it.
      - name: Agent issue-author trust boundary
        run: bash .github/workflows/lib/agentbox-issue-author.test.sh

      # A drafting agent may commit its own work. Deciding "did it produce
      # anything?" from a dirty tree alone threw a correct fix away.
      - name: Agent draft detection
        run: bash .github/workflows/lib/agentbox-draft-detection.test.sh

      # A collapsed ladder or a paid model creeping in breaks nothing visibly;
      # it just changes the bill. Assert the shape instead.
      - name: Agent lane ladder stays local-first and free
        run: bash .github/workflows/lib/agentbox-lane-ladder.test.sh

      # The only automation that closes hardware issues, on the pool where data
      # loss is the worst outcome. Asserts what it must REFUSE to close.
      - name: Replace-issue reconciler guard rails
        run: bash .github/workflows/lib/agentbox-replace-reconcile.test.sh

      # "I could not look" must never render as "nothing is wrong". Three
      # places in this repo got that backwards at once.
      - name: Absence is not health
        run: bash .github/workflows/lib/absence-is-not-health.test.sh

      # Data-safety guardrail: no committed playbook may mutate ZFS. Storage
      # changes are coordinated, hand-run tasks — never a commit/CI side effect.
      - name: No ZFS mutations in playbooks
        run: bash .github/workflows/lib/check-no-zfs-mutations.sh

      - name: ZFS guardrail self-test
        run: bash .github/workflows/lib/check-no-zfs-mutations.test.sh
