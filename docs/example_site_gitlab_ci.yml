---
# Add this file to terrac_com_2026 repository at:
# .gitlab-ci.yml
#
# This GitLab CI pipeline builds the Vite app and commits the dist/ folder
# so the homelab can deploy it via git pull

stages:
  - build
  - deploy

variables:
  GIT_DEPTH: 0  # Full clone for commit history

build_and_commit:
  stage: build
  image: node:20
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
  script:
    # Install dependencies
    - npm ci
    
    # Build the application
    - npm run build
    
    # Check if dist folder exists
    - |
      if [ ! -d "dist" ]; then
        echo "❌ ERROR: dist/ folder not created by build"
        exit 1
      fi
    
    - echo "✅ Build completed successfully"
    
    # Remove dist from .gitignore if present
    - sed -i '/^dist$/d' .gitignore || true
    - sed -i '/^dist-ssr$/d' .gitignore || true
    
    # Configure git to use CI token for pushing
    - git remote set-url origin https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
    
    # Checkout the current branch (CI runs in detached HEAD)
    - git checkout -B ${CI_COMMIT_REF_NAME}
    
    # Add and commit dist folder
    - git add -f dist/
    - git add .gitignore
    
    # Only commit if there are changes
    - |
      if ! git diff --cached --quiet; then
        git commit -m "build: update dist folder [skip ci]" || true
        git push origin ${CI_COMMIT_REF_NAME}
        echo "✅ Dist folder committed and pushed"
      else
        echo "ℹ️ No changes to dist folder"
      fi
  
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  
  only:
    - main
    - master
  
  # Don't run if commit message contains [skip ci]
  except:
    variables:
      - $CI_COMMIT_MESSAGE =~ /\[skip ci\]/

trigger_homelab_deployment:
  stage: deploy
  # alpine rather than curlimages/curl so jq is available. Hand-escaping JSON
  # in shell is how the bug below happens.
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "🚀 Triggering homelab deployment..."

      # jq builds the payload. This is NOT shell injection: unlike GitHub's
      # ${{ }}, which is substituted into the script text before the shell runs,
      # ${CI_COMMIT_MESSAGE} is expanded at runtime and its value is never
      # re-evaluated, so $(...) in a commit message does not execute.
      #
      # It is JSON injection. Pasting the message straight into a hand-built
      # document means a message containing a quote produces malformed JSON, and
      # a crafted one closes the string and appends its own fields. Since
      # force_clean is a real deploy parameter, a commit message could set it.
      payload=$(jq -n \
        --arg branch "$CI_COMMIT_REF_NAME" \
        --arg sha "$CI_COMMIT_SHA" \
        --arg msg "$CI_COMMIT_MESSAGE" \
        '{event_type: "deploy-terrac-com",
          client_payload: {branch: $branch, sha: $sha, commit_message: $msg,
                           force_clean: false, source: "gitlab"}}')

      curl -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${HOMELAB_DEPLOY_TOKEN}" \
        https://api.github.com/repos/bluefishforsale/homelab/dispatches \
        --data "$payload"
      
      if [ $? -eq 0 ]; then
        echo "✅ Homelab deployment triggered successfully"
      else
        echo "⚠️ Failed to trigger homelab deployment (check HOMELAB_DEPLOY_TOKEN variable)"
        exit 0  # Don't fail the pipeline if webhook fails
      fi
  
  needs:
    - build_and_commit
  
  only:
    - main
    - master
  
  except:
    variables:
      - $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
