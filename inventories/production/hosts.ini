[macos]
# NOTE: every play aimed at all excludes this group (all:!macos), or it runs
# apt, systemd and docker tasks against a Mac. CI enforces it
# (.github/workflows/lib/playbooks-exclude-macos.test.sh). macos_runner.yaml is
# the one play that targets it.
# /usr/bin/python3 needs the Xcode command line tools, installed at bootstrap.
mini-tv ansible_user=tv ansible_ssh_host=192.168.1.35 ansible_python_interpreter=/usr/bin/python3

