---
# agentbox host configuration.
# Installs the multi-model agent toolchain (Claude Code premium lane + opencode
# free lanes), renders config/scripts/units, and enables the issue-watcher and
# escalation timers.
#
# ONE-TIME MANUAL BOOTSTRAP (cannot be automated; interactive OAuth):
#   ssh debian@agentbox
#   claude /login          # Pro/Max subscription. Do NOT export ANTHROPIC_API_KEY.
#   # ...and once per account in agentbox_accounts, since the OAuth token is
#   # per-HOME: ssh terrac@agentbox && claude /login
#   gh auth login          # only if no vaulted PAT (agentbox.fleet_pat)
#   gcloud auth login      # only if not using a vaulted service-account key
#   for r in homelab photonic_inventory my-ta-jose; do \
#     gh repo clone bluefishforsale/$r repos/$r; done   # rc-repo clones
#   # Fleet SSH: the playbook generates ~/.ssh/id_ed25519 and prints the pubkey.
#   # Paste it into https://github.com/settings/keys once; every host re-pulls
#   # https://github.com/bluefishforsale.keys every 5 minutes. Delete it there
#   # to revoke fleet-wide.
#   sudo systemctl start agentbox-rc@homelab.service     # ...per rc repo, after /login
#
# Structure mirrors playbooks/individual/ocean/ai/paia.yaml.

- name: Configure agentbox multi-model agent host
  hosts: agent_hosts
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../../../vault/secrets.yaml"

  vars:
    service: agentbox
    user: debian
    home: "/home/debian"
    # Accounts that get the developer environment on this box.
    #
    # `user` above stays the lane owner: the systemd units, the fleet SSH key
    # and the vault password are the unattended agent's alone, and a second copy
    # of any of them would be a second thing to revoke. Everything an
    # interactive session needs in order to behave like the laptop -- git
    # identity, gh credentials, the shared skills/commands/instructions, plugins
    # and MCP -- is per-account instead.
    #
    # terrac is the human account. 01_base_system creates it on every host
    # (playbooks/individual/base/users.yaml) but gives it only a shell and
    # authorized_keys, so an `ssh terrac@agentbox` session landed in an account
    # with no gitconfig, no gh auth and no ~/.claude at all, while every
    # provisioned thing sat in /home/debian.
    #
    # NOTE: both accounts are NOPASSWD sudo (users.yaml), so scoping the token
    # away from terrac would protect nothing it cannot already read out of
    # /home/debian. The trust boundary on this box is the box.
    agentbox_accounts:
      - name: debian
        home: /home/debian
        shell_rc: .bashrc
        git:
          - { k: user.name, v: agentbox }
          - { k: user.email, v: agentbox@terrac.com }
      - name: terrac
        home: /home/terrac
        shell_rc: .zshrc
        git:
          - { k: user.name, v: Terrac Skiens }
          - { k: user.email, v: "3721396+bluefishforsale@users.noreply.github.com" }
    files: "{{ playbook_dir }}/../../../files/agentbox"
    # Alert receiver: Alertmanager -> ntfy push + GitHub issues on the infra repo.
    # Ports hardcoded (not in vars_service_ports) so this deploy stays scoped.
    alert_receiver_port: 9098
    alert_ntfy_url: "http://ntfy.home:8090/homelab"
    alert_issue_repo: bluefishforsale/homelab
    # Deployable repos (Shape A/B) whose open issues the fleet resolves, plus
    # homelab itself.
    #
    # homelab is the master config repo, so merging there IS deploying to the
    # fleet. It is watched anyway, deliberately: the watcher only ever opens a
    # PR and labels it, and homelab is absent from agentbox_automerge_repos
    # below, so every agent change to the fleet waits on a human merge. The
    # decision being made here is "an agent may draft against production", not
    # "an agent may change production".
    #
    # The limits an agent must respect once it is drafting against this repo are
    # in files/agentbox/shared/AGENTS.md, because that is what the lanes
    # actually read: never DNS, never anything that could drop SSH, and one
    # service at a time.
    agentbox_repos:
      - homelab
      - paia
      - blog_terrac_com
      - my-ta-jose
      - photonic_inventory
      - terrac_com_2026
    # Whose issues either lane will act on. An issue body is a prompt for an
    # agent with write access, so this is the trust boundary, not a preference.
    agentbox_issue_authors:
      - bluefishforsale
    # Repos driven live via a per-repo Claude Code remote-control session
    # (systemd template agentbox-rc@<repo>.service, cwd repos/<repo>).
    agentbox_rc_repos:
      - homelab
      - photonic_inventory
      - my-ta-jose
    # Opt-in auto-merge allowlist (ADR 0001). Empty = every PR waits for a human
    # merge; listed repos auto-merge only no-prod-effect diffs.
    agentbox_automerge_repos: []
    # OpenTelemetry collector. Verify the latest contrib release at deploy time.
    otelcol_version: "0.105.0"
    # Third-party opencode OTel plugin. Pin; verify the published version at deploy.
    opencode_otel_plugin_version: "0.1.0"
    # Loki native OTLP ingest endpoint (ocean). Collector forwards logs here.
    LOKI_OTLP_URL: "http://192.168.1.143:3100/otlp"
    # Shared MCP servers distributed to BOTH lanes (opencode + Claude Code).
    # Neutral shape; rendered into each tool's config. Add a server here, deploy.
    #   - name: context7
    #     command: npx
    #     args: ["-y", "@upstash/context7-mcp"]
    #     env: {}
    #   - name: somehttp
    #     url: https://example.com/mcp
    #     headers: {Authorization: "Bearer ..."}
    # Plugins mirrored from the laptop so a phone session has the same
    # workflows. agentcraft is deliberately absent: on the laptop it is a
    # local-path install, not something a marketplace can resolve here.
    # NOTE: a marketplace here is third-party code that runs on this host. The
    # anthropics/ one is already trusted on the box; ponytail is not, and adding
    # a marketplace is the decision, not the install that follows it.
    agentbox_plugin_marketplaces:
      - DietrichGebert/ponytail
    agentbox_plugins:
      - ponytail@ponytail
      - superpowers@claude-plugins-official
      - pr-review-toolkit@claude-plugins-official
      - code-simplifier@claude-plugins-official
      - security-guidance@claude-plugins-official

    agentbox_mcp_servers:
      # Fleet memory (playbooks/individual/ocean/ai/mem0.yaml). One store for
      # every lane and the laptop, so a decision recorded in one place is
      # visible from the others. Port hardcoded rather than read from
      # vars_service_ports so a port bump there doesn't redeploy agentbox.
      - name: mem0
        url: "http://ocean.home:8766/mcp"
        headers:
          Authorization: "Bearer {{ ai_services.mem0.bridge_token }}"

  tasks:

  - name: Install base packages
    ansible.builtin.apt:
      name:
        - curl
        - ca-certificates
        - gnupg
        - git
        - jq
        - tmux
        - expect
        - nodejs
        - npm
        # Parity with the laptop toolchain: agents are told to reach for rg/fd,
        # and `make validate` in homelab shells out to ansible-playbook.
        - ripgrep
        - fd-find
        - ansible-core
        # agentbox sits inside the homelab network so it can verify a play
        # before shipping it (CONTEXT.md). Running one needs ansible-core above;
        # checking one needs the two linters CI runs, which were missing, so a
        # play could only be verified by pushing it and watching CI.
        # Note the skew: CI pip-installs the latest ansible-lint, Debian 12
        # ships 6.13. A local pass is indicative, not authoritative; a local
        # failure is still a true failure and that is where the value is.
        - ansible-lint
        - yamllint
        # Not used by anything here yet. It is what makes the CI-matching
        # install (`pip install --user ansible-lint`) possible without another
        # deploy, on a box where `python3 -m pip` is otherwise absent.
        - python3-pip
      state: present
      update_cache: yes

  # Debian ships the binary as `fdfind`; every agent instruction says `fd`.
  - name: Expose fd-find under its upstream name
    ansible.builtin.file:
      src: /usr/bin/fdfind
      dest: /usr/local/bin/fd
      state: link

  # --- Claude Code (apt repo) ---
  - name: Ensure apt keyrings dir exists
    ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: '0755'

  - name: Add GitHub CLI apt key
    ansible.builtin.get_url:
      url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
      dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
      mode: '0644'

  - name: Add GitHub CLI apt repository
    ansible.builtin.apt_repository:
      repo: "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
      filename: github-cli
      state: present

  # gcloud is out-of-scope for v1 (headless Google is optional; the issue->PR
  # loop needs only gh + claude + opencode). Its apt repo also breaks on Google's
  # rotated signing key. Re-add later by dearmoring the key:
  #   curl -fsSL .../apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
  - name: Install GitHub CLI
    ansible.builtin.apt:
      name:
        - gh
      state: latest
      update_cache: true

  # Claude Code comes from the official native installer, not apt. The apt repo
  # publishes late: it sat on 2.1.267-1 as both candidate and installed while
  # the laptop and tautog were already on 2.1.278, and a CLI that falls behind
  # desyncs from the remote-control server (it holds a live socket but spawns no
  # session). The native channel is also what the other two machines run, so this
  # is the one that gets parity instead of a third, slower release train.
  #
  # The installer puts everything under $HOME and refuses to run under sudo, so
  # it runs unprivileged once per account rather than once for the box.
  #
  # Bootstrap and upgrade are one task on purpose: the bootstrap script
  # re-downloads the whole ~217MB binary every time it runs, while
  # `claude install latest` fetches only when a newer build exists. So bootstrap
  # is the cold path and the installed binary updates itself after that.
  #
  # NOTE: changed is decided by the version symlink moving, not by grepping
  # installer output. Get that wrong and every deploy reports changed and
  # restarts all three RC lanes for nothing.
  - name: Install or update Claude Code (native installer)
    ansible.builtin.shell: |
      set -eu
      bin="$HOME/.local/bin/claude"
      before=$(readlink -f "$bin" 2>/dev/null || echo none)
      if [ -x "$bin" ]; then
        timeout 300 "$bin" install latest
      else
        timeout 600 bash -c 'curl -fsSL --connect-timeout 20 --max-time 540 https://claude.ai/install.sh | bash -s latest'
      fi
      [ -x "$bin" ] || { echo "installer left no $bin" >&2; exit 1; }
      [ "$(readlink -f "$bin")" = "$before" ] || echo VERSION-CHANGED
    become_user: "{{ item.name }}"
    environment:
      HOME: "{{ item.home }}"
    loop: "{{ agentbox_accounts }}"
    loop_control:
      label: "{{ item.name }}"
    register: agentbox_claude_native
    changed_when: "'VERSION-CHANGED' in agentbox_claude_native.stdout"
    notify: Restart RC sessions

  # Removed, not merely left unmanaged: /usr/bin/claude sitting next to
  # ~/.local/bin/claude means PATH order decides which binary a caller gets, and
  # that ambiguity is the whole reason this change exists. The repo and key go
  # with it so nothing can quietly reinstall the package later.
  #
  # NOTE: this must stay AFTER the native install above, so the box is never
  # without a claude. A live RC lane holds the deleted inode and keeps running;
  # it picks up the native binary when the handler restarts it, because the unit
  # PATH already prefers {{ home }}/.local/bin
  # (files/agentbox/agentbox-rc@.service.j2).
  - name: Remove the apt-packaged Claude Code
    ansible.builtin.apt:
      name: claude-code
      state: absent
    notify: Restart RC sessions

  - name: Remove the Claude Code apt repository
    ansible.builtin.apt_repository:
      repo: "deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/stable stable main"
      filename: claude-code
      state: absent

  - name: Remove the Claude Code apt signing key
    ansible.builtin.file:
      path: /etc/apt/keyrings/claude-code.asc
      state: absent

  # The npm package's postinstall is flaky at fetching the platform binary; the
  # official installer drops a self-contained binary. Install as the user (it
  # hardcodes $HOME/.opencode/bin) and symlink onto PATH for the systemd units.
  - name: Install opencode (official installer)
    ansible.builtin.shell: timeout 300 bash -c 'curl -fsSL --connect-timeout 20 --max-time 240 https://opencode.ai/install | bash'
    args:
      creates: "{{ home }}/.opencode/bin/opencode"
    become_user: "{{ user }}"
    environment:
      HOME: "{{ home }}"

  - name: Symlink opencode onto PATH
    ansible.builtin.file:
      src: "{{ home }}/.opencode/bin/opencode"
      dest: /usr/local/bin/opencode
      state: link

  # photonic_inventory is a uv project (uv.lock), so an RC session that cannot
  # see uv cannot run its tests. Hand-installed on the box since 2026-06-30;
  # adopting it here so a rebuild does not lose it.
  - name: Install uv (official installer)
    ansible.builtin.shell: timeout 300 bash -c 'curl -fsSL --connect-timeout 20 --max-time 240 https://astral.sh/uv/install.sh | sh'
    args:
      creates: "{{ home }}/.local/bin/uv"
    become_user: "{{ user }}"
    environment:
      HOME: "{{ home }}"

  # tvly backs the tavily-search skill; it authenticates from TAVILY_API_KEY in
  # agentbox.env, so there is no `tvly login` to do on the box. graphify is not
  # installed here on purpose: its skill runs its own `uv tool install` on first
  # use, which the unit PATH now picks up.
  - name: Install the Tavily CLI as a uv tool
    ansible.builtin.command: "{{ home }}/.local/bin/uv tool install tavily-cli"
    args:
      creates: "{{ home }}/.local/bin/tvly"
    become_user: "{{ user }}"
    environment:
      HOME: "{{ home }}"

  # --- Telemetry: OpenTelemetry Collector (contrib) ---
  - name: Download otelcol-contrib deb
    ansible.builtin.get_url:
      url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otelcol_version }}/otelcol-contrib_{{ otelcol_version }}_linux_amd64.deb"
      dest: "/tmp/otelcol-contrib_{{ otelcol_version }}.deb"
      mode: '0644'

  - name: Install otelcol-contrib
    ansible.builtin.apt:
      deb: "/tmp/otelcol-contrib_{{ otelcol_version }}.deb"

  # --- Host metrics: native node_exporter (agentbox runs no docker) ---
  - name: Install Prometheus node exporter
    ansible.builtin.apt:
      name: prometheus-node-exporter
      state: present

  - name: Enable systemd + processes collectors (lane liveness via node_systemd_unit_state)
    ansible.builtin.copy:
      dest: /etc/default/prometheus-node-exporter
      content: |
        # Managed by ansible (agentbox.yaml)
        ARGS="--collector.systemd --collector.processes"
      mode: '0644'
    notify: Restart node exporter

  - name: Enable and start node exporter
    ansible.builtin.systemd:
      name: prometheus-node-exporter
      enabled: yes
      state: started

  # --- Directories ---
  - name: Ensure agentbox directories exist
    ansible.builtin.file:
      path: "{{ item.0.home }}/{{ item.1 }}"
      state: directory
      owner: "{{ item.0.name }}"
      group: "{{ item.0.name }}"
      mode: '0755'
    loop: "{{ agentbox_accounts | product(['repos', 'work', 'agent-logs', '.config/opencode', '.config/opencode/skills', '.config/opencode/commands', '.config/agentbox', '.claude', '.claude/skills', '.claude/commands']) | list }}"
    loop_control:
      label: "{{ item.0.name }}:{{ item.1 }}"

  # RC clones belong to the lane owner only; the units' WorkingDirectory is
  # {{ home }}/repos/<repo>, so a second copy elsewhere would just go stale.
  - name: Ensure RC lane repo directories exist
    ansible.builtin.file:
      path: "{{ home }}/repos/{{ item }}"
      state: directory
      owner: "{{ user }}"
      group: "{{ user }}"
      mode: '0755'
    loop: "{{ agentbox_rc_repos }}"

  # --- git config per account (commit identity + token-backed https) ---
  # The lane commits as `agentbox`; the human account commits as itself, so a
  # push from an interactive session is not attributed to the robot.
  - name: Set git commit identity per account
    ansible.builtin.command: "git config --global {{ item.1.k }} \"{{ item.1.v }}\""
    become_user: "{{ item.0.name }}"
    environment:
      HOME: "{{ item.0.home }}"
    loop: "{{ agentbox_accounts | subelements('git') }}"
    loop_control:
      label: "{{ item.0.name }} {{ item.1.k }}"
    changed_when: false

  - name: Register gh as the git credential helper (authenticated https)
    ansible.builtin.command: gh auth setup-git
    become_user: "{{ item.name }}"
    environment:
      HOME: "{{ item.home }}"
      GH_TOKEN: "{{ (agentbox | default({})).fleet_pat | default('') }}"
    loop: "{{ agentbox_accounts }}"
    loop_control:
      label: "{{ item.name }}"
    changed_when: false

  # --- Fleet SSH (remediation from a phone-driven RC session) ---
  # Every fleet host pulls authorized_keys from https://github.com/<user>.keys
  # and re-pulls every 5 minutes (playbooks/individual/base/authorized_keys.yaml),
  # so this key is granted and revoked THERE, not by a fleet-wide apply.
  # NOTE: adding the pubkey to that account grants shell on every host in the
  # inventory. Deleting it from GitHub removes that within 5 minutes.
  - name: Generate the agentbox fleet SSH key
    ansible.builtin.user:
      name: "{{ user }}"
      generate_ssh_key: true
      ssh_key_type: ed25519
      ssh_key_file: .ssh/id_ed25519
      ssh_key_comment: "agentbox@{{ ansible_hostname }}"
    register: agentbox_ssh_key

  - name: Render the fleet ssh_config
    ansible.builtin.template:
      src: "{{ files }}/ssh_config.j2"
      dest: "{{ home }}/.ssh/config"
      owner: "{{ user }}"
      group: "{{ user }}"
      mode: '0600'

  - name: Show the pubkey to authorize (first run only)
    ansible.builtin.debug:
      msg: >-
        Add to https://github.com/settings/keys, then the fleet accepts it
        within 5 minutes: {{ agentbox_ssh_key.ssh_public_key }}
    when: agentbox_ssh_key.ssh_public_key is defined

  # --- Config + secrets ---
  - name: Render opencode config
    ansible.builtin.template:
      src: "{{ files }}/opencode.json.j2"
      dest: "{{ item.home }}/.config/opencode/opencode.json"
      owner: "{{ item.name }}"
      group: "{{ item.name }}"
      # 0600: MCP server headers put a bearer token in this file.
      mode: '0600'
    loop: "{{ agentbox_accounts }}"
    loop_control:
      label: "{{ item.name }}"

  # NOTE: systemd reads EnvironmentFile once, at unit start, so a long-running
  # unit keeps the values it booted with. Rendering a new GH_TOKEN here without
  # restarting left every lane and the alert receiver authenticating with the
  # revoked one until a human bounced them by hand.
  - name: Render agentbox environment file
    ansible.builtin.template:
      src: "{{ files }}/agentbox.env.j2"
      dest: "{{ item.home }}/.config/agentbox/agentbox.env"
      owner: "{{ item.name }}"
      group: "{{ item.name }}"
      mode: '0600'
    loop: "{{ agentbox_accounts }}"
    loop_control:
      label: "{{ item.name }}"
    notify:
      - Restart RC sessions
      - Restart alert receiver

  # GH_TOKEN, the ntfy creds and TAVILY_API_KEY reach the lanes through the
  # units' EnvironmentFile. A login shell reads nothing of the sort, so
  # `gh auth status` in an interactive session reported "not logged into any
  # GitHub hosts" on a box whose unattended lanes were authenticating fine --
  # and every hand-run `gh`/`git push`/`tvly` failed for the same reason.
  # Sourcing it from the rc puts both entry points on the same environment.
  - name: Source the agentbox environment from interactive shells
    ansible.builtin.blockinfile:
      path: "{{ item.home }}/{{ item.shell_rc }}"
      create: true
      owner: "{{ item.name }}"
      group: "{{ item.name }}"
      mode: '0644'
      marker: "# {mark} ANSIBLE MANAGED: agentbox environment"
      block: |
        if [ -r "$HOME/.config/agentbox/agentbox.env" ]; then
          set -a
          . "$HOME/.config/agentbox/agentbox.env"
          set +a
        fi
    loop: "{{ agentbox_accounts }}"
    loop_control:
      label: "{{ item.name }}:{{ item.shell_rc }}"

  - name: Write Google service-account credentials (when present in vault)
    ansible.builtin.copy:
      content: "{{ (agentbox | default({})).gcloud_sa_json | default('') }}"
      dest: "{{ home }}/.config/agentbox/gcloud-sa.json"
      owner: "{{ user }}"
      group: "{{ user }}"
      mode: '0600'
    when: (agentbox | default({})).gcloud_sa_json | default('') | length > 0

  # Shipping a homelab fix from a phone session means reading vault-encrypted
  # vars and running `make validate`, both of which need this file. main-apply
  # already has the password in the apply step's environment, so this introduces
  # no new secret location: the password is never written into the repo or the
  # vault. Any other entry point (workflow_dispatch of a different workflow, a
  # laptop run) leaves the file untouched rather than writing an empty one.
  - name: Install the vault password file for the agent lanes
    ansible.builtin.copy:
      content: "{{ lookup('env', 'ANSIBLE_VAULT_PASSWORD') }}\n"
      dest: "{{ home }}/.ansible_vault_pass"
      owner: "{{ user }}"
      group: "{{ user }}"
      mode: '0600'
    no_log: true
    when: lookup('env', 'ANSIBLE_VAULT_PASSWORD') | length > 0

  - name: Say why the vault password file was skipped
    ansible.builtin.debug:
      msg: >-
        ANSIBLE_VAULT_PASSWORD is not in this run's environment, so
        {{ home }}/.ansible_vault_pass was left as-is. Deploy via main-apply
        (push to master) to install or rotate it.
    when: lookup('env', 'ANSIBLE_VAULT_PASSWORD') | length == 0

  - name: Render OpenTelemetry Collector config
    ansible.builtin.template:
      src: "{{ files }}/otelcol-config.yaml.j2"
      dest: /etc/otelcol-contrib/config.yaml
      mode: '0644'
    notify: Restart otelcol

  - name: Enable and start otelcol-contrib
    ansible.builtin.systemd:
      name: otelcol-contrib
      enabled: yes
      state: started

  # --- Scripts ---
  - name: Install agent scripts
    ansible.builtin.template:
      src: "{{ files }}/{{ item.src }}"
      dest: "/usr/local/bin/{{ item.dest }}"
      mode: '0755'
    loop:
      - { src: issue-watcher.sh, dest: agentbox-issue-watcher.sh }
      - { src: escalate.sh, dest: agentbox-escalate.sh }
      - { src: roadmap-reconcile.sh, dest: agentbox-roadmap-reconcile.sh }
      - { src: trust-dir.sh, dest: agentbox-trust-dir.sh }
      - { src: notify-auth-expired.sh, dest: agentbox-notify-auth-expired.sh }
      - { src: rc-launch.sh, dest: agentbox-rc-launch.sh }
      - { src: alert-receiver.py, dest: agentbox-alert-receiver.py }
    # Two of these are the ExecStart of a long-running unit, so the process is
    # already running the previous copy: rc-launch.sh for agentbox-rc@, and
    # alert-receiver.py for the receiver. PR #479 landed a launcher fix at
    # 16:29 that the lanes, up since 14:18, never executed. The rest are
    # timer-driven and re-exec on their own, so notifying costs them nothing.
    notify:
      - Restart RC sessions
      - Restart alert receiver

  # Installed with copy, NOT template: the PromQL inside contains `{{device=...}}`
  # (an f-string brace escape) which jinja would try to evaluate. It reads its
  # config from the environment instead.
  - name: Install the [replace] issue reconciler
    ansible.builtin.copy:
      src: "{{ files }}/replace-issue-reconcile.py"
      dest: /usr/local/bin/agentbox-replace-issue-reconcile.py
      mode: '0755'

  # Renaming a script installs the new name but leaves the old one on PATH, so
  # the box keeps a copy of code that master no longer has. Harmless until
  # someone runs it and gets the previous behaviour back. Deployed state has to
  # equal the repo, so removals are declared, not assumed.
  - name: Remove agent scripts that have been renamed away
    ansible.builtin.file:
      path: "/usr/local/bin/{{ item }}"
      state: absent
    loop:
      - agentbox-escalate-to-claude.sh   # -> agentbox-escalate.sh (PR #374)

  # --- systemd units ---
  - name: Install systemd units
    ansible.builtin.template:
      src: "{{ files }}/{{ item }}.j2"
      dest: "/etc/systemd/system/{{ item }}"
      mode: '0644'
    loop:
      - agentbox-issue-watcher.service
      - agentbox-issue-watcher.timer
      - agentbox-escalate.service
      - agentbox-escalate.timer
      - agentbox-roadmap-reconcile.service
      - agentbox-roadmap-reconcile.timer
      - agentbox-replace-reconcile.service
      - agentbox-replace-reconcile.timer
      - agentbox-alert-receiver.service
      - "agentbox-rc@.service"
    notify: Reload systemd daemon

  - name: Flush handlers so units are registered before enabling
    ansible.builtin.meta: flush_handlers

  - name: Enable agent timers
    ansible.builtin.systemd:
      name: "{{ item }}"
      enabled: yes
      state: started
      daemon_reload: yes
    loop:
      - agentbox-issue-watcher.timer
      - agentbox-escalate.timer
      - agentbox-roadmap-reconcile.timer
      - agentbox-replace-reconcile.timer

  - name: Enable and start the alert receiver
    ansible.builtin.systemd:
      name: agentbox-alert-receiver.service
      enabled: yes
      state: restarted
      daemon_reload: yes

  # Per-repo remote-control instances are enabled (start on boot) but not
  # started now: they need the one-time interactive `claude /login` and a clone
  # of each repo into repos/<repo> first (see header). After bootstrap they
  # come up on the next boot or via `systemctl start`.
  - name: Enable and start per-repo remote-control instances
    ansible.builtin.systemd:
      name: "agentbox-rc@{{ item }}.service"
      enabled: yes
      state: started
      daemon_reload: yes
    loop: "{{ agentbox_rc_repos }}"

  # An RC lane's websocket to claude.ai can die silently: the process stays
  # alive (so Restart=always never fires) but stops receiving, and the app sees
  # a dead environment. A healthy lane receives keepalive data every few seconds,
  # so a lane with no claude child, no ESTABLISHED :443 socket, or no inbound for
  # 3 minutes is hung — restart it.
  - name: Install RC liveness watchdog script
    ansible.builtin.copy:
      dest: /usr/local/sbin/agentbox-rc-watchdog
      mode: '0755'
      content: |
        #!/bin/sh
        set -eu
        STALE_MS=180000
        systemctl list-units 'agentbox-rc@*.service' --state=active --no-legend --plain 2>/dev/null \
          | awk '{print $1}' | while read -r unit; do
            lane=$(echo "$unit" | sed -E 's/agentbox-rc@(.*)\.service/\1/')
            exp=$(pgrep -f "claude remote-control --name $lane" | head -1 || true)
            cpid=""
            [ -n "$exp" ] && cpid=$(pgrep -P "$exp" -x claude | head -1 || true)
            reason=""
            if [ -z "$cpid" ]; then
              reason="no claude process"
            else
              age=$(ps -o etimes= -p "$cpid" 2>/dev/null | tr -d ' ' || echo 0)
              maxrcv=$(ss -tinp state established "dst :443" 2>/dev/null \
                | grep -A1 "pid=$cpid," | grep -oE 'lastrcv:[0-9]+' \
                | cut -d: -f2 | sort -n | tail -1 || true)
              if [ -z "$maxrcv" ]; then
                # grace: a freshly-spawned claude takes a few seconds to connect
                [ "${age:-0}" -ge 90 ] && reason="no :443 socket"
              elif [ "$maxrcv" -gt "$STALE_MS" ]; then
                reason="stale lastrcv=${maxrcv}ms"
              fi
            fi
            if [ -n "$reason" ]; then
              logger -t agentbox-rc-watchdog "restarting $lane: $reason"
              # An expired subscription session is NOT fixed by restarting: the
              # unit flaps every 2 minutes forever and nobody is told. RC is the
              # only place Claude Code still runs, so this is where that alarm
              # has to live now that the unattended lanes are on opencode.
              recent=$(journalctl -u "$unit" -n 40 --no-pager 2>/dev/null || true)
              /usr/local/bin/agentbox-notify-auth-expired.sh "RC session $lane" "$recent" || true
              systemctl restart "$unit"
            fi
          done

  - name: Install RC watchdog service and timer
    ansible.builtin.copy:
      dest: "/etc/systemd/system/{{ item.name }}"
      mode: '0644'
      content: "{{ item.content }}"
    loop:
      - name: agentbox-rc-watchdog.service
        content: |
          [Unit]
          Description=Restart hung agentbox RC lanes (dead websocket)
          [Service]
          Type=oneshot
          # ntfy credentials for the auth-expired alarm above.
          EnvironmentFile=-{{ home }}/.config/agentbox/agentbox.env
          ExecStart=/usr/local/sbin/agentbox-rc-watchdog
      - name: agentbox-rc-watchdog.timer
        content: |
          [Unit]
          Description=Run the agentbox RC liveness watchdog every 2 minutes
          [Timer]
          OnBootSec=3min
          OnUnitActiveSec=2min
          Unit=agentbox-rc-watchdog.service
          [Install]
          WantedBy=timers.target
    loop_control:
      label: "{{ item.name }}"

  - name: Enable RC watchdog timer
    ansible.builtin.systemd:
      name: agentbox-rc-watchdog.timer
      enabled: yes
      state: started
      daemon_reload: yes

  - name: Note remote-control requires manual login + repo clones
    ansible.builtin.debug:
      msg: "On agentbox: 'claude /login', clone each agentbox_rc_repos into repos/<repo>, then 'systemctl start agentbox-rc@<repo>.service'."

  # --- Shared agent config (skills, commands, scripts, MCP) ---
  # One source tree (files/agentbox/shared) fanned out to both lanes. Autonomous
  # lanes (opencode run, claude -p) spawn fresh per issue and pick changes up on
  # the next tick; long-lived RC sessions are restarted by the handler.
  - name: Sync shared skills to both lanes
    ansible.builtin.copy:
      src: "{{ files }}/shared/skills/"
      dest: "{{ item.0.home }}/{{ item.1 }}/skills/"
      owner: "{{ item.0.name }}"
      group: "{{ item.0.name }}"
      mode: '0644'
      # Skills ship as <name>/SKILL.md; without this the nested dirs
      # inherit 0644 and become untraversable, so the skill silently vanishes.
      directory_mode: '0755'
    loop: "{{ agentbox_accounts | product(['.claude', '.config/opencode']) | list }}"
    loop_control:
      label: "{{ item.0.name }}:{{ item.1 }}"
    notify: Restart RC sessions

  - name: Sync shared commands to both lanes
    ansible.builtin.copy:
      src: "{{ files }}/shared/commands/"
      dest: "{{ item.0.home }}/{{ item.1 }}/commands/"
      owner: "{{ item.0.name }}"
      group: "{{ item.0.name }}"
      mode: '0644'
    loop: "{{ agentbox_accounts | product(['.claude', '.config/opencode']) | list }}"
    loop_control:
      label: "{{ item.0.name }}:{{ item.1 }}"
    notify: Restart RC sessions

  - name: Install shared agent scripts on PATH
    ansible.builtin.copy:
      src: "{{ item }}"
      dest: "/usr/local/bin/{{ item | basename }}"
      mode: '0755'
    with_fileglob: "{{ files }}/shared/bin/*"
    notify: Restart RC sessions

  - name: Sync shared instructions (opencode AGENTS.md + Claude import target)
    ansible.builtin.copy:
      src: "{{ files }}/shared/AGENTS.md"
      dest: "{{ item.0.home }}/{{ item.1 }}"
      owner: "{{ item.0.name }}"
      group: "{{ item.0.name }}"
      mode: '0644'
    loop: "{{ agentbox_accounts | product(['.config/opencode/AGENTS.md', '.claude/AGENTS.md']) | list }}"
    loop_control:
      label: "{{ item.0.name }}:{{ item.1 }}"
    notify: Restart RC sessions

  - name: Point Claude user memory at the shared instructions
    ansible.builtin.copy:
      content: "@AGENTS.md\n"
      dest: "{{ item.home }}/.claude/CLAUDE.md"
      owner: "{{ item.name }}"
      group: "{{ item.name }}"
      mode: '0644'
    loop: "{{ agentbox_accounts }}"
    loop_control:
      label: "{{ item.name }}"
    notify: Restart RC sessions

  # MCP into Claude is added (not templated): ~/.claude.json also holds Claude's
  # own runtime state, so we merge via the CLI instead of overwriting the file.
  # Add-only: a server already registered is skipped, so rotating a header token
  # needs `claude mcp remove <name>` on the box before the next deploy re-adds it.
  # Whole section is gated on having servers so a fresh/unauthenticated `claude`
  # is never invoked at deploy time (it can block on first-run). `timeout` is a
  # belt-and-suspenders guard against any CLI hang.
  #
  # NOTE: every `claude` task from here down carries the account's ~/.local/bin
  # in `environment.PATH`. The command module does not read the account's shell
  # rc, so a bare `claude` would resolve against the connection PATH only, and
  # the native install lives under $HOME. Same prefix the units use
  # (files/agentbox/agentbox-rc@.service.j2), so deploy-time and runtime resolve
  # to the same binary. Prepend rather than an absolute path, because `claude`
  # shells out (git, npm) during `plugin install` and still needs a real PATH.
  - name: List Claude MCP servers (user scope)
    ansible.builtin.command: timeout 30 claude mcp list
    become_user: "{{ item.name }}"
    environment:
      HOME: "{{ item.home }}"
      PATH: "{{ item.home }}/.local/bin:{{ ansible_env.PATH }}"
    loop: "{{ agentbox_accounts }}"
    loop_control:
      label: "{{ item.name }}"
    register: claude_mcp_list
    changed_when: false
    failed_when: false
    when: agentbox_mcp_servers | length > 0

  # Each account has its own ~/.claude.json, so the gate below has to ask
  # "registered for THIS account", not "registered anywhere on the box".
  # NOTE: `command` does not run under --check, so stdout is absent there and
  # the default('') makes every server look unregistered. That is the safe
  # direction: a dry run over-reports what it would add, rather than crashing.
  - name: Index the MCP listing per account
    ansible.builtin.set_fact:
      agentbox_mcp_present: "{{ dict(claude_mcp_list.results | map(attribute='item.name') | zip(claude_mcp_list.results | map(attribute='stdout', default=''))) }}"
    when: agentbox_mcp_servers | length > 0

  - name: Register shared MCP servers in Claude Code (user scope)
    ansible.builtin.command: >
      timeout 30 claude mcp add-json {{ item.1.name | quote }}
      {{ ({'type': 'http', 'url': item.1.url, 'headers': item.1.headers | default({})} if item.1.url is defined
          else {'type': 'stdio', 'command': item.1.command, 'args': item.1.args | default([]), 'env': item.1.env | default({})}) | to_json | quote }}
      --scope user
    become_user: "{{ item.0.name }}"
    environment:
      HOME: "{{ item.0.home }}"
      PATH: "{{ item.0.home }}/.local/bin:{{ ansible_env.PATH }}"
    loop: "{{ agentbox_accounts | product(agentbox_mcp_servers) | list }}"
    when:
      - agentbox_mcp_servers | length > 0
      - item.1.name not in (agentbox_mcp_present[item.0.name] | default(''))
    no_log: true
    notify: Restart RC sessions

  # Plugins, like MCP, go in through the CLI rather than a template: they live
  # in ~/.claude/plugins alongside Claude's own runtime state, and installing
  # them upstream keeps provenance and leaves `claude plugin update` meaningful.
  # Both steps are add-only, so upgrading one is a command on the box, not a
  # redeploy. --yes is required because stdout is not a TTY under ansible.
  - name: List Claude plugin marketplaces
    ansible.builtin.command: timeout 60 claude plugin marketplace list
    become_user: "{{ item.name }}"
    environment:
      HOME: "{{ item.home }}"
      PATH: "{{ item.home }}/.local/bin:{{ ansible_env.PATH }}"
    loop: "{{ agentbox_accounts }}"
    loop_control:
      label: "{{ item.name }}"
    register: claude_marketplace_list
    changed_when: false
    failed_when: false

  - name: Index the marketplace listing per account
    ansible.builtin.set_fact:
      agentbox_marketplaces_present: "{{ dict(claude_marketplace_list.results | map(attribute='item.name') | zip(claude_marketplace_list.results | map(attribute='stdout', default=''))) }}"

  - name: Add missing plugin marketplaces
    ansible.builtin.command: timeout 180 claude plugin marketplace add {{ item.1 | quote }}
    become_user: "{{ item.0.name }}"
    environment:
      HOME: "{{ item.0.home }}"
      PATH: "{{ item.0.home }}/.local/bin:{{ ansible_env.PATH }}"
    loop: "{{ agentbox_accounts | product(agentbox_plugin_marketplaces) | list }}"
    loop_control:
      label: "{{ item.0.name }}:{{ item.1 }}"
    when: item.1.split('/') | last not in (agentbox_marketplaces_present[item.0.name] | default(''))

  - name: List installed Claude plugins
    ansible.builtin.command: timeout 60 claude plugin list
    become_user: "{{ item.name }}"
    environment:
      HOME: "{{ item.home }}"
      PATH: "{{ item.home }}/.local/bin:{{ ansible_env.PATH }}"
    loop: "{{ agentbox_accounts }}"
    loop_control:
      label: "{{ item.name }}"
    register: claude_plugin_list
    changed_when: false
    failed_when: false

  - name: Index the plugin listing per account
    ansible.builtin.set_fact:
      agentbox_plugins_present: "{{ dict(claude_plugin_list.results | map(attribute='item.name') | zip(claude_plugin_list.results | map(attribute='stdout', default=''))) }}"

  - name: Install shared Claude plugins
    ansible.builtin.command: timeout 300 claude plugin install --yes {{ item.1 | quote }}
    become_user: "{{ item.0.name }}"
    environment:
      HOME: "{{ item.0.home }}"
      PATH: "{{ item.0.home }}/.local/bin:{{ ansible_env.PATH }}"
    loop: "{{ agentbox_accounts | product(agentbox_plugins) | list }}"
    loop_control:
      label: "{{ item.0.name }}:{{ item.1 }}"
    when: item.1.split('@') | first not in (agentbox_plugins_present[item.0.name] | default(''))
    notify: Restart RC sessions

  handlers:
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      daemon_reload: yes

  - name: Restart node exporter
    ansible.builtin.systemd:
      name: prometheus-node-exporter
      state: restarted

  - name: Restart otelcol
    ansible.builtin.systemd:
      name: otelcol-contrib
      state: restarted

  # Kept out of the RC glob below on purpose: this is a different service with a
  # different blast radius, and a skills sync has no business bouncing it. Only
  # the two inputs it actually reads -- its own code and the env file -- notify
  # it. Restarting is safe: Alertmanager retries a refused POST.
  - name: Restart alert receiver
    ansible.builtin.systemd:
      name: agentbox-alert-receiver.service
      state: restarted

  # try-restart only touches active instances (no-op before first login), so a
  # shared-config change reloads any live RC session without starting new ones.
  - name: Restart RC sessions
    # restart, not try-restart: try-restart skips units that are stopped/failed,
    # leaving a dead lane dead. restart revives them so config changes reconcile
    # every configured lane back up.
    ansible.builtin.command: systemctl restart 'agentbox-rc@*.service'
    changed_when: true
