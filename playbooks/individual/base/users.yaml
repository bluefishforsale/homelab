- name: Install and configure zsh and tools for users
  hosts: all
  become: true
  vars_files:
    - ../../../vault/secrets.yaml
  vars:
    # NOTE: this user's dotfiles belong to bluefishforsale/chezmoi. The shell
    # tasks below skip them, because writing .zshrc/.tmux.conf or wiping
    # ~/.oh-my-zsh here reverts chezmoi on every base run.
    chezmoi_user: terrac
    chezmoi_home: /home/terrac
    chezmoi_version: "2.73.3"

  tasks:
    - name: Handle dpkg locks and repair
      include_tasks: ../../tasks/dpkg_lock.yaml
      ignore_errors: yes

    - name: Update apt cache if not done in the last 24 hours
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 86400  # 24 hours

    - name: Install common packages
      apt:
        name: "{{ item }}"
        state: present
      with_items:
        - zsh
        - git
        - cron
        - sudo
      ignore_errors: yes

    # Define user details with centralized uid/gid from vault.
    # 'debian' is the cloud-init login user Ansible connects as on VMs;
    # usermod can't modify an in-use account, so it is not managed here.
    # Appliance hosts (e.g. pihole) set manage_service_users=false to skip
    # media/terrac, whose uid/gid collide with pre-existing service accounts.
    - name: Set user details
      set_fact:
        users: "{{ (service_users if (manage_service_users | default(true) | bool) else []) + [{'user_name': 'root', 'user_home': '/root'}] }}"
      vars:
        service_users:
          - { user_name: "media", user_home: "/home/media", uid: "{{ system_users.media.uid }}", gid: "{{ system_users.media.gid }}" }
          - { user_name: "terrac", user_home: "/home/terrac", uid: "{{ system_users.terrac.uid }}", gid: "{{ system_users.terrac.gid }}" }

    - name: Read existing accounts
      ansible.builtin.getent:
        database: passwd

    # NOTE: an existing account on the wrong id must fail here, before the
    # group and user tasks below groupmod/usermod it into place. That moves the
    # account but not its files, and NFS and rsync share by number.
    # Renumbering is a hand-run job.
    - name: Existing managed accounts already carry the vault's uid/gid
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd[user.user_name][1] == user.uid | string
          - ansible_facts.getent_passwd[user.user_name][2] == user.gid | string
        fail_msg: >-
          {{ user.user_name }} is {{ ansible_facts.getent_passwd[user.user_name][1] }}:{{ ansible_facts.getent_passwd[user.user_name][2] }}
          on {{ inventory_hostname }}, vault says {{ user.uid }}:{{ user.gid }}
        quiet: true
      loop: "{{ users }}"
      loop_control:
        loop_var: user
      when:
        - user.uid is defined
        - user.user_name in ansible_facts.getent_passwd

    - name: Ensure user groups exist with specified GIDs
      ansible.builtin.group:
        name: "{{ user.user_name }}"
        gid: "{{ user.gid | default(omit) }}"
        state: present
      loop: "{{ users }}"
      loop_control:
        loop_var: user
      when: user.gid is defined

    # Users are added to the docker group below, but docker (and its group)
    # is installed by a later playbook. Pre-create the group so user creation
    # doesn't fail on fresh hosts; docker's postinst reuses an existing group.
    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Ensure the user exists with specified UIDs/GIDs
      ansible.builtin.user:
        name: "{{ user.user_name }}"
        uid: "{{ user.uid | default(omit) }}"
        group: "{{ user.user_name if user.gid is defined else omit }}"
        groups: "{{ 'sudo,docker' if user.user_name != 'root' else omit }}"
        append: yes
        state: present
        create_home: yes
        shell: /bin/bash
      loop: "{{ users }}"
      loop_control:
        loop_var: user

    - name: Add user to sudoers with no password
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        state: present
        regexp: "^{{ user.user_name }} ALL=.*"
        line: "{{ user.user_name }} ALL=(ALL) NOPASSWD:ALL"
        validate: "visudo -cf %s"
      loop: "{{ users }}"
      loop_control:
        loop_var: user

    - name: Create .ssh directory
      ansible.builtin.file:
        path: "/home/{{ user.user_name }}/.ssh"
        state: directory
        owner: "{{ user.user_name }}"
        mode: '0700'
      loop: "{{ users }}"
      loop_control:
        loop_var: user

    - name: Download SSH key from GitHub
      ansible.builtin.get_url:
        url: https://github.com/bluefishforsale.keys
        dest: "{{ user.user_home }}/.ssh/authorized_keys"
        mode: '0600'
        owner: "{{ user.user_name }}"
        timeout: 30
      loop: "{{ users }}"
      loop_control:
        loop_var: user

    - name: Download default .zshrc from Oh My Zsh repository
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/templates/zshrc.zsh-template
        dest: "{{ user.user_home }}/.zshrc"
        owner: "{{ user.user_name }}"
        group: "{{ user.user_name }}"
        mode: '0644'
      loop: "{{ users }}"
      loop_control:
        loop_var: user
      when: user.user_name != chezmoi_user

    - name: Change user shell to zsh
      ansible.builtin.shell: chsh -s /usr/bin/zsh {{ user.user_name }}
      loop: "{{ users }}"
      loop_control:
        loop_var: user
      ignore_errors: yes

    - name: Download oh-my-zsh installer
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
        dest: /tmp/oh-my-zsh-installer.sh
        mode: "0755"
      loop: "{{ users }}"
      loop_control:
        loop_var: user
      ignore_errors: yes

    - name: Recursively remove the .oh-my-zsh directory from the user's home
      ansible.builtin.shell: rm -rf "{{ user.user_home }}/.oh-my-zsh"
      loop: "{{ users }}"
      loop_control:
        loop_var: user
      when: user.user_name != chezmoi_user
      ignore_errors: yes

    - name: Install oh-my-zsh
      ansible.builtin.shell: ZSH="" /tmp/oh-my-zsh-installer.sh --unattended
      args:
        creates: "{{ user.user_home }}/.oh-my-zsh"
      become_user: "{{ user.user_name }}"
      loop: "{{ users }}"
      loop_control:
        loop_var: user
      ignore_errors: yes

    - name: Set ZSH directory in .zshrc
      ansible.builtin.lineinfile:
        path: "{{ user.user_home }}/.zshrc"
        regexp: '^ZSH='
        line: 'ZSH="{{ user.user_home }}/.oh-my-zsh"'
      loop: "{{ users }}"
      loop_control:
        loop_var: user
      when: user.user_name != chezmoi_user
      ignore_errors: yes

    - name: Install Powerlevel10k theme for Oh My Zsh
      ansible.builtin.git:
        repo: "https://github.com/romkatv/powerlevel10k.git"
        dest: "{{ user.user_home }}/.oh-my-zsh/custom/themes/powerlevel10k"
        depth: 1
        update: yes
      loop: "{{ users }}"
      loop_control:
        loop_var: user
      become_user: "{{ user.user_name }}"
      ignore_errors: yes

    - name: Set powerlevel10k theme in .zshrc
      ansible.builtin.lineinfile:
        path: "{{ user.user_home }}/.zshrc"
        state: present
        regexp: '^ZSH_THEME='
        line: 'ZSH_THEME="powerlevel10k/powerlevel10k"'
      loop: "{{ users }}"
      loop_control:
        loop_var: user
      when: user.user_name != chezmoi_user
      ignore_errors: yes

    - name: Disable powerlevel10k configuration wizard
      ansible.builtin.lineinfile:
        path: "{{ user.user_home }}/.zshrc"
        state: present
        line: 'POWERLEVEL9K_DISABLE_CONFIGURATION_WIZARD=true'
      loop: "{{ users }}"
      loop_control:
        loop_var: user
      when: user.user_name != chezmoi_user
      ignore_errors: yes

    - name: Copy p10k config file
      ansible.builtin.copy:
        src: ../../../files/shell/p10k.zsh
        dest: "{{ user.user_home }}/.p10k.zsh"
        mode: "0755"
      loop: "{{ users }}"
      loop_control:
        loop_var: user
      ignore_errors: yes

    - name: Copy tmux config
      ansible.builtin.copy:
        src: ../../../files/shell/tmux.conf
        dest: "{{ user.user_home }}/.tmux.conf"
      loop: "{{ users }}"
      loop_control:
        loop_var: user
      when: user.user_name != chezmoi_user
      ignore_errors: yes

    # Bootstrap only: once the source exists the user runs `chezmoi update`
    # themselves, since an unattended apply over a hand-edited file fails
    # without a TTY. Runs last so oh-my-zsh and powerlevel10k are already in
    # place; chezmoi writes into ~/.oh-my-zsh/custom, and the installer above
    # skips any home where ~/.oh-my-zsh already exists.
    - name: Bootstrap chezmoi dotfiles for {{ chezmoi_user }}
      when:
        - chezmoi_user in users | map(attribute='user_name')
        - ansible_architecture == 'x86_64'
      become_user: "{{ chezmoi_user }}"
      environment:
        HOME: "{{ chezmoi_home }}"
      block:
        - name: Check for an existing chezmoi source
          ansible.builtin.stat:
            path: "{{ chezmoi_home }}/.local/share/chezmoi"
          register: chezmoi_source

        - name: Install chezmoi on first bootstrap
          when: not chezmoi_source.stat.exists
          block:
            # The private repos are cloned over ssh, and the fleet's ssh config
            # turns host-key checking off. Pin github.com to its published keys
            # (fetched over TLS) in the same file chezmoi's ssh config uses.
            - name: Fetch GitHub's published SSH host keys
              ansible.builtin.uri:
                url: https://api.github.com/meta
                return_content: true
              register: github_meta

            - name: Ensure ~/.ssh exists
              ansible.builtin.file:
                path: "{{ chezmoi_home }}/.ssh"
                state: directory
                mode: "0700"

            - name: Pin github.com host keys
              ansible.builtin.copy:
                content: "{% for key in github_meta.json.ssh_keys %}github.com {{ key }}\n{% endfor %}"
                dest: "{{ chezmoi_home }}/.ssh/known_hosts.github"
                mode: "0644"

            # Hosts where the user has no GitHub-registered key skip the
            # bootstrap instead of failing the base run.
            - name: Probe GitHub access with the user's own key
              ansible.builtin.command: >-
                ssh -o BatchMode=yes -o StrictHostKeyChecking=yes
                -o UserKnownHostsFile={{ chezmoi_home }}/.ssh/known_hosts.github
                -T git@github.com
              register: github_probe
              changed_when: false
              failed_when: false

            - name: Report hosts skipped for lack of GitHub access
              ansible.builtin.debug:
                msg: "{{ chezmoi_user }} on {{ inventory_hostname }} cannot reach GitHub over ssh; skipping chezmoi bootstrap"
              when: "'successfully authenticated' not in github_probe.stderr"

            - name: Install chezmoi {{ chezmoi_version }}
              when: "'successfully authenticated' in github_probe.stderr"
              block:
                - name: Ensure ~/.local/bin exists
                  ansible.builtin.file:
                    path: "{{ chezmoi_home }}/.local/bin"
                    state: directory
                    mode: "0755"

                - name: Download the chezmoi binary
                  ansible.builtin.get_url:
                    url: "https://github.com/twpayne/chezmoi/releases/download/v{{ chezmoi_version }}/chezmoi-linux-amd64"
                    checksum: "sha256:https://github.com/twpayne/chezmoi/releases/download/v{{ chezmoi_version }}/chezmoi_{{ chezmoi_version }}_checksums.txt"
                    dest: "{{ chezmoi_home }}/.local/bin/chezmoi"
                    mode: "0755"

                - name: Clone and apply the dotfiles
                  ansible.builtin.command: >-
                    {{ chezmoi_home }}/.local/bin/chezmoi init --apply
                    git@github.com:bluefishforsale/chezmoi.git
                  environment:
                    GIT_SSH_COMMAND: >-
                      ssh -o BatchMode=yes -o StrictHostKeyChecking=yes
                      -o UserKnownHostsFile={{ chezmoi_home }}/.ssh/known_hosts.github
