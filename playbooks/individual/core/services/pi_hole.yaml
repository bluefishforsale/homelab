---
# The pihole VM itself (vmid 3000 on node005) is terraform-root's:
# lan/proxmox-node005-vms.tf. This play only configures what runs inside it.
- name: Install Pi-hole on Debian 12
  hosts: pihole
  become: true
  tags: ['force', 'install']
  vars_files:
    - "{{ playbook_dir }}/../../../../vault/secrets.yaml"
  vars:
    pihole_admin_password: "admin"

  tasks:
    ############  fix dpkg if things went sideways #####################
    - name: Handle dpkg locks and repair
      include_tasks: "{{ playbook_dir }}/../../../tasks/dpkg_lock.yaml"

    ############  apt install #####################
    - name: update cache once
      ansible.builtin.apt:
        update_cache: true

    - name: Install prerequisites
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
        - curl
        - procps
        - lsb-release
        - git

    - name: Git clone Pi-hole
      ansible.builtin.git:
        repo: https://github.com/pi-hole/pi-hole.git
        dest: /opt/pi-hole
        accept_hostkey: true
        force: true
        depth: 1
    
    - name: Create /etc/pihole directory
      file:
        path: /etc/pihole
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create /etc/pihole/setupVars.conf with specified variables
      template:
        src: "{{ playbook_dir }}/../../../../files/pihole/etc/setupVars.conf.j2"
        dest: /etc/pihole/setupVars.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart pihole-FTL

    - name: Create /etc/dnsmasq.d directory
      file:
        path: /etc/dnsmasq.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure dnsmasq to forward .home domain to both DNS servers
      copy:
        src: "{{ playbook_dir }}/../../../../files/pihole/etc/dnsmasq.d/02-local-dns.conf"
        dest: /etc/dnsmasq.d/02-local-dns.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart pihole-FTL

    - name: Check if Pi-hole is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/pihole
      register: pihole_installed

    - name: Install Pi-hole
      ansible.builtin.command: /opt/pi-hole/automated\ install/basic-install.sh --unattended
      when: not pihole_installed.stat.exists

    - name: Update Pi-Hole
      ansible.builtin.command: pihole -u
      failed_when: false
      changed_when: false

    - name: Enable Pi-hole at startup
      ansible.builtin.systemd:
        name: pihole-FTL
        enabled: true

    - name: Start Pi-hole service
      ansible.builtin.systemd:
        name: pihole-FTL
        state: started

    # pihole.toml is generated by the installer above, so enable custom
    # dnsmasq.d loading only after install + first FTL start (it does not exist
    # on a fresh VM before this point).
    - name: Enable custom dnsmasq.d configurations in pihole.toml
      ansible.builtin.lineinfile:
        path: /etc/pihole/pihole.toml
        regexp: '^\s*etc_dnsmasq_d\s*=.*'
        line: '  etc_dnsmasq_d = true'
        state: present
      notify: Restart pihole-FTL

    - name: Restart pihole-FTL to apply dnsmasq config
      ansible.builtin.systemd:
        name: pihole-FTL
        state: restarted

    - name: Set Pi-hole admin password from vault
      ansible.builtin.command: pihole setpassword "{{ pihole.password }}"
      no_log: true
      changed_when: true
      retries: 3
      delay: 2
      register: password_result
      until: password_result.rc == 0

    # NOTE: node_exporter.yaml's compose node-exporter owns :9100 on every
    # docker host, pihole included. The package one held the port and left the
    # compose one crash-looping on "bind: address already in use", reading a
    # textfile dir nothing in this repo writes to.
    - name: Remove the package node exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: absent
        purge: true

    - name: The compose node exporter took :9100
      ansible.builtin.wait_for:
        port: 9100
        timeout: 120

    ############  DNS validation #####################
    - name: Wait for DNS service to be fully ready
      ansible.builtin.pause:
        seconds: 5

    - name: Test local DNS resolution (ocean.home)
      ansible.builtin.command: dig +short @127.0.0.1 ocean.home
      register: local_dns_result
      changed_when: false
      # ocean.home is a CNAME (to ocean-bond0.home), so +short prints the
      # target first and the address last.
      failed_when: local_dns_result.stdout_lines[-1] | default('') != hostvars['ocean'].ansible_ssh_host

    - name: Test external DNS resolution (google.com)
      ansible.builtin.command: dig +short @127.0.0.1 google.com
      register: external_dns_result
      changed_when: false
      failed_when: external_dns_result.stdout == ''

    - name: Display DNS validation results
      ansible.builtin.debug:
        msg:
          - "✓ Local DNS working - ocean.home resolves to: {{ local_dns_result.stdout_lines[-1] }}"
          - "✓ External DNS working - google.com resolves to: {{ external_dns_result.stdout_lines[0] }}"

  handlers:
    - name: Restart pihole-FTL
      ansible.builtin.service:
        name: pihole-FTL
        state: restarted
