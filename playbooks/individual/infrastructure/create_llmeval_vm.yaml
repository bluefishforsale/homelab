---
# Proxmox VM creation for llmeval, a stand-in for a Ryzen AI Max+ 395 box
# Before buying one, AxiomD grades the big MoE models it could hold against the
# Qwen3-Coder-30B on ocean's 3090, on replayed past work. Only output quality is
# compared, so CPU inference here gives the same answers the 395 would for the
# same GGUF and sampling, just far slower. 128 GB to match the 395's unified
# memory; the llama.cpp container is capped at 96 GB, about what the 395 hands
# its GPU, so a model that only fits here never looks like it fits there.
# On node006 because it is the only node with the RAM (290 GB available on
# 2026-11-07, node005 had 30). Pattern mirrors create_netboot_vm.yaml.
# Backout: `qm stop 6100 && qm destroy 6100` on node006.

- name: Create llmeval VM on Proxmox
  hosts: node006
  become: true
  gather_facts: true
  vars:
    llmeval_vm_id: 6100
    llmeval_vm_name: llmeval
    # 8 of node006's 40 threads, weighted below the cpuunits default (100) so
    # ocean (30 cores, Plex and tdarr) always wins under contention. Evals run
    # for days, so this gives up speed, never ocean's headroom.
    llmeval_vm_cores: 8
    llmeval_vm_cpuunits: 50
    llmeval_vm_memory_mb: 131072
    # NOTE: ballooning off. A balloon lets the host reclaim guest RAM under
    # pressure, which would push a 65 GB model into swap mid-eval and turn a
    # day's run into a week's.
    llmeval_vm_balloon: 0
    # Template is 3G. Four GGUFs (18.6 + ~65 + ~45 + ~73 GB) plus room to swap
    # one candidate for another without deleting first.
    llmeval_vm_disk_size_increase: "+297G"
    llmeval_vm_template_id: 9999  # Debian 12 cloud-init template
    llmeval_vm_onboot: 1
    llmeval_vm_ciuser: debian
    # Passthrough host CPU features; kvm64 masks AVX, which llama.cpp needs.
    # This E5-2690 v2 has AVX but not AVX2.
    llmeval_vm_cpu: host

    # NOTE: static, not a dig lookup. *.home is a wildcard to ocean, so a
    # lookup before llmeval's own record exists returns ocean's address.
    llmeval_vm_ip: 192.168.1.36
    llmeval_vm_netmask: 24
    llmeval_vm_gateway: 192.168.1.1
    llmeval_vm_nameserver: 192.168.1.2

  tasks:
    - name: Download SSH keys for llmeval VM
      ansible.builtin.get_url:
        url: "https://github.com/bluefishforsale.keys"
        dest: "/root/ssh.keys"
        mode: '0600'
        owner: root
        group: root

    - name: Check llmeval VM status
      ansible.builtin.command: "qm status {{ llmeval_vm_id }}"
      register: llmeval_vm_status
      ignore_errors: true
      changed_when: false

    - name: Clone template for llmeval VM
      ansible.builtin.command: "qm clone {{ llmeval_vm_template_id }} {{ llmeval_vm_id }}"
      when: llmeval_vm_status.rc != 0
      register: clone_result

    - name: Set llmeval VM name and network configuration
      ansible.builtin.shell: |
        qm set {{ llmeval_vm_id }} --name {{ llmeval_vm_name }}
        qm set {{ llmeval_vm_id }} --ipconfig0 ip={{ llmeval_vm_ip }}/{{ llmeval_vm_netmask }},gw={{ llmeval_vm_gateway }}
        qm set {{ llmeval_vm_id }} --nameserver {{ llmeval_vm_nameserver }}
        qm set {{ llmeval_vm_id }} --onboot {{ llmeval_vm_onboot }}
        qm set {{ llmeval_vm_id }} --cpu {{ llmeval_vm_cpu }}
      when: llmeval_vm_status.rc != 0 or llmeval_vm_status.stdout is not search('running')
      changed_when: true

    - name: Set SSH keys for llmeval VM
      ansible.builtin.shell: "qm set {{ llmeval_vm_id }} --sshkeys /root/ssh.keys"
      when: llmeval_vm_status.rc != 0 or llmeval_vm_status.stdout is not search('running')
      changed_when: true

    - name: Resize llmeval VM disk
      ansible.builtin.shell: "qm resize {{ llmeval_vm_id }} scsi0 {{ llmeval_vm_disk_size_increase }}"
      when: llmeval_vm_status.rc != 0
      changed_when: true

    # NOTE: CPU and memory only change on a stopped VM. Editing them does
    # nothing to a running llmeval until `qm shutdown 6100` and a re-run.
    - name: Set llmeval VM CPU and memory
      ansible.builtin.shell: |
        qm set {{ llmeval_vm_id }} --cores {{ llmeval_vm_cores }}
        qm set {{ llmeval_vm_id }} --cpuunits {{ llmeval_vm_cpuunits }}
        qm set {{ llmeval_vm_id }} --memory {{ llmeval_vm_memory_mb }}
        qm set {{ llmeval_vm_id }} --balloon {{ llmeval_vm_balloon }}
      when: llmeval_vm_status.rc != 0 or llmeval_vm_status.stdout is not search('running')
      changed_when: true

    - name: Set llmeval VM description
      ansible.builtin.shell: |
        qm set {{ llmeval_vm_id }} --description "llmeval - CPU llama.cpp stand-in for a Ryzen AI Max+ 395 (quality evals only)"
      when: llmeval_vm_status.rc != 0
      changed_when: true

    - name: Start llmeval VM
      ansible.builtin.command: "qm start {{ llmeval_vm_id }}"
      when: llmeval_vm_status.rc != 0 or llmeval_vm_status.stdout is not search('running')
      changed_when: true

    # NOTE: node006's template 9999 carries `ciuser: terrac` (ocean's login),
    # while node005's has none, so cloud-init there defaults to debian, which
    # is what inventory and base/users.yaml expect on every VM. Without this
    # the VM boots with only a terrac login and every play is UNREACHABLE.
    # Changing ciuser changes the cloud-init instance-id, so the reboot makes
    # cloud-init create debian with the keys above.
    - name: Log in as debian like every other fleet VM
      ansible.builtin.shell: |
        set -e
        if qm config {{ llmeval_vm_id }} | grep -qx 'ciuser: {{ llmeval_vm_ciuser }}'; then exit 0; fi
        qm set {{ llmeval_vm_id }} --ciuser {{ llmeval_vm_ciuser }}
        qm cloudinit update {{ llmeval_vm_id }}
        if qm status {{ llmeval_vm_id }} | grep -q running; then qm reboot {{ llmeval_vm_id }}; fi
        echo changed
      args:
        executable: /bin/bash
      register: llmeval_ciuser
      changed_when: "'changed' in llmeval_ciuser.stdout"

    - name: Wait for llmeval VM to boot and accept SSH connections (max 5 minutes)
      ansible.builtin.wait_for:
        host: "{{ llmeval_vm_ip }}"
        port: 22
        delay: 10
        timeout: 300
        state: started
        msg: "Waiting for {{ llmeval_vm_ip }}:22 to become available..."
      when: >-
        llmeval_vm_status.rc != 0
        or (clone_result is defined and clone_result is changed)
        or llmeval_ciuser is changed
