---
# tracer 2d: validate after gh-runner-01 ssh key sync
# tracer 2c: validate after exit-code fix + ssh key sync
# tracer: see docs/operations/deploy-tracer.md
# Ephemeral homelab runners, four per host on every [github_runners] host.
#
# Applying this recreates the runners on the hosts it targets, so a job must
# never apply it to the host it is running on. main-apply never does that for
# any playbook: it applies a runner host from a job on the other one, and the
# on-<host> label below is what lets that job pick its side.
# NOTE: a runner host with no homelab runners (a new one) has no on-<host>
# label yet, so its first apply is by hand from agentbox.
#
# Prerequisites:
# - Runner VM defined in terraform-root lan/proxmox-node00X-vms.tf
# - VM added to inventory under [github_runners] group
# - GitHub PAT stored in Vault at development.github.token
#
# The PAT is used by runner containers to automatically generate registration tokens

- name: Configure GitHub Actions ephemeral Docker runners
  hosts: github_runners
  become: true
  gather_facts: true
  vars_files:
    - ../../../vault/secrets.yaml

  vars:
    github_pat_token: "{{ development.github.token }}"
    github_scope: "repo"
    github_repo: "bluefishforsale/homelab"
    github_runner_labels:
      - self-hosted
      - homelab
      - ansible
      - ephemeral
      - docker
      - "on-{{ inventory_hostname }}"

  roles:
    - github_docker_runners
