---
# In-band IPMI exporter on the Dell bare-metal hosts (node005/006). Reads the
# local BMC over /dev/ipmi0 (no iDRAC LAN creds, no RO user), exposing
# PSU/fan/temp/voltage/SEL to Prometheus. VMs mask openipmi.service and have no
# BMC, so this targets [baremetal] only. Pattern mirrors pve_exporter.yaml.
#
# Usage:
#   ansible-playbook -i inventories/production/hosts.ini playbooks/individual/infrastructure/ipmi_exporter.yaml
- name: Configure IPMI Exporter
  hosts: baremetal
  become: true
  gather_facts: true

  vars:
    service: ipmi-exporter
    home: "/data01/services/{{ service }}"
    files: "{{ playbook_dir }}/../../../files/{{ service }}"
    docker_image: "prometheuscommunity/ipmi-exporter"
    docker_tag: "latest"
    exporter_port: 9290
    compose_dir: "/opt/compose/{{ service }}"

  tasks:
    - name: Assert the BMC device is present
      ansible.builtin.stat:
        path: /dev/ipmi0
      register: ipmi_dev

    - name: Fail if no in-band BMC device
      ansible.builtin.assert:
        that: ipmi_dev.stat.exists
        fail_msg: "/dev/ipmi0 missing on {{ inventory_hostname }} - load ipmi_si/ipmi_devintf"

    - name: Ensure base directory exists
      ansible.builtin.file:
        path: "{{ home }}"
        state: directory
        mode: '0755'

    - name: Deploy ipmi-exporter config
      ansible.builtin.copy:
        src: "{{ files }}/config.yml"
        dest: "{{ home }}/config.yml"
        mode: '0644'
      register: svc_conf

    - name: Create compose dir
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy docker-compose.yml
      ansible.builtin.template:
        src: "{{ files }}/docker-compose.yml.j2"
        dest: "{{ compose_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0644'
      register: svc_compose

    - name: Deploy systemd service
      ansible.builtin.template:
        src: "{{ files }}/{{ service }}.service.j2"
        dest: "/etc/systemd/system/{{ service }}.service"
        mode: '0644'
      register: svc_unit

    - name: Find a leftover bare docker run container
      ansible.builtin.command: >-
        docker ps -a --filter name=^{{ service }}$
        --format 'project={{ "{{" }}.Label "com.docker.compose.project"{{ "}}" }}'
      register: svc_legacy
      changed_when: false
      check_mode: false

    - name: Remove the bare docker run container before compose takes the name
      ansible.builtin.command: docker rm -f {{ service }}
      register: svc_legacy_rm
      when: svc_legacy.stdout | trim == 'project='

    - name: Start and enable {{ service }} (restart only on change)
      ansible.builtin.systemd:
        name: "{{ service }}.service"
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if (svc_conf is changed or svc_compose is changed or svc_unit is changed or svc_legacy_rm is changed) else 'started' }}"
