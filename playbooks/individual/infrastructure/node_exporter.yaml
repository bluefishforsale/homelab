---
- name: Configure host-exporter systemd services
  hosts: all
  become: true
  gather_facts: yes

  vars_files:
    - ../../../vars/vars_service_ports.yaml

  vars:
    cadvisor_service: cadvisor
    cadvisor_image: gcr.io/cadvisor/cadvisor
    cadvisor_version: v0.55.1
    cadvisor_port: "{{ service_ports.cadvisor.port }}"
    cadvisor_home: "/data01/services/{{ cadvisor_service }}"
    cadvisor_files: "{{ playbook_dir }}/../../../files/node-exporter"
    node_exporter_service: node-exporter
    node_exporter_image: prom/node-exporter
    node_exporter_version: latest
    node_exporter_port: "{{ service_ports.node_exporter.port }}"
    node_exporter_textfiles: "/data01/services/{{ node_exporter_service }}/text_files"
    node_exporter_home: "/data01/services/{{ node_exporter_service }}"
    node_exporter_files: "{{ playbook_dir }}/../../../files/node-exporter"
    # Weekly image refresh, the base time each project's timer randomises 6h
    # forward from, so the window is 08:00-14:00 Pacific: awake and watching, not
    # asleep. The zone is named rather than left to host-local time, which pins
    # the window against a host rebuilt in UTC and follows DST on its own.
    # dns01 and dns02 are the only pair whose simultaneous loss is unrecoverable
    # (no DNS means no route to anything that could fix it), so they never
    # refresh on the same day.
    docker_refresh_schedule: "{{ 'Wed *-*-* 08:00:00 America/Los_Angeles' if inventory_hostname == 'dns02' else 'Sun *-*-* 08:00:00 America/Los_Angeles' }}"
    process_exporter_service: process-exporter
    process_exporter_image: ncabatoff/process-exporter
    process_exporter_version: latest
    process_exporter_port: "{{ service_ports.process_exporter.port }}"
    # NVIDIA GPU Exporter (Docker Compose deployment)
    nvidia_gpu_exporter_service: nvidia-gpu-exporter
    nvidia_gpu_exporter_image: utkuozdemir/nvidia_gpu_exporter
    nvidia_gpu_exporter_version: 1.4.0
    nvidia_gpu_exporter_port: "{{ service_ports.nvidia_gpu_exporter.port }}"
    nvidia_gpu_exporter_home: "/data01/services/{{ nvidia_gpu_exporter_service }}"
    nvidia_gpu_exporter_files: "{{ playbook_dir }}/../../../files/node-exporter"
    # SMART monitoring (Docker Compose deployment)
    smart_exporter_service: smart-exporter
    smart_exporter_image: prometheuscommunity/smartctl-exporter
    smart_exporter_version: latest
    smart_exporter_port: "{{ service_ports.smart_exporter.port }}"
    smart_exporter_home: "/data01/services/{{ smart_exporter_service }}"
    smart_exporter_files: "{{ playbook_dir }}/../../../files/node-exporter"
    uid: 1001  # Ocean user ID
    gid: 1001  # Users group ID

  tasks:

  - name: Check if Docker is installed
    ansible.builtin.command: which docker
    register: docker_check
    ignore_errors: yes
    changed_when: false

  - name: Show Docker availability
    ansible.builtin.debug:
      msg: "Docker is {{ 'installed' if docker_check.rc == 0 else 'NOT installed' }} on {{ inventory_hostname }}"

  - name: Ensure node_exporter_textfiles exists
    ansible.builtin.file:
      path: "{{ node_exporter_textfiles }}"
      state: directory
      owner: root
      group: root
      mode: '0777' # anyone can write into here

  - name: Create bare_metal_host textfile metric
    ansible.builtin.copy:
      content: |
        # HELP node_bare_metal_host Bare metal host this instance runs on
        # TYPE node_bare_metal_host gauge
        node_bare_metal_host{bare_metal_host="{{ bare_metal_host | default(inventory_hostname) }}"} 1
      dest: "{{ node_exporter_textfiles }}/bare_metal_host.prom"
      owner: root
      group: root
      mode: '0644'

  # ZFS pool health -> node_exporter textfile collector. Read-only: the script
  # only parses `zpool status` and NEVER mutates a pool. No-op on non-ZFS hosts.
  - name: Install zpool-metrics collector script
    ansible.builtin.copy:
      src: "{{ node_exporter_files }}/zpool-metrics.sh"
      dest: /usr/local/bin/zpool-metrics.sh
      owner: root
      group: root
      mode: '0755'

  - name: Create zpool-metrics systemd service
    ansible.builtin.template:
      src: "{{ node_exporter_files }}/zpool-metrics.service.j2"
      dest: /etc/systemd/system/zpool-metrics.service
      mode: '0644'

  - name: Create zpool-metrics systemd timer
    ansible.builtin.template:
      src: "{{ node_exporter_files }}/zpool-metrics.timer.j2"
      dest: /etc/systemd/system/zpool-metrics.timer
      mode: '0644'

  - name: Start and enable zpool-metrics timer
    ansible.builtin.systemd:
      name: zpool-metrics.timer
      state: started
      enabled: true
      daemon_reload: yes

  # SAS phy error counters -> node_exporter textfile collector. Read-only: reads
  # /sys/class/sas_phy only, never touches a disk/HBA. No-op on non-SAS hosts.
  - name: Install sas-phy-metrics collector script
    ansible.builtin.copy:
      src: "{{ node_exporter_files }}/sas-phy-metrics.sh"
      dest: /usr/local/bin/sas-phy-metrics.sh
      owner: root
      group: root
      mode: '0755'

  - name: Create sas-phy-metrics systemd service
    ansible.builtin.template:
      src: "{{ node_exporter_files }}/sas-phy-metrics.service.j2"
      dest: /etc/systemd/system/sas-phy-metrics.service
      mode: '0644'

  - name: Create sas-phy-metrics systemd timer
    ansible.builtin.template:
      src: "{{ node_exporter_files }}/sas-phy-metrics.timer.j2"
      dest: /etc/systemd/system/sas-phy-metrics.timer
      mode: '0644'

  - name: Start and enable sas-phy-metrics timer
    ansible.builtin.systemd:
      name: sas-phy-metrics.timer
      state: started
      enabled: true
      daemon_reload: yes

  # Floating tags (:latest, :main, :stable) never update on their own: compose
  # pulls only when an image is missing. Without this the fleet runs whatever it
  # first pulled, which is how prometheus sat on a June image while restarting
  # weekly. Recreates only services whose image actually changed.
  #
  # One timer instance per compose project, discovered from the host rather than
  # listed here: the project list is what is actually running, and a registry in
  # this file would rot the first time a service is added elsewhere.
  - name: Install docker-refresh script
    ansible.builtin.copy:
      src: "{{ node_exporter_files }}/docker-refresh.sh"
      dest: /usr/local/bin/docker-refresh.sh
      owner: root
      group: root
      mode: '0755'

  # Replaced by the per-project instances below. The old sweep refreshed every
  # project back-to-back from one unit, so one wedged project stalled the rest.
  # Removed before the reload below so systemd forgets it in the same pass.
  - name: Check for the old fleet-wide docker-refresh sweep
    ansible.builtin.stat:
      path: /etc/systemd/system/docker-refresh.timer
    register: old_docker_refresh

  - name: Stop and disable the old docker-refresh sweep
    ansible.builtin.systemd:
      name: docker-refresh.timer
      state: stopped
      enabled: false
    when: old_docker_refresh.stat.exists

  - name: Remove the old docker-refresh sweep units
    ansible.builtin.file:
      path: "{{ item }}"
      state: absent
    loop:
      - /etc/systemd/system/docker-refresh.timer
      - /etc/systemd/system/docker-refresh.service
      # The textfile collector republishes a .prom file forever, so leaving it
      # would keep serving the sweep's metrics long after the sweep is gone.
      - "{{ node_exporter_textfiles }}/docker_refresh.prom"

  - name: Create docker-refresh template service
    ansible.builtin.copy:
      src: "{{ node_exporter_files }}/docker-refresh@.service"
      dest: /etc/systemd/system/docker-refresh@.service
      mode: '0644'

  - name: Create docker-refresh template timer
    ansible.builtin.template:
      src: "{{ node_exporter_files }}/docker-refresh@.timer.j2"
      dest: /etc/systemd/system/docker-refresh@.timer
      mode: '0644'

  - name: Reload systemd for the docker-refresh templates
    ansible.builtin.systemd:
      daemon_reload: true

  # Read-only, and it has to run in check mode too or the dry run would loop
  # over an undefined list.
  - name: Enumerate running compose projects
    ansible.builtin.command: docker compose ls --format json
    register: compose_projects
    changed_when: false
    check_mode: false
    when: docker_check.rc == 0

  - name: Enable a refresh timer per compose project
    ansible.builtin.systemd:
      name: "docker-refresh@{{ item }}.timer"
      state: started
      enabled: true
    loop: "{{ compose_projects.stdout | from_json | map(attribute='Name') | list }}"
    when: docker_check.rc == 0

  - name: Find enabled refresh timers
    ansible.builtin.find:
      paths: /etc/systemd/system/timers.target.wants
      patterns: 'docker-refresh@*.timer'
      file_type: link
    register: refresh_timer_links
    when: docker_check.rc == 0

  # A deleted service (comfyui, frigate) would otherwise keep an enabled timer
  # that fails weekly against a project that no longer exists, and page for it.
  - name: Disable refresh timers whose compose project is gone
    ansible.builtin.systemd:
      name: "{{ item }}"
      state: stopped
      enabled: false
    loop: "{{ refresh_timer_links.files | map(attribute='path') | map('basename') | list | difference(wanted_refresh_timers) }}"
    vars:
      wanted_refresh_timers: "{{ compose_projects.stdout | from_json | map(attribute='Name') | map('regex_replace', '^(.*)$', 'docker-refresh@\\1.timer') | list }}"
    when: docker_check.rc == 0

  - name: Create node exporter Docker Compose directory
    ansible.builtin.file:
      path: "{{ node_exporter_home }}"
      state: directory
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0755'
    when: docker_check.rc == 0

  - name: Create node exporter docker-compose.yml
    ansible.builtin.template:
      src: "{{ node_exporter_files }}/node-exporter-compose.yml.j2"
      dest: "{{ node_exporter_home }}/docker-compose.yml"
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0644'
    when: docker_check.rc == 0
    register: node_docker_compose_config

  - name: Create node exporter environment file
    ansible.builtin.template:
      src: "{{ node_exporter_files }}/node-exporter.env.j2"
      dest: "{{ node_exporter_home }}/.env"
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0600'
    when: docker_check.rc == 0
    register: node_env_config

  - name: Create cadvisor Docker Compose directory
    ansible.builtin.file:
      path: "{{ cadvisor_home }}"
      state: directory
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0755'
    when: docker_check.rc == 0

  - name: Create cadvisor docker-compose.yml
    ansible.builtin.template:
      src: "{{ cadvisor_files }}/cadvisor-compose.yml.j2"
      dest: "{{ cadvisor_home }}/docker-compose.yml"
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0644'
    when: docker_check.rc == 0
    register: cadvisor_docker_compose_config

  - name: Create cadvisor environment file
    ansible.builtin.template:
      src: "{{ cadvisor_files }}/cadvisor.env.j2"
      dest: "{{ cadvisor_home }}/.env"
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0600'
    when: docker_check.rc == 0
    register: cadvisor_env_config

  - name: Check if NVIDIA GPU is present
    ansible.builtin.shell: lspci | grep -i nvidia
    register: gpu_check
    ignore_errors: yes
    changed_when: false

  - name: Show GPU detection result
    ansible.builtin.debug:
      msg: "NVIDIA GPU detected: {{ gpu_check.stdout_lines }}"
    when: (nvidia_gpu | default(false) | bool)

  - name: Create NVIDIA GPU exporter Docker Compose directory
    ansible.builtin.file:
      path: "{{ nvidia_gpu_exporter_home }}"
      state: directory
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0755'
    when: (nvidia_gpu | default(false) | bool)

  - name: Create NVIDIA GPU exporter docker-compose.yml
    ansible.builtin.template:
      src: "{{ nvidia_gpu_exporter_files }}/nvidia-gpu-exporter-compose.yml.j2"
      dest: "{{ nvidia_gpu_exporter_home }}/docker-compose.yml"
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0644'
    when: (nvidia_gpu | default(false) | bool)
    register: gpu_docker_compose_config

  - name: Create NVIDIA GPU exporter environment file
    ansible.builtin.template:
      src: "{{ nvidia_gpu_exporter_files }}/nvidia-gpu-exporter.env.j2"
      dest: "{{ nvidia_gpu_exporter_home }}/.env"
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0600'
    when: (nvidia_gpu | default(false) | bool)
    register: gpu_env_config

  - name: Create NVIDIA GPU exporter README documentation
    ansible.builtin.copy:
      src: "{{ nvidia_gpu_exporter_files }}/README.md"
      dest: "{{ nvidia_gpu_exporter_home }}/README.md"
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0644'
    when: (nvidia_gpu | default(false) | bool)

  - name: Create process-exporter systemd service (non-compose)
    ansible.builtin.template:
      src: "{{ playbook_dir }}/../../../files/node-exporter/process-exporter.service.j2"
      dest: "/etc/systemd/system/process-exporter.service"
      mode: '0644'
    when: docker_check.rc == 0
    notify:
    - Reload systemd daemon
    - Restart services

  - name: Create cadvisor Docker Compose systemd service
    ansible.builtin.template:
      src: "{{ cadvisor_files }}/cadvisor.service.j2"
      dest: "/etc/systemd/system/cadvisor.service"
      mode: '0644'
    when: docker_check.rc == 0
    notify:
    - Reload systemd daemon
    - Restart cadvisor service

  - name: Create cadvisor daily restart systemd service
    ansible.builtin.template:
      src: "{{ cadvisor_files }}/cadvisor-restart.service.j2"
      dest: "/etc/systemd/system/cadvisor-restart.service"
      mode: '0644'
    when: docker_check.rc == 0
    notify:
    - Reload systemd daemon

  - name: Create cadvisor daily restart systemd timer
    ansible.builtin.template:
      src: "{{ cadvisor_files }}/cadvisor-restart.timer.j2"
      dest: "/etc/systemd/system/cadvisor-restart.timer"
      mode: '0644'
    when: docker_check.rc == 0
    notify:
    - Reload systemd daemon

  - name: Create node exporter Docker Compose systemd service
    ansible.builtin.template:
      src: "{{ node_exporter_files }}/node-exporter.service.j2"
      dest: "/etc/systemd/system/node-exporter.service"
      mode: '0644'
    when: docker_check.rc == 0
    notify:
    - Reload systemd daemon
    - Restart node exporter service

  - name: Show node exporter configuration status
    ansible.builtin.debug:
      msg: "Node exporter configuration files have been updated - containers will be recreated"
    when: docker_check.rc == 0 and (node_docker_compose_config.changed or node_env_config.changed)

  - name: Force node exporter container recreation when configs change
    ansible.builtin.shell: |
      cd {{ node_exporter_home }}
      echo "Recreating node exporter containers due to configuration changes..."
      docker compose down --timeout 30
      docker compose up -d --force-recreate --build
      echo "Node exporter container recreation completed"
    when: docker_check.rc == 0 and (node_docker_compose_config.changed or node_env_config.changed)

  - name: Show cadvisor configuration status
    ansible.builtin.debug:
      msg: "cAdvisor configuration files have been updated - containers will be recreated"
    when: docker_check.rc == 0 and (cadvisor_docker_compose_config.changed or cadvisor_env_config.changed)

  - name: Force cadvisor container recreation when configs change
    ansible.builtin.shell: |
      cd {{ cadvisor_home }}
      echo "Recreating cAdvisor containers due to configuration changes..."
      docker compose down --timeout 30
      docker compose pull
      docker compose up -d --force-recreate
      echo "cAdvisor container recreation completed"
    when: docker_check.rc == 0 and (cadvisor_docker_compose_config.changed or cadvisor_env_config.changed)

  - name: Create SMART exporter Docker Compose directory
    ansible.builtin.file:
      path: "{{ smart_exporter_home }}"
      state: directory
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0755'
    when: docker_check.rc == 0

  - name: Create SMART exporter docker-compose.yml
    ansible.builtin.template:
      src: "{{ smart_exporter_files }}/smart-exporter-compose.yml.j2"
      dest: "{{ smart_exporter_home }}/docker-compose.yml"
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0644'
    when: docker_check.rc == 0
    register: smart_docker_compose_config

  - name: Create SMART exporter environment file
    ansible.builtin.template:
      src: "{{ smart_exporter_files }}/smart-exporter.env.j2"
      dest: "{{ smart_exporter_home }}/.env"
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0600'
    when: docker_check.rc == 0
    register: smart_env_config

  - name: Show SMART exporter configuration status
    ansible.builtin.debug:
      msg: "SMART exporter configuration files have been updated - containers will be recreated"
    when: docker_check.rc == 0 and (smart_docker_compose_config.changed or smart_env_config.changed)

  - name: Force SMART exporter container recreation when configs change
    ansible.builtin.shell: |
      cd {{ smart_exporter_home }}
      echo "Recreating SMART exporter containers due to configuration changes..."
      docker compose down --timeout 30
      docker compose up -d --force-recreate
      echo "SMART exporter container recreation completed"
    when: docker_check.rc == 0 and (smart_docker_compose_config.changed or smart_env_config.changed)

  - name: Create SMART exporter Docker Compose systemd service
    ansible.builtin.template:
      src: "{{ smart_exporter_files }}/smart-exporter.service.j2"
      dest: "/etc/systemd/system/smart-exporter.service"
      mode: '0644'
    when: docker_check.rc == 0
    notify:
    - Reload systemd daemon
    - Restart smart exporter service

  - name: Create NVIDIA GPU exporter Docker Compose systemd service (GPU hosts only)
    ansible.builtin.template:
      src: "{{ nvidia_gpu_exporter_files }}/nvidia-gpu-exporter.service.j2"
      dest: "/etc/systemd/system/nvidia-gpu-exporter.service"
      mode: '0644'
    when: (nvidia_gpu | default(false) | bool) and docker_check.rc == 0
    notify:
    - Reload systemd daemon
    - Restart services
    - Restart GPU services

  - name: Show GPU configuration status
    ansible.builtin.debug:
      msg: "GPU configuration files have been updated - containers will be recreated"
    when: (nvidia_gpu | default(false) | bool) and docker_check.rc == 0 and (gpu_docker_compose_config.changed or gpu_env_config.changed)

  - name: Force GPU container recreation when configs change
    ansible.builtin.shell: |
      cd {{ nvidia_gpu_exporter_home }}
      echo "Recreating GPU containers due to configuration changes..."
      docker compose down --timeout 30
      docker compose up -d --force-recreate
      echo "GPU container recreation completed"
    when: (nvidia_gpu | default(false) | bool) and docker_check.rc == 0 and (gpu_docker_compose_config.changed or gpu_env_config.changed)
    
  - name: Start and enable process-exporter (non-compose service)
    ansible.builtin.systemd:
      name: process-exporter.service
      state: started
      enabled: true
    when: docker_check.rc == 0

  - name: Start and enable cadvisor Docker Compose service
    ansible.builtin.systemd:
      name: cadvisor.service
      state: started
      enabled: true
      daemon_reload: yes
    when: docker_check.rc == 0

  - name: Start and enable cadvisor daily restart timer
    ansible.builtin.systemd:
      name: cadvisor-restart.timer
      state: started
      enabled: true
      daemon_reload: yes
    when: docker_check.rc == 0

  - name: Start and enable node exporter Docker Compose service
    ansible.builtin.systemd:
      name: node-exporter.service
      state: started
      enabled: true
      daemon_reload: yes
    when: docker_check.rc == 0

  - name: Start and enable NVIDIA GPU exporter (GPU hosts only)
    ansible.builtin.systemd:
      name: nvidia-gpu-exporter.service
      state: started
      enabled: true
    when: (nvidia_gpu | default(false) | bool) and docker_check.rc == 0

  - name: Start and enable SMART exporter Docker Compose service
    ansible.builtin.systemd:
      name: smart-exporter.service
      state: started
      enabled: true
      daemon_reload: yes
    when: docker_check.rc == 0

  handlers:
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      daemon_reload: yes

  - name: Restart services
    ansible.builtin.systemd:
      name: process-exporter.service
      state: restarted

  - name: Restart cadvisor service
    ansible.builtin.systemd:
      name: cadvisor.service
      state: restarted

  - name: Restart node exporter service
    ansible.builtin.systemd:
      name: node-exporter.service
      state: restarted

  - name: Restart GPU services
    ansible.builtin.systemd:
      name: nvidia-gpu-exporter.service
      state: restarted
    when: (nvidia_gpu | default(false) | bool)

  - name: Restart smart exporter service
    ansible.builtin.systemd:
      name: smart-exporter.service
      state: restarted
