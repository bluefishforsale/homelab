---
# Proxmox VE Exporter - Prometheus exporter for Proxmox Virtual Environment
#
# Available tags:
#   --tags setup    Create directories and deploy configuration
#   --tags deploy   Deploy the compose project and start exporter
#
# Usage:
#   ansible-playbook -i inventories/production/hosts.ini playbooks/individual/infrastructure/pve_exporter.yaml
#
- name: Configure Proxmox VE Exporter
  hosts: proxmox
  become: true
  gather_facts: true

  vars_files:
    - ../../../vault/secrets.yaml

  vars:
    service: pve-exporter
    home: "/data01/services/{{ service }}"
    files: "{{ playbook_dir }}/../../../files/{{ service }}"
    docker_image: "prompve/prometheus-pve-exporter"
    docker_tag: "latest"
    exporter_port: 9221
    compose_dir: "/opt/compose/{{ service }}"
    # Proxmox credentials from vault
    # Append @pam realm if not already present
    proxmox_user: "{{ proxmox.username }}{% if '@' not in proxmox.username %}@pam{% endif %}"
    proxmox_password: "{{ proxmox.password }}"

  tasks:
    - name: Display deployment information
      ansible.builtin.debug:
        msg: "Deploying {{ service }} on {{ inventory_hostname }} ({{ ansible_default_ipv4.address }})"
      tags: [always]

    - name: Ensure base directory exists
      ansible.builtin.file:
        path: "{{ home }}"
        state: directory
        mode: '0755'
      tags: [setup]

    - name: Deploy pve.yaml configuration
      ansible.builtin.template:
        src: "{{ files }}/pve.yaml.j2"
        dest: "{{ home }}/pve.yaml"
        mode: '0644'
      register: svc_conf
      tags: [setup, config, deploy]

    - name: Create compose dir
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      tags: [deploy]

    - name: Deploy docker-compose.yml
      ansible.builtin.template:
        src: "{{ files }}/docker-compose.yml.j2"
        dest: "{{ compose_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0644'
      register: svc_compose
      tags: [deploy]

    - name: Deploy systemd service
      ansible.builtin.template:
        src: "{{ files }}/{{ service }}.service.j2"
        dest: "/etc/systemd/system/{{ service }}.service"
        mode: '0644'
      register: svc_unit
      tags: [deploy]

    - name: Find a leftover bare docker run container
      ansible.builtin.command: >-
        docker ps -a --filter name=^{{ service }}$
        --format 'project={{ "{{" }}.Label "com.docker.compose.project"{{ "}}" }}'
      register: svc_legacy
      changed_when: false
      check_mode: false
      tags: [deploy]

    - name: Remove the bare docker run container before compose takes the name
      ansible.builtin.command: docker rm -f {{ service }}
      register: svc_legacy_rm
      when: svc_legacy.stdout | trim == 'project='
      tags: [deploy]

    - name: Start and enable {{ service }} (restart only on change)
      ansible.builtin.systemd:
        name: "{{ service }}.service"
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if (svc_conf is changed or svc_compose is changed or svc_unit is changed or svc_legacy_rm is changed) else 'started' }}"
      tags: [deploy]
