---
# mem0: the fleet's shared agent memory (REST API + MCP bridge).
#
# Why it lives here rather than on the laptop: memory that only one machine can
# reach is memory the agentbox lanes never see, and a second instance is not an
# option. mem0's add() rewrites the existing facts with an LLM instead of
# appending, so two stores fed the same input diverge immediately and cannot be
# merged back. One writer on ocean, everything else is a client.
#
# Reached over the LAN, or from off-site through an ssh port-forward to
# {{ ansible_default_ipv4.address }}:8888. Deliberately NOT on cloudflared:
# conversation memory is the most personal data in the fleet and the CF edge
# terminates TLS.
#
# Both containers build from source clones. The published mem0/mem0-api-server
# image on Docker Hub was last pushed 2025-09-10, well before the API-key auth
# this deploy depends on, and mem0-mcp-bridge publishes no image at all.
- name: Deploy mem0 shared agent memory using Docker Compose
  hosts: ocean
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../../../../vault/secrets.yaml"
    - "{{ playbook_dir }}/../../../../vars/vars_service_ports.yaml"

  vars:
    service: mem0
    # Pinned SHAs, not branches: an unpinned clone turns every deploy into a
    # silent upgrade of the thing holding all the memory.
    mem0_repo: https://github.com/bluefishforsale/mem0.git
    mem0_version: 8cd087f9626d4a64cac530c81192bdb442e2ac54
    # SSH, unlike the mem0 fork above: the bridge repo is private, and an https
    # clone of a private repo fails with "could not read Username for
    # 'https://github.com'" rather than anything that names the real problem.
    mem0_bridge_repo: git@github.com:bluefishforsale/mem0-mcp-bridge.git
    # Pinned like the fork above, now that the repo has a commit worth pinning:
    # this is the one that constrains mcp<2. On `main` the bridge crash-looped,
    # because mcp>=1.0 resolved to 2.x where FastMCP was renamed and moved.
    mem0_bridge_version: c426082347501967ecd2a096901930a19f626120
    # terrac's key is what ocean already clones private repos with
    # (playbooks/individual/ocean/services/blog_terrac_com_static.yaml).
    git_ssh_key: /home/terrac/.ssh/id_ed25519
    port_api: "{{ service_ports.mem0.api }}"
    port_mcp: "{{ service_ports.mem0.mcp }}"
    # What gets pulled, and what mem0 actually calls. They differ because
    # ollama's thread count can only be set as a model parameter: it counts the
    # host's physical cores out of /proc/cpuinfo (not namespaced, not affinity
    # aware), so a container confined to 6 CPUs still ran a 30-thread pool and
    # spent all its time in scheduler contention. OLLAMA_NUM_THREADS is not
    # honoured; a derived model carrying `PARAMETER num_thread` is the lever
    # that exists. Measured on ocean, same prompt:
    #   nomic-embed-text     (30 threads): 34.53s
    #   nomic-embed-homelab  (6 threads):   ~0.9s on an idle host
    #
    # Those 6 threads are the reason the compose file gives this container a
    # 6-CPU quota. Do not also pin it with cpuset: one saturated core in a
    # fixed set drags the whole pool to ~7s while its neighbours idle.
    embedder_base_model: nomic-embed-text
    embedder_model: nomic-embed-homelab
    embedder_threads: 6
    data: /data01
    files: "{{ playbook_dir }}/../../../../files/ocean-mem0"
    home: "{{ data }}/services/{{ service }}"

  tasks:

  - name: Ensure service directories exist
    ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      mode: '0755'
    loop:
      - "{{ home }}"
      - "{{ home }}/postgres-data"
      - "{{ home }}/ollama"
      - "{{ home }}/history"
      - "{{ home }}/bridge-data/mem0-mcp-bridge"

  - name: Clone mem0 server source
    ansible.builtin.git:
      repo: "{{ mem0_repo }}"
      dest: "{{ home }}/src"
      version: "{{ mem0_version }}"
      force: true
    register: mem0_clone

  # Stays root (the rest of {{ home }} is root-owned) and borrows terrac's key
  # rather than running as terrac, which would need the clone dir chowned and
  # then chowned back for the docker build.
  - name: Clone mem0-mcp-bridge source
    ansible.builtin.git:
      repo: "{{ mem0_bridge_repo }}"
      dest: "{{ home }}/src-bridge"
      version: "{{ mem0_bridge_version }}"
      force: true
      accept_hostkey: true
    environment:
      GIT_SSH_COMMAND: "ssh -i {{ git_ssh_key }} -o StrictHostKeyChecking=no"
    register: bridge_clone

  - name: Supply the bridge with a Dockerfile
    ansible.builtin.copy:
      src: "{{ files }}/Dockerfile.bridge"
      dest: "{{ home }}/src-bridge/Dockerfile"
      mode: '0644'
    register: bridge_dockerfile

  # Alongside upstream's, not over it: theirs stays for reference and ours is
  # what compose builds. Untracked in the clone, so `force: true` leaves it be.
  - name: Supply mem0 with a Dockerfile that has libpq
    ansible.builtin.copy:
      src: "{{ files }}/Dockerfile.mem0"
      dest: "{{ home }}/src/server/Dockerfile.homelab"
      mode: '0644'
    register: mem0_dockerfile

  # Pre-seeded from the vault rather than left to the bridge's
  # get_or_create_token(), so the token survives a rebuild and matches the
  # Authorization header every agent config already carries.
  - name: Install bridge bearer token
    ansible.builtin.copy:
      content: "{{ ai_services.mem0.bridge_token }}\n"
      dest: "{{ home }}/bridge-data/mem0-mcp-bridge/token"
      mode: '0600'
    no_log: true
    notify: Restart mem0 service

  - name: Create mem0 environment file
    ansible.builtin.template:
      src: "{{ files }}/mem0.env.j2"
      dest: "{{ home }}/.env"
      mode: '0600'
    notify:
    - Reload systemd daemon
    - Restart mem0 service

  - name: Create docker-compose.yml
    ansible.builtin.template:
      src: "{{ files }}/docker-compose.yml.j2"
      dest: "{{ home }}/docker-compose.yml"
      mode: '0644'
    notify:
    - Reload systemd daemon
    - Restart mem0 service

  - name: Create mem0 systemd service
    ansible.builtin.template:
      src: "{{ files }}/mem0.service.j2"
      dest: "/etc/systemd/system/mem0.service"
      mode: '0644'
    notify:
    - Reload systemd daemon
    - Restart mem0 service

  # Only on a source change. `compose up -d` builds a missing image on its own,
  # but a version bump reuses the existing tag, so the rebuild has to be
  # explicit or the pin would be decorative.
  - name: Rebuild images after a source change
    ansible.builtin.command:
      cmd: docker compose build
      chdir: "{{ home }}"
    environment:
      COMPOSE_PROJECT_NAME: "{{ service }}"
    when: >
      mem0_clone.changed or bridge_clone.changed
      or bridge_dockerfile.changed or mem0_dockerfile.changed
    notify: Restart mem0 service

  # Image acquisition must not happen inside the unit's start: `compose up -d`
  # pulls ollama (2.1GB) on a cold host, that overran TimeoutStartSec=600, and
  # Restart=on-failure then restarted the pull from the top every cycle, a loop
  # that can never converge. Pulling here leaves `up -d` with nothing to fetch.
  # --ignore-buildable skips mem0 and the bridge, which are built from source
  # and have no registry to pull from.
  - name: Pull third-party images before the unit starts
    ansible.builtin.command:
      cmd: docker compose pull --ignore-buildable
      chdir: "{{ home }}"
    environment:
      COMPOSE_PROJECT_NAME: "{{ service }}"
    register: mem0_pull
    changed_when: "'Pulled' in mem0_pull.stderr or 'Downloaded' in mem0_pull.stderr"

  - name: Enable mem0 service
    ansible.builtin.systemd:
      name: mem0.service
      enabled: true
      state: started
      daemon_reload: true

  - name: Flush handlers before probing the running stack
    ansible.builtin.meta: flush_handlers

  - name: Check whether the embedding model is present
    ansible.builtin.command:
      cmd: docker exec mem0-ollama ollama list
    register: ollama_models
    changed_when: false
    failed_when: false

  # ~270MB, CPU-only. Without it every add and search 500s on the embed call.
  - name: Pull the base embedding model
    ansible.builtin.command:
      cmd: "docker exec mem0-ollama ollama pull {{ embedder_base_model }}"
    when: embedder_base_model not in (ollama_models.stdout | default(''))

  # Lands inside the ollama volume, so the container reads it at
  # /root/.ollama without another mount.
  - name: Write the embedder Modelfile
    ansible.builtin.copy:
      content: |
        FROM {{ embedder_base_model }}
        PARAMETER num_thread {{ embedder_threads }}
      dest: "{{ home }}/ollama/Modelfile.homelab"
      mode: '0644'
    register: embedder_modelfile

  - name: Derive the thread-pinned embedding model
    ansible.builtin.command:
      cmd: >
        docker exec mem0-ollama ollama create {{ embedder_model }}
        -f /root/.ollama/Modelfile.homelab
    when: >
      embedder_modelfile.changed
      or embedder_model not in (ollama_models.stdout | default(''))

  # mem0 has no /metrics of its own, so statistics reach Prometheus through the
  # node_exporter textfile collector, the same route db-backup uses.
  - name: Deploy the metrics collector
    ansible.builtin.copy:
      src: "{{ files }}/mem0-metrics.sh"
      dest: "{{ home }}/mem0-metrics.sh"
      mode: '0755'

  - name: Install the metrics timer
    ansible.builtin.template:
      src: "{{ files }}/{{ item }}.j2"
      dest: "/etc/systemd/system/{{ item }}"
      mode: '0644'
    loop:
      - mem0-metrics.service
      - mem0-metrics.timer
    notify: Reload systemd daemon

  - name: Enable the metrics timer
    ansible.builtin.systemd:
      name: mem0-metrics.timer
      enabled: true
      state: started
      daemon_reload: true

  # The LAN address, not loopback: the compose port is bound to it explicitly so
  # the service is unreachable from anywhere the host itself doesn't route.
  - name: Verify the API is serving
    ansible.builtin.uri:
      url: "http://{{ ansible_default_ipv4.address }}:{{ port_api }}/docs"
      status_code: 200
    retries: 12
    delay: 10
    register: mem0_probe
    until: mem0_probe is succeeded

  handlers:
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      daemon_reload: true

  - name: Restart mem0 service
    ansible.builtin.systemd:
      name: mem0.service
      state: restarted
