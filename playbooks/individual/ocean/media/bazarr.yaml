---
# Bazarr on ocean as a compose project. The state dir from the original install
# (database, backups, config.yaml) is reused as-is; this play owns only
# config.ini, the compose file and the unit.
- name: Bazarr on ocean
  hosts: ocean
  become: true
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../../../vars/vars_service_ports.yaml"
    # config.ini.j2 reads media_services.* for the arr API keys and the
    # opensubtitles credential. Without this the play renders nothing and dies
    # with "'media_services' is undefined" — which is exactly how it failed when
    # those values moved out of the template and into the vault.
    - "{{ playbook_dir }}/../../../../vault/secrets.yaml"

  vars:
    image: registry-cache.home:5001/linuxserver/bazarr
    version: latest
    service: bazarr
    data: /data01
    files: "{{ playbook_dir }}/../../../../files/ocean-bazarr"
    complete: "{{ data }}/complete"
    home: "{{ data }}/services/{{ service }}"
    # NOTE: the compose project lives outside {{ home }} on purpose. home is
    # mounted read-write at /config, so a compose file there could be rewritten
    # from inside the container, or joined by an auto-loaded override or .env,
    # and come back privileged on the next restart.
    compose_dir: "/opt/compose/{{ service }}"
    port: "{{ service_ports.bazarr.port }}"
    user: media
    uid: "{{ system_users.media.uid }}"
    gid: "{{ system_users.media.gid }}"

  tasks:
    - name: Ensure config dir exists
      ansible.builtin.file:
        path: "{{ home }}/config"
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: '0755'

    - name: Template config.ini (holds the API keys)
      ansible.builtin.template:
        src: "{{ files }}/config.ini.j2"
        dest: "{{ home }}/config/config.ini"
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: '0600'
      register: bazarr_config

    - name: Ensure root-owned compose dir exists
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Template compose file
      ansible.builtin.template:
        src: "{{ files }}/docker-compose.yml.j2"
        dest: "{{ compose_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0644'
      register: bazarr_compose

    - name: Install systemd unit
      ansible.builtin.template:
        src: "{{ files }}/bazarr.service.j2"
        dest: "/etc/systemd/system/{{ service }}.service"
        mode: '0644'
      register: bazarr_unit

    # NOTE: the old unit ran a bare `docker run --name bazarr`. The new unit's
    # ExecStop is `compose down`, which never touches a container compose did
    # not create, so without this the compose up fails on the name conflict.
    # Only a container with no compose label is removed, so this is a no-op on
    # every run after the first. The prefix is there because an empty label
    # prints an empty line, which Ansible strips to the same "" as no container.
    - name: Find a leftover docker run bazarr container
      ansible.builtin.command: >-
        docker ps -a --filter name=^{{ service }}$
        --format 'project={{ "{{" }}.Label "com.docker.compose.project"{{ "}}" }}'
      register: bazarr_ps
      changed_when: false
      check_mode: false

    - name: Remove the docker run container before compose takes the name
      ansible.builtin.command: docker rm -f {{ service }}
      register: bazarr_legacy
      when: bazarr_ps.stdout | trim == 'project='

    - name: Enable and start bazarr (restart only on config/unit change)
      ansible.builtin.systemd:
        name: "{{ service }}.service"
        enabled: true
        state: "{{ 'restarted' if (bazarr_config is changed or bazarr_compose is changed or bazarr_unit is changed or bazarr_legacy is changed) else 'started' }}"
        daemon_reload: true

    - name: Wait for Bazarr's API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ port }}/api/system/status"
        headers:
          X-API-KEY: "{{ media_services.bazarr.api_key }}"
      register: bazarr_status
      until: bazarr_status.status == 200
      retries: 30
      delay: 10
      changed_when: false
