---
# Plex Media Server and companion services deployment
# 
# Available tags:
#   --tags config           Deploy only config files
#   --tags service          Deploy only systemd service definitions
#   --tags setup            Create only directories
#   --tags plex             Deploy only plex-related tasks
#   --tags kometa           Deploy only kometa tasks
#   --skip-tags restart     Prevent service restarts (use with --tags config)
#
# Usage examples:
#   Deploy configs without restarting services:
#     ansible-playbook playbooks/individual/ocean/media/plex.yaml --tags config --skip-tags restart
#   
#   Update only Plex configs (no kometa):
#     ansible-playbook playbooks/individual/ocean/media/plex.yaml --tags plex,config --skip-tags restart
#   
#   Full deployment (default):
#     ansible-playbook playbooks/individual/ocean/media/plex.yaml
#
- name: Plex and companion docker systemd services
  hosts: ocean
  become: true
  
  vars_files:
    - "{{ playbook_dir }}/../../../../vault/secrets.yaml"
    - "{{ playbook_dir }}/../../../../vars/vars_service_ports.yaml"

  vars:
    service: plex
    image: plexinc/pms-docker
    version: latest
    plex_claim: "{{ media_services.plex.claim_token }}"
    plex_api_key: "{{ media_services.plex.api_key }}"
    plex_token: "{{ media_services.plex.plex_token }}"
    plex_ports_tcp: "{{ service_ports.plex.tcp }}"
    plex_ports_udp: "{{ service_ports.plex.udp }}"
    devices:
    - /dev/nvidia-modeset
    - /dev/nvidia0
    - /dev/nvidiactl
    exporter_service: plex-exporter
    exporter_image: ghcr.io/axsuul/plex-media-server-exporter
    # Pin an explicit release: upstream's :latest tag is frozen at 1.0.0 (2023-11-10),
    # which predates the media-downloads username fix (1.1.3) and emits a :user label
    # that collides with :username, 500-ing /metrics. 2.1.0 is the current release.
    exporter_version: "2.1.0"
    exporter_port: "{{ service_ports.plex_exporter.port }}"
    kometa_service: kometa
    kometa_image: kometateam/kometa
    # Pinned, not latest. A floating tag is how this service froze at PMM
    # v1.21.0 while the project renamed itself to Kometa and its defaults repo
    # started 404ing: nothing changed here, the world moved, and the nightly
    # run failed for eight months without a single alert.
    # NOTE: the tag is v-prefixed. Kometa reports "Version: 2.4.8" in its own
    # logs and on Docker Hub that tag does not exist, so pinning to what the
    # log says gets you an image pull failure on the next recreate.
    # Bump deliberately; KometaNotRunning covers a bad upgrade.
    kometa_version: v2.4.8
    data: /data01
    files: "{{ playbook_dir }}/../../../../files/ocean-plex"
    complete: "{{ data }}/complete"
    plex_home: "{{ data }}/services/{{ service }}"
    kometa_home: "{{ data }}/services/{{ kometa_service }}"
    ramdisk: /mnt/ramdisk
    user: media
    uid: 1001

  tasks:

  - name: Ensure basedir exists
    ansible.builtin.file:
      path: "{{ plex_home }}"
      state: directory
      owner: "{{ user }}"
      group: "{{ user }}"
      mode: '0755'
    tags: [always, setup, plex]

  - name: Ensure subdirs exist
    ansible.builtin.file:
      path: "{{ plex_home }}/{{ item }}"
      state: directory
      owner: "{{ user }}"
      group: "{{ user }}"
      mode: '0755'
    with_items:
    - "Profiles"
    - "config/Library/Application Support/Plex Media Server"
    tags: [always, setup, plex]

  - name: Remove old lowercase preferences file if it exists
    ansible.builtin.file:
      path: "{{ plex_home }}/config/Library/Application Support/Plex Media Server/preferences.xml"
      state: absent
    tags: [config, plex]

  - name: Check for Plex preferences seed (gitignored bootstrap file, absent in CI)
    ansible.builtin.stat:
      path: "{{ files }}/config/preferences.xml"
    delegate_to: localhost
    become: false
    register: plex_prefs_seed
    tags: [config, plex]

  # Plex generates Preferences.xml (server identity + token) on first run and it
  # must not be clobbered on every deploy; the seed is gitignored so it is absent
  # on the CI runner. Only template it for a genuine first-time bootstrap.
  - name: Create preferences file (first-time bootstrap only; skipped when seed absent)
    ansible.builtin.template:
      src: "{{ files }}/config/preferences.xml"
      dest: "{{ plex_home }}/config/Library/Application Support/Plex Media Server/Preferences.xml"
      mode: '0644'
      owner: "{{ user }}"
      group: "{{ user }}"
    when: plex_prefs_seed.stat.exists
    register: plex_preferences_result
    tags: [config, plex]

  - name: Copy all files from Profiles directory
    ansible.builtin.copy:
      src: "{{ files }}/Profiles/"
      dest: "{{ plex_home }}/Profiles/"
      mode: '0644'
      owner: "{{ user }}"
      group: "{{ user }}"
      directory_mode: '0755'
    with_fileglob:
    - "{{ files }}/Profiles/*"
    register: plex_profiles_result
    tags: [config, plex]

  - name: Create plex docker-compose files
    ansible.builtin.template:
      src: "{{ files }}/{{ item.src }}"
      dest: "{{ plex_home }}/{{ item.dest }}"
      mode: '0644'
      owner: "{{ user }}"
      group: "{{ user }}"
    with_items:
    - { src: "plex-compose.yml.j2", dest: "docker-compose.yml" }
    - { src: "plex-compose.env.j2", dest: ".env" }
    register: plex_compose_result
    tags: [config, plex]

  - name: Create plex docker-compose systemd service
    ansible.builtin.template:
      src: "{{ files }}/plex-compose.service.j2"
      dest: "/etc/systemd/system/plex.service"
      mode: '0644'
    register: plex_service_result
    tags: [service, plex]

  - name: Create plex autoheal systemd units
    ansible.builtin.template:
      src: "{{ files }}/{{ item }}.j2"
      dest: "/etc/systemd/system/{{ item }}"
      mode: '0644'
    with_items:
    - plex-autoheal.service
    - plex-autoheal.timer
    register: plex_autoheal_result
    tags: [service, plex]

  # One-shot migration off the Plex Meta Manager name. The unit, the compose
  # project, the container and the data directory were all plex-meta-manager;
  # upstream renamed itself to Kometa and this repo followed, so these tasks
  # carry an already-deployed host across and then no-op forever.
  #
  # NOTE: order is load-bearing. The old unit's ExecStop points at the old
  # directory, so it has to stop (which is what drops its container and its
  # compose network) before anything moves, and its unit file can only be
  # deleted after that. Moving the directory before stopping leaves compose
  # unable to find its own project and the container running orphaned.
  - name: Look for the pre-rename kometa unit and data directories
    ansible.builtin.stat:
      path: "{{ item }}"
    loop:
      - /etc/systemd/system/plex-meta-manager.service
      - "{{ data }}/services/plex-meta-manager"
      - "{{ kometa_home }}"
    register: kometa_premigration
    tags: [always, setup, kometa]

  # Both paths present means a half-finished migration. Carrying on would write
  # a fresh config into the new directory and silently abandon the old cache,
  # assets and meta.log, which is also the history KometaNotRunning reads.
  - name: Refuse to guess when both kometa data directories exist
    ansible.builtin.fail:
      msg: >-
        Both {{ data }}/services/plex-meta-manager and {{ kometa_home }} exist.
        Reconcile them by hand (the old one holds the real cache/assets/logs)
        and remove the loser before re-running.
    when:
      - kometa_premigration.results[1].stat.exists
      - kometa_premigration.results[2].stat.exists
    tags: [always, setup, kometa]

  - name: Stop the pre-rename kometa service before its directory moves
    ansible.builtin.systemd:
      name: plex-meta-manager.service
      state: stopped
      enabled: false
    when: kometa_premigration.results[0].stat.exists
    tags: [always, setup, kometa]

  - name: Move the kometa data directory to its post-rename path
    ansible.builtin.command:
      cmd: mv {{ data }}/services/plex-meta-manager {{ kometa_home }}
      creates: "{{ kometa_home }}"
      removes: "{{ data }}/services/plex-meta-manager"
    tags: [always, setup, kometa]

  - name: Remove the pre-rename kometa unit
    ansible.builtin.file:
      path: /etc/systemd/system/plex-meta-manager.service
      state: absent
    register: kometa_old_unit
    tags: [always, setup, kometa]

  - name: Reload systemd after removing the pre-rename kometa unit
    ansible.builtin.systemd:
      daemon_reload: true
    when: kometa_old_unit is changed
    tags: [always, setup, kometa]

  # The refresh timer instance IS the compose project name, so the rename
  # orphans this one. node_exporter.yaml reconciles stale instances, but a
  # files/ocean-plex change never runs it, so until something else does the old
  # timer keeps firing weekly against a project that no longer exists -- the
  # case node_exporter.yaml's own teardown task exists to stop paging for.
  - name: Disable the pre-rename image-refresh timer
    ansible.builtin.systemd:
      name: docker-refresh@plex-meta-manager.timer
      state: stopped
      enabled: false
    when: kometa_premigration.results[0].stat.exists
    tags: [always, setup, kometa]

  # Backstop: `compose down` above removes this with its project. It only
  # survives if the old unit was already gone when this ran. Left in place it
  # holds its subnet forever, which is how a renamed project ends up
  # crash-looping on a subnet it cannot have back.
  - name: Remove the stale pre-rename compose network
    ansible.builtin.command:
      cmd: docker network rm plex-meta-manager_default
    register: kometa_old_network
    changed_when: kometa_old_network.rc == 0
    failed_when:
      - kometa_old_network.rc != 0
      - '"not found" not in kometa_old_network.stderr'
    tags: [always, setup, kometa]

  - name: Ensure kometa basedir exists
    ansible.builtin.file:
      path: "{{ kometa_home }}"
      state: directory
      owner: "{{ user }}"
      group: "{{ user }}"
      mode: '0755'
    tags: [always, setup, kometa]

  - name: Create kometa_home preferences file
    ansible.builtin.template:
      src: "{{ files }}/kometa/config.yml.j2"
      dest: "{{ kometa_home }}/config/config.yml"
      mode: '0644'
      owner: "{{ user }}"
      group: "{{ user }}"
    register: kometa_config_result
    tags: [config, kometa]

  - name: Create kometa docker-compose files
    ansible.builtin.template:
      src: "{{ files }}/{{ item.src }}"
      dest: "{{ kometa_home }}/{{ item.dest }}"
      mode: '0644'
      owner: "{{ user }}"
      group: "{{ user }}"
    with_items:
    - { src: "kometa-compose.yml.j2", dest: "docker-compose.yml" }
    - { src: "kometa.env.j2", dest: ".env" }
    register: kometa_compose_result
    tags: [config, kometa]

  - name: Create kometa docker-compose systemd service
    ansible.builtin.template:
      src: "{{ files }}/{{ item }}.j2"
      dest: "/etc/systemd/system/{{ item }}"
      mode: '0644'
    with_items:
    - kometa.service
    register: kometa_service_result
    tags: [service, kometa]

  - name: Enable kometa service
    ansible.builtin.systemd:
      name: kometa.service
      enabled: true
      state: started
    tags: [service, kometa]

  # The refresh timer instance IS the compose project name, so only the playbook
  # that renames a project knows the old instance is now wrong. node_exporter.yaml
  # reconciles instances from `docker compose ls`, but it is a safety net running
  # on its own schedule, not a guarantee: in the rename deploy both playbooks ran
  # in one main-apply, the reconciliation read the project BEFORE this playbook
  # renamed it, and the migration above then disabled the old instance. Net result
  # was 28 enabled timers for 29 compose projects, with kometa the gap -- an image
  # that would never be refreshed again, silently, because nothing alerts on a
  # timer that was never created. Own the timer here instead of hoping about order.
  - name: Enable the kometa image-refresh timer
    ansible.builtin.systemd:
      name: "docker-refresh@{{ kometa_service }}.timer"
      enabled: true
      state: started
    tags: [service, kometa]

  # Kometa has no metrics endpoint and its stdout is silent, so the only
  # evidence a nightly run happened is meta.log. Publishing its outcome through
  # the textfile collector is what makes a run that stops happening visible.
  - name: Deploy the Kometa metrics collector
    ansible.builtin.copy:
      src: "{{ files }}/kometa-metrics.sh"
      dest: "{{ kometa_home }}/kometa-metrics.sh"
      mode: '0755'
    tags: [config, kometa]

  - name: Install the Kometa metrics timer
    ansible.builtin.template:
      src: "{{ files }}/{{ item }}.j2"
      dest: "/etc/systemd/system/{{ item }}"
      mode: '0644'
    vars:
      home: "{{ kometa_home }}"
    loop:
      - kometa-metrics.service
      - kometa-metrics.timer
    tags: [service, kometa]

  - name: Enable the Kometa metrics timer
    ansible.builtin.systemd:
      name: kometa-metrics.timer
      enabled: true
      state: started
      daemon_reload: true
    tags: [service, kometa]

  - name: Reload systemd daemon if plex service changed
    ansible.builtin.systemd:
      daemon_reload: yes
    when: plex_service_result is defined and plex_service_result is changed
    tags: [restart, service, plex]

  - name: Enable and start plex autoheal timer
    ansible.builtin.systemd:
      name: plex-autoheal.timer
      state: started
      enabled: true
      daemon_reload: "{{ plex_autoheal_result is changed }}"
    tags: [service, plex]

  - name: Reload systemd daemon if kometa service changed
    ansible.builtin.systemd:
      daemon_reload: yes
    when: kometa_service_result is defined and kometa_service_result is changed
    tags: [restart, service, kometa]

  - name: Restart plex service if config or service changed
    ansible.builtin.systemd:
      name: plex.service
      state: restarted
    when: >
      (plex_preferences_result is defined and plex_preferences_result is changed) or
      (plex_profiles_result is defined and plex_profiles_result is changed) or
      (plex_compose_result is defined and plex_compose_result is changed) or
      (plex_service_result is defined and plex_service_result is changed)
    tags: [restart, plex]

  - name: Restart kometa service if config or service changed
    ansible.builtin.systemd:
      name: kometa.service
      state: restarted
    when: >
      (kometa_config_result is defined and kometa_config_result is changed) or
      (kometa_compose_result is defined and kometa_compose_result is changed) or
      (kometa_service_result is defined and kometa_service_result is changed)
    tags: [restart, kometa]
