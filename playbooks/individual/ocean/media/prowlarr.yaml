---
- name: Configure systemd service for prowlarr
  hosts: ocean
  become: true
  vars_files:
    - "{{ playbook_dir }}/../../../../vars/vars_service_ports.yaml"
    - "{{ playbook_dir }}/../../../../vault/secrets.yaml"

  vars:
    service: prowlarr
    image: lscr.io/linuxserver/prowlarr
    version: latest
    prowlarr_port: "{{ service_ports.prowlarr.port }}"
    exporter_service: prowlarr-exporter
    exporter_image: ghcr.io/onedr0p/exportarr
    exporter_version: latest
    exporter_port: "{{ service_ports.prowlarr_exporter.port }}"
    data: /data01
    files: "{{ playbook_dir }}/../../../../files/ocean-prowlarr"
    incoming: "{{ data }}/incoming"
    complete: "{{ data }}/complete"
    home: "{{ data }}/services/{{ service }}"
    user: media

  tasks:

  - name: Ensure basedir exists
    ansible.builtin.file:
      path: "{{ home }}"
      state: directory
      owner: "{{ user }}"
      group: "{{ user }}"
      mode: '0755'

  - name: Create prowlarr systemd service
    ansible.builtin.template:
      src: "{{ files }}/{{ item }}.j2"
      dest: "/etc/systemd/system/{{ item }}"
      mode: '0644'
    with_items:
    - prowlarr.service
    notify:
    - Reload prowlarr systemd daemon
    - Restart prowlarr service

  - name: Create exporter systemd service
    ansible.builtin.template:
      src: "{{ files }}/{{ item }}.j2"
      dest: "/etc/systemd/system/{{ item }}"
      mode: '0644'
    with_items:
    - prowlarr-exporter.service
    notify:
    - Reload exporter systemd daemon
    - Restart exporter service

  - name: Enable and start prowlarr-exporter service
    ansible.builtin.systemd:
      name: prowlarr-exporter.service
      enabled: yes
      state: started
      daemon_reload: yes

  - name: Wait for Prowlarr's API
    ansible.builtin.uri:
      url: "http://127.0.0.1:{{ prowlarr_port }}/api/v1/system/status"
      headers:
        X-Api-Key: "{{ media_services.prowlarr.api_key }}"
    register: prowlarr_status
    until: prowlarr_status.status == 200
    retries: 30
    delay: 10
    changed_when: false

  # Keys live in media_services.prowlarr.indexers.<slug>.api_key, the slug being
  # the indexer's Prowlarr name lowercased with punctuation dropped (NZBs.in ->
  # nzbsin). Sonarr, Radarr and Lidarr need nothing: they reach indexers
  # through Prowlarr's proxy with Prowlarr's own key.
  - name: Push indexer API keys from the vault
    ansible.builtin.script:
      cmd: "{{ files }}/prowlarr-indexer-keys.py"
      executable: python3
    environment:
      PROWLARR_URL: "http://127.0.0.1:{{ prowlarr_port }}"
      PROWLARR_API_KEY: "{{ media_services.prowlarr.api_key }}"
      PROWLARR_DB: "{{ home }}/config/prowlarr.db"
      INDEXER_KEYS: "{{ media_services.prowlarr.indexers | to_json }}"
    register: prowlarr_indexer_keys
    changed_when: "'changed:' in prowlarr_indexer_keys.stdout"

  - name: Show which indexer keys were pushed
    ansible.builtin.debug:
      var: prowlarr_indexer_keys.stdout_lines

  handlers:
  - name: Reload prowlarr systemd daemon
    ansible.builtin.systemd:
      daemon_reload: yes

  - name: Restart prowlarr service
    ansible.builtin.systemd:
      name: prowlarr.service
      state: restarted

  - name: Reload exporter systemd daemon
    ansible.builtin.systemd:
      daemon_reload: yes

  - name: Restart exporter service
    ansible.builtin.systemd:
      name: prowlarr-exporter.service
      state: restarted
      enabled: true
