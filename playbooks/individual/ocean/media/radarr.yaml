---
# Radarr and exporter on ocean as a compose project. The state dir from the
# original install (/data01/services/radarr, mounted as /config) is reused as-is.
- name: Radarr and exporter on ocean
  hosts: ocean
  become: true

  vars_files:
    - "{{ playbook_dir }}/../../../../vars/vars_service_ports.yaml"
    - "{{ playbook_dir }}/../../../../vault/secrets.yaml"

  vars:
    service: radarr
    image: registry-cache.home:5001/linuxserver/radarr
    version: latest
    radarr_port: "{{ service_ports.radarr.port }}"
    exporter_service: radarr-exporter
    exporter_image: registry-cache.home:5002/onedr0p/exportarr
    exporter_version: latest
    exporter_port: "{{ service_ports.radarr_exporter.port }}"
    data: /data01
    files: "{{ playbook_dir }}/../../../../files/ocean-radarr"
    incoming: "{{ data }}/incoming"
    complete: "{{ data }}/complete"
    home: "{{ data }}/services/{{ service }}"
    compose_dir: "/opt/compose/{{ service }}"
    user: media
    uid: "{{ system_users.media.uid }}"
    gid: "{{ system_users.media.gid }}"

  tasks:
    - name: Ensure basedir exists
      ansible.builtin.file:
        path: "{{ home }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: '0755'

    - name: Create config files
      ansible.builtin.template:
        src: "{{ files }}/config.xml.j2"
        dest: "{{ home }}/config.xml"
        mode: '0644'
      register: radarr_config

    - name: Ensure root-owned compose dir exists
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Template compose file (holds the API key)
      ansible.builtin.template:
        src: "{{ files }}/docker-compose.yml.j2"
        dest: "{{ compose_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0600'
      register: radarr_compose

    - name: Install systemd unit
      ansible.builtin.template:
        src: "{{ files }}/radarr.service.j2"
        dest: "/etc/systemd/system/{{ service }}.service"
        mode: '0644'
      register: radarr_unit

    # Clean up legacy bare docker run units and containers
    - name: Stop and disable legacy radarr-exporter service if present
      ansible.builtin.systemd:
        name: radarr-exporter.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove legacy radarr-exporter service file
      ansible.builtin.file:
        path: /etc/systemd/system/radarr-exporter.service
        state: absent
      register: legacy_exporter_unit

    - name: Find leftover bare docker run containers
      ansible.builtin.command: >-
        docker ps -a --filter name=^{{ item }}$
        --format 'project={{ "{{" }}.Label "com.docker.compose.project"{{ "}}" }}'
      register: legacy_containers
      changed_when: false
      check_mode: false
      loop:
        - "{{ service }}"
        - "{{ exporter_service }}"

    - name: Remove bare docker run containers before compose takes the names
      ansible.builtin.command: docker rm -f {{ item.item }}
      register: radarr_legacy_rm
      when: item.stdout | trim == 'project='
      loop: "{{ legacy_containers.results }}"

    - name: Enable and start radarr (restart only on config/unit change or legacy cleanup)
      ansible.builtin.systemd:
        name: "{{ service }}.service"
        enabled: true
        state: "{{ 'restarted' if (radarr_config is changed or radarr_compose is changed or radarr_unit is changed or radarr_legacy_rm is changed or legacy_exporter_unit is changed) else 'started' }}"
        daemon_reload: true

    # Stopping a `docker run --rm` unit kills its client with 137, so the removed
    # unit lingers as "not-found failed" until reboot (prowlarr-exporter did).
    - name: Clear the removed exporter unit's failed state
      ansible.builtin.command: systemctl reset-failed radarr-exporter.service
      when: legacy_exporter_unit is changed
      failed_when: false

    - name: Wait for Radarr's API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ radarr_port }}/api/v3/system/status"
        headers:
          X-Api-Key: "{{ media_services.radarr.api_key }}"
      register: radarr_status
      until: radarr_status.status == 200
      retries: 30
      delay: 10
      changed_when: false

    - name: Wait for the exporter to serve Radarr metrics
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ exporter_port }}/metrics"
        return_content: true
        # One scrape walks the whole library, about 20s on 4k movies.
        timeout: 60
      register: radarr_metrics
      until: radarr_metrics.status == 200 and radarr_metrics.content is search('radarr_system_status(\\{[^}]*\\})? 1')
      retries: 12
      delay: 10
      changed_when: false
