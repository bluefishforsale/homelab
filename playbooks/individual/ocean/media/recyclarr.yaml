---
# Recyclarr on ocean: TRaSH Guides profiles for Sonarr and Radarr, from git.
# files/ocean-recyclarr/recyclarr.yml.j2 is the source of truth for the custom
# formats, scores and qualities it names; a UI edit to those is undone daily.
- name: Recyclarr on ocean
  hosts: ocean
  become: true

  vars_files:
    - "{{ playbook_dir }}/../../../../vars/vars_service_ports.yaml"
    - "{{ playbook_dir }}/../../../../vault/secrets.yaml"

  vars:
    service: recyclarr
    image: ghcr.io/recyclarr/recyclarr
    version: "8"
    schedule: "@daily"
    files: "{{ playbook_dir }}/../../../../files/ocean-recyclarr"
    home: "/data01/services/{{ service }}"
    compose_dir: "/opt/compose/{{ service }}"
    user: media
    uid: "{{ system_users.media.uid }}"
    gid: "{{ system_users.media.gid }}"

  tasks:
    - name: Ensure state dir exists
      ansible.builtin.file:
        path: "{{ home }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: '0755'

    - name: Template recyclarr.yml (keys come from the environment, not this file)
      ansible.builtin.template:
        src: "{{ files }}/recyclarr.yml.j2"
        dest: "{{ home }}/recyclarr.yml"
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: '0644'
      register: recyclarr_config

    - name: Ensure root-owned compose dir exists
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Template compose file (holds the API keys)
      ansible.builtin.template:
        src: "{{ files }}/docker-compose.yml.j2"
        dest: "{{ compose_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0600'
      register: recyclarr_compose

    - name: Install systemd unit
      ansible.builtin.template:
        src: "{{ files }}/recyclarr.service.j2"
        dest: "/etc/systemd/system/{{ service }}.service"
        mode: '0644'
      register: recyclarr_unit

    - name: Enable and start recyclarr
      ansible.builtin.systemd:
        name: "{{ service }}.service"
        enabled: true
        state: "{{ 'restarted' if (recyclarr_compose is changed or recyclarr_unit is changed) else 'started' }}"
        daemon_reload: true

    # The cron only fires daily, so a config change syncs now. Recyclarr exits 0
    # on configuration errors (a duplicate instance name did), so the output is
    # checked too.
    - name: Sync now after a config change
      ansible.builtin.command: docker compose -f {{ compose_dir }}/docker-compose.yml run --rm -T {{ service }} sync
      register: recyclarr_sync
      when: recyclarr_config is changed or recyclarr_compose is changed
      failed_when: >-
        recyclarr_sync.rc != 0
        or recyclarr_sync.stdout is search('\[ERR\]|Configuration Errors')

    - name: Show the sync summary
      ansible.builtin.debug:
        msg: "{{ recyclarr_sync.stdout_lines | select('search', '\\[(INF|WRN)\\]') | list }}"
      when: recyclarr_sync is not skipped

    - name: Wait for the container to report healthy
      ansible.builtin.command: docker inspect --format '{{ "{{" }}.State.Health.Status{{ "}}" }}' {{ service }}
      register: recyclarr_health
      until: recyclarr_health.stdout == 'healthy'
      retries: 12
      delay: 10
      changed_when: false
