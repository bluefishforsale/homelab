---
# Sonarr and exporter on ocean as a compose project. The state dir from the
# original install (/data01/services/sonarr, mounted as /config) is reused as-is.
- name: Sonarr and exporter on ocean
  hosts: ocean
  become: true

  vars_files:
    - "{{ playbook_dir }}/../../../../vars/vars_service_ports.yaml"
    - "{{ playbook_dir }}/../../../../vault/secrets.yaml"

  vars:
    service: sonarr
    image: linuxserver/sonarr
    version: latest
    sonarr_port: "{{ service_ports.sonarr.port }}"
    exporter_service: sonarr-exporter
    exporter_image: ghcr.io/onedr0p/exportarr
    exporter_version: latest
    exporter_port: "{{ service_ports.sonarr_exporter.port }}"
    data: /data01
    files: "{{ playbook_dir }}/../../../../files/ocean-sonarr"
    incoming: "{{ data }}/incoming"
    complete: "{{ data }}/complete"
    home: "{{ data }}/services/{{ service }}"
    compose_dir: "/opt/compose/{{ service }}"
    user: media
    uid: "{{ system_users.media.uid }}"
    gid: "{{ system_users.media.gid }}"

  tasks:
    - name: Ensure basedir exists
      ansible.builtin.file:
        path: "{{ home }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: '0755'

    - name: Create config files
      ansible.builtin.template:
        src: "{{ files }}/config.xml.j2"
        dest: "{{ home }}/config.xml"
        mode: '0644'
      register: sonarr_config

    - name: Ensure root-owned compose dir exists
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Template compose file (holds the API key)
      ansible.builtin.template:
        src: "{{ files }}/docker-compose.yml.j2"
        dest: "{{ compose_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0600'
      register: sonarr_compose

    - name: Install systemd unit
      ansible.builtin.template:
        src: "{{ files }}/sonarr.service.j2"
        dest: "/etc/systemd/system/{{ service }}.service"
        mode: '0644'
      register: sonarr_unit

    # Clean up legacy bare docker run units and containers
    - name: Stop and disable legacy sonarr-exporter service if present
      ansible.builtin.systemd:
        name: sonarr-exporter.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove legacy sonarr-exporter service file
      ansible.builtin.file:
        path: /etc/systemd/system/sonarr-exporter.service
        state: absent
      register: legacy_exporter_unit

    - name: Find leftover bare docker run containers
      ansible.builtin.command: >-
        docker ps -a --filter name=^{{ item }}$
        --format 'project={{ "{{" }}.Label "com.docker.compose.project"{{ "}}" }}'
      register: legacy_containers
      changed_when: false
      check_mode: false
      loop:
        - "{{ service }}"
        - "{{ exporter_service }}"

    - name: Remove bare docker run containers before compose takes the names
      ansible.builtin.command: docker rm -f {{ item.item }}
      register: sonarr_legacy_rm
      when: item.stdout | trim == 'project='
      loop: "{{ legacy_containers.results }}"

    - name: Enable and start sonarr (restart only on config/unit change or legacy cleanup)
      ansible.builtin.systemd:
        name: "{{ service }}.service"
        enabled: true
        state: "{{ 'restarted' if (sonarr_config is changed or sonarr_compose is changed or sonarr_unit is changed or sonarr_legacy_rm is changed or legacy_exporter_unit is changed) else 'started' }}"
        daemon_reload: true

    # Stopping a `docker run --rm` unit kills its client with 137, so the removed
    # unit lingers as "not-found failed" until reboot (prowlarr-exporter did).
    - name: Clear the removed exporter unit's failed state
      ansible.builtin.command: systemctl reset-failed sonarr-exporter.service
      when: legacy_exporter_unit is changed
      failed_when: false

    - name: Wait for Sonarr's API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/system/status"
        headers:
          X-Api-Key: "{{ media_services.sonarr.api_key }}"
      register: sonarr_status
      until: sonarr_status.status == 200
      retries: 30
      delay: 10
      changed_when: false

    - name: Wait for the exporter to serve Sonarr metrics
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ exporter_port }}/metrics"
        return_content: true
        # One scrape walks every series, under 10s at 851 series.
        timeout: 60
      register: sonarr_metrics
      until: sonarr_metrics.status == 200 and sonarr_metrics.content is search('sonarr_system_status(\\{[^}]*\\})? 1')
      retries: 12
      delay: 10
      changed_when: false

    - name: Get current Sonarr indexer config
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/config/indexer"
        headers:
          X-Api-Key: "{{ media_services.sonarr.api_key }}"
        return_content: true
      register: sonarr_indexer_config
      changed_when: false
      tags: [rss]

    - name: Set Sonarr RSS sync interval to 10 minutes
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/config/indexer"
        method: PUT
        headers:
          X-Api-Key: "{{ media_services.sonarr.api_key }}"
        body_format: json
        body: "{{ sonarr_indexer_config.json | combine({'rssSyncInterval': 10}) }}"
        status_code: [200, 202]
      when: sonarr_indexer_config.json.rssSyncInterval != 10
      tags: [rss]
