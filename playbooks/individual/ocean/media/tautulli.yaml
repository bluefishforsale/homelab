---
- name: Configure Tautulli Plex Statistics and Monitoring using Docker Compose
  hosts: ocean
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../../../../vault/secrets.yaml"
    - "{{ playbook_dir }}/../../../../vars/vars_service_ports.yaml"

  vars:
    service: tautulli
    image: registry-cache.home:5001/linuxserver/tautulli
    version: latest
    tautulli_port: "{{ service_ports.tautulli.port }}"
    tautulli_api_key: "{{ media_services.tautulli.api_key }}"
    exporter_service: tautulli-exporter
    exporter_image: registry-cache.home:5001/nwalke/tautulli_exporter
    exporter_version: latest
    exporter_port: "{{ service_ports.tautulli_exporter.port }}"
    data: /data01
    files: "{{ playbook_dir }}/../../../../files/tautulli-compose"
    incoming: "{{ data }}/incoming"
    complete: "{{ data }}/complete"
    home: "{{ data }}/services/{{ service }}"
    plex_logs: "{{ data }}/services/plex/Library/Application Support/Plex Media Server/Logs"
    user: media
    uid: "{{ system_users.media.uid }}"
    gid: "{{ system_users.media.gid }}"
    # The config.ini keys this repo owns, each in the section Tautulli reads it
    # from (plexpy/config.py). Everything else, auth and jwt_secret above all,
    # belongs to Tautulli.
    # NOTE: never manage http_username, http_password or jwt_secret here. Since
    # v2.19 an empty password makes Tautulli generate a random one and rotate
    # jwt_secret on start, which logs everyone out. The old whole-file template
    # did exactly that on every deploy (2026-11-12). Login is Plex sign-in.
    tautulli_settings:
      - { section: General, option: api_enabled, value: '1' }
      - { section: General, option: api_key, value: "{{ tautulli_api_key }}" }
      - { section: General, option: check_github, value: '1' }
      - { section: General, option: first_run_complete, value: '1' }
      - { section: General, option: launch_browser, value: '0' }
      - { section: General, option: http_port, value: '8181' }
      - { section: General, option: http_host, value: 0.0.0.0 }
      - { section: General, option: enable_https, value: '0' }
      - { section: General, option: http_plex_admin, value: '1' }
      - { section: PMS, option: pms_identifier, value: "{{ media_services.plex.pms_identifier }}" }
      # NOTE: with pms_url_manual, Tautulli rebuilds pms_url from pms_ip, so this
      # must be the hostname: by bare IP Plex serves its plex.direct cert, which
      # chains to a root nothing here trusts yet. Without manual, it swaps in the
      # plex.direct URL from plex.tv instead. extra_hosts pins the name to ocean.
      - { section: PMS, option: pms_ip, value: home.terrac.com }
      - { section: PMS, option: pms_port, value: '32400' }
      - { section: PMS, option: pms_is_remote, value: '0' }
      - { section: PMS, option: pms_ssl, value: '1' }
      - { section: PMS, option: pms_url, value: "https://home.terrac.com:32400" }
      - { section: PMS, option: pms_url_manual, value: '1' }
      - { section: PMS, option: pms_token, value: "{{ media_services.plex.api_key }}" }
      - { section: PMS, option: pms_use_bif, value: '0' }
      - { section: Monitoring, option: monitoring_use_websocket, value: '1' }
      - { section: Monitoring, option: refresh_users_on_startup, value: '1' }
      - { section: Monitoring, option: refresh_libraries_on_startup, value: '1' }

  tasks:

  - name: Ensure base directory exists
    ansible.builtin.file:
      path: "{{ home }}"
      state: directory
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0755'

  - name: Ensure config subdirectory exists
    ansible.builtin.file:
      path: "{{ home }}/config"
      state: directory
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0755'

  - name: Create docker-compose.yml
    ansible.builtin.template:
      src: "{{ files }}/docker-compose.yml.j2"
      dest: "{{ home }}/docker-compose.yml"
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0644'
    register: docker_compose_config

  - name: Create tautulli environment file
    ansible.builtin.template:
      src: "{{ files }}/tautulli.env.j2"
      dest: "{{ home }}/.env"
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0600'
    register: tautulli_env

  # Tautulli writes its whole config back from memory, so an edit made while it
  # runs is lost. Find drift first, and stop it only when there is some.
  - name: Check config.ini for drift from the owned settings
    community.general.ini_file:
      path: "{{ home }}/config/config.ini"
      section: "{{ item.section }}"
      option: "{{ item.option }}"
      value: "{{ item.value }}"
      create: true
    check_mode: true
    loop: "{{ tautulli_settings }}"
    loop_control:
      label: "{{ item.section }}.{{ item.option }}"
    no_log: true
    register: tautulli_drift

  - name: Stop Tautulli so it cannot write over the config edit
    ansible.builtin.command:
      cmd: docker compose stop tautulli
      chdir: "{{ home }}"
    when: tautulli_drift is changed
    failed_when: false

  - name: Set the owned settings in config.ini
    community.general.ini_file:
      path: "{{ home }}/config/config.ini"
      section: "{{ item.section }}"
      option: "{{ item.option }}"
      value: "{{ item.value }}"
      create: true
      owner: "{{ uid }}"
      group: "{{ gid }}"
      mode: '0644'
    loop: "{{ tautulli_settings }}"
    loop_control:
      label: "{{ item.section }}.{{ item.option }}"
    no_log: true
    register: tautulli_config

  - name: Show what configuration files changed
    ansible.builtin.debug:
      msg: "Configuration files have been updated - containers will be recreated"
    when: docker_compose_config.changed or tautulli_env.changed or tautulli_config.changed

  - name: Stop and remove old systemd services if they exist
    ansible.builtin.systemd:
      name: "{{ item }}"
      state: stopped
      enabled: no
    ignore_errors: yes
    with_items:
    - tautulli.service
    - tautulli-exporter.service

  - name: Remove old systemd service files
    ansible.builtin.file:
      path: "/etc/systemd/system/{{ item }}"
      state: absent
    with_items:
    - tautulli.service
    - tautulli-exporter.service

  - name: Create tautulli-compose systemd service
    ansible.builtin.template:
      src: "{{ files }}/tautulli-compose.service.j2"
      dest: "/etc/systemd/system/tautulli.service"
      mode: '0644'
    notify:
    - Reload systemd daemon
    - Restart tautulli service
  
  - name: Enable tautulli service
    ansible.builtin.systemd:
      name: tautulli.service
      enabled: yes
      daemon_reload: yes

  - name: Recreate containers if config changed
    ansible.builtin.shell: |
      cd {{ home }}
      echo "Recreating containers due to configuration changes..."
      docker compose down --timeout 30
      docker compose up -d --force-recreate
      echo "Container recreation completed"
    when: docker_compose_config.changed or tautulli_env.changed or tautulli_config.changed

  - name: Wait for Tautulli to be ready after config change
    ansible.builtin.wait_for:
      host: "{{ ansible_default_ipv4.address }}"
      port: "{{ tautulli_port }}"
      delay: 5
      timeout: 60
    when: docker_compose_config.changed or tautulli_env.changed or tautulli_config.changed

  handlers:
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      daemon_reload: yes

  - name: Restart tautulli service
    ansible.builtin.systemd:
      name: tautulli.service
      state: restarted
