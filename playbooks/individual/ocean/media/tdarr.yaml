---
- name: Tdarr and Tdarr_Node
  hosts: ocean
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../../../../vars/vars_service_ports.yaml"
    - "{{ playbook_dir }}/../../../../vault/secrets.yaml"

  vars:
    image: registry-cache.home:5002/haveagitgat/tdarr
    version: latest
    service: tdarr
    node_image: registry-cache.home:5002/haveagitgat/tdarr_node
    node_version: latest
    service_node: tdarr-node
    tdarr_port_web: "{{ service_ports.tdarr.port }}"   # host-facing web UI
    tdarr_port_api: 8266                                # internal only
    node_port: 8267                                     # internal only
    path_complete: /data01/complete
    path_data01: /data01/services
    path_home: "{{ path_data01 }}/{{ service }}"
    transcode: /transcode
    compose_dir: "/opt/compose/{{ service }}"
    # A quarter of the host's cores, shared by the server and node containers.
    tdarr_cpu_quota_pct: "{{ ansible_processor_vcpus * 25 }}"
    # 3 GPU transcodes plus their CPU-side decode and loudnorm pushed ocean to
    # load 54 on 2026-10-19.
    tdarr_transcode_gpu_workers: 2
    # Every node pauses for the evening playback peak (tautulli, 30 days of
    # play duration by hour), Pacific time.
    tdarr_pause_start_hour: 17
    tdarr_pause_end_hour: 21
    repo: "bluefishforsale_tdarr_plugins"
    # SSH, not anonymous HTTPS: the plugins repo is private, so an unauthenticated
    # HTTPS clone prompts for a username and fails on ocean ("could not read
    # Username for https://github.com"). ocean's SSH key authenticates as
    # bluefishforsale and has access, matching how blog/terrac_com clone.
    github: "git@github.com:bluefishforsale/{{repo}}.git"

  tasks:
  - name: Ensure basedir exists
    ansible.builtin.file:
      path: "{{ path_home }}"
      state: directory
      owner: root
      group: root
      mode: '0755'

  # conf and logs belong to the container's PUID: tdarr chowns them on start,
  # and with no restart after a deploy a root owner here would stick.
  - name: Ensure subdirectory exists with correct ownership and permissions
    ansible.builtin.file:
      path: "{{ path_home }}/{{ item.dir }}"
      state: directory
      owner: "{{ item.owner }}"
      group: "{{ item.owner }}"
      mode: '0755'
    loop:
    - { dir: conf, owner: media }
    - { dir: server, owner: root }
    - { dir: logs, owner: media }
    loop_control:
      label: "{{ item.dir }}"

  # NOTE: tdarr rewrites both files on every start (adds seededApiKey,
  # serverDualStack and jobReportsPath, sets mode 0664), so a plain template
  # never matched and every run of this play restarted tdarr and its node,
  # killing running transcodes and any API caller mid-request (2026-10-17).
  # Compare as data and write only when a key this repo sets differs.
  - name: Read live tdarr config files
    ansible.builtin.slurp:
      path: "{{ path_home }}/conf/{{ item }}"
    loop:
    - Tdarr_Server_Config.json
    - Tdarr_Node_Config.json
    register: tdarr_conf_live
    failed_when: false

  - name: Create tdarr config files
    vars:
      live: "{{ (item.content | b64decode | from_json) if item.content is defined else {} }}"
      desired: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../../../../files/ocean-tdarr/conf/' ~ item.item ~ '.j2', convert_data=false) | from_json }}"
    ansible.builtin.copy:
      content: "{{ live | combine(desired) | to_nice_json(indent=2) }}"
      dest: "{{ path_home }}/conf/{{ item.item }}"
      mode: '0644'
    loop: "{{ tdarr_conf_live.results }}"
    loop_control:
      label: "{{ item.item }}"
    when: live | combine(desired) != live
    register: tdarr_conf

  - name: Git clone plugins and flows
    ansible.builtin.git:
      repo: "{{ github }}"
      dest: "{{ path_home }}/plugins/"
      depth: 1
      update: yes
      accept_hostkey: yes
    # The play runs as root, and root has no GitHub key. Point git at terrac's
    # authorized key (same one terrac_com/blog use) so the private-repo SSH clone
    # authenticates. IdentitiesOnly avoids offering root's keys and tripping
    # GitHub's "too many authentication failures".
    environment:
      GIT_SSH_COMMAND: "ssh -i /home/terrac/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"

  - name: Create tdarr CPU slice
    ansible.builtin.template:
      src: "{{ playbook_dir }}/../../../../files/ocean-tdarr/tdarr.slice.j2"
      dest: /etc/systemd/system/tdarr.slice
      mode: '0644'
    register: tdarr_slice

  - name: Ensure root-owned compose dir exists
    ansible.builtin.file:
      path: "{{ compose_dir }}"
      state: directory
      owner: root
      group: root
      mode: '0755'

  - name: Template compose file
    ansible.builtin.template:
      src: "{{ playbook_dir }}/../../../../files/ocean-tdarr/docker-compose.yml.j2"
      dest: "{{ compose_dir }}/docker-compose.yml"
      owner: root
      group: root
      mode: '0644'
    register: tdarr_compose

  - name: Install systemd unit
    ansible.builtin.template:
      src: "{{ playbook_dir }}/../../../../files/ocean-tdarr/tdarr.service.j2"
      dest: /etc/systemd/system/tdarr.service
      mode: '0644'
    register: tdarr_unit

  # The node used to be its own docker-run unit; compose owns it now.
  - name: Stop and disable legacy tdarr_node service if present
    ansible.builtin.systemd:
      name: tdarr_node.service
      state: stopped
      enabled: false
    failed_when: false

  - name: Remove legacy tdarr_node service file
    ansible.builtin.file:
      path: /etc/systemd/system/tdarr_node.service
      state: absent
    register: legacy_node_unit

  - name: Find leftover bare docker run containers
    ansible.builtin.command: >-
      docker ps -a --filter name=^{{ item }}$
      --format 'project={{ "{{" }}.Label "com.docker.compose.project"{{ "}}" }}'
    register: legacy_containers
    changed_when: false
    check_mode: false
    loop:
      - "{{ service }}"
      - "{{ service_node }}"

  - name: Remove bare docker run containers before compose takes the names
    ansible.builtin.command: docker rm -f {{ item.item }}
    register: tdarr_legacy_rm
    when: item.stdout | trim == 'project='
    loop: "{{ legacy_containers.results }}"

  # NOTE: a restart kills every running transcode, so it happens only when
  # something here changed. tdarr rewrites its own config files on start, which
  # is why tdarr_conf compares as data above instead of as a template.
  - name: Enable and start tdarr (restart only on config/unit change or legacy cleanup)
    ansible.builtin.systemd:
      name: tdarr.service
      enabled: true
      state: "{{ 'restarted' if (tdarr_conf is changed or tdarr_slice is changed or tdarr_compose is changed or tdarr_unit is changed or tdarr_legacy_rm is changed or legacy_node_unit is changed) else 'started' }}"
      daemon_reload: true

  # Stopping a `docker run --rm` unit kills its client with 137, so the removed
  # unit lingers as "not-found failed" until reboot (prowlarr-exporter did).
  - name: Clear the removed node unit's failed state
    ansible.builtin.command: systemctl reset-failed tdarr_node.service
    when: legacy_node_unit is changed
    failed_when: false

  # The flow lives in tdarr's own DB, so until this task the committed JSON was
  # only documentation and the live flow drifted from it unseen. Push it through
  # the API, and only when it differs, so a run with no flow change stays a no-op.
  # Node positions and the UI's edge styling keys are ignored in the comparison.
  # The template inlines files/ocean-tdarr/conf/audio-policy.js as the Audio
  # Policy node's code, so the JS is reviewed as JS rather than an escaped string.
  # When the HEVC encode comes out larger than the source (a lean WEB-DL), the
  # flow resets to the source and runs the audio-only path, keeping the video:
  # discarding everything left such files unfixed and marked "Not required".
  # NOTE: Execute already emits `-map 0:N -c:N copy` for every stream, so the
  # flow's custom arguments must carry codec options only. Any `-map` there
  # muxes streams twice, which is what broke ~1,185 library files.
  # The `-disposition:V:0 +default` there is deliberate: with no explicit
  # disposition, ffmpeg marks the first subtitle default and players turn subs on.
  - name: Read committed tdarr flow
    ansible.builtin.set_fact:
      tdarr_flow: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../../../../files/ocean-tdarr/conf/HEVC_NVENC_Reduce_Flow.json.j2', convert_data=false) | from_json }}"

  - name: Fetch live tdarr flow
    ansible.builtin.uri:
      url: "http://localhost:{{ tdarr_port_web }}/api/v2/cruddb"
      method: POST
      body_format: json
      body:
        data:
          collection: FlowsJSONDB
          mode: getById
          docID: "{{ tdarr_flow._id }}"
    register: tdarr_live_flow
    # Up to the server's 300s start_period after a restart.
    retries: 30
    delay: 10
    until: tdarr_live_flow.status == 200

  - name: Push tdarr flow when it differs from the committed one
    ansible.builtin.uri:
      url: "http://localhost:{{ tdarr_port_web }}/api/v2/cruddb"
      method: POST
      body_format: json
      body:
        data:
          collection: FlowsJSONDB
          mode: update
          docID: "{{ tdarr_flow._id }}"
          obj:
            name: "{{ tdarr_flow.name }}"
            flowPlugins: "{{ tdarr_flow.flowPlugins }}"
            flowEdges: "{{ tdarr_flow.flowEdges }}"
    vars:
      live: "{{ tdarr_live_flow.json | default({}, true) }}"
      live_plugins: "{{ live.flowPlugins | default([]) | map('dict2items') | map('rejectattr', 'key', 'equalto', 'position') | map('items2dict') | list }}"
      want_plugins: "{{ tdarr_flow.flowPlugins | map('dict2items') | map('rejectattr', 'key', 'equalto', 'position') | map('items2dict') | list }}"
      live_edges: "{{ live.flowEdges | default([]) | map(attribute='source') | zip(live.flowEdges | default([]) | map(attribute='sourceHandle'), live.flowEdges | default([]) | map(attribute='target')) | list }}"
      want_edges: "{{ tdarr_flow.flowEdges | map(attribute='source') | zip(tdarr_flow.flowEdges | map(attribute='sourceHandle'), tdarr_flow.flowEdges | map(attribute='target')) | list }}"
    when: live.name | default('') != tdarr_flow.name or live_plugins != want_plugins or live_edges != want_edges
    changed_when: true

  # Newest first, so a fresh download (a request, or a media-refetch.py batch)
  # is processed within hours instead of waiting behind the whole backlog.
  # NOTE: the stall detector counts Replace Original's copy back as no progress.
  # A worker node copies its result to /media over NFS (EXDEV, so no rename),
  # and at the default 300s it killed a 70 GB 2160p copy on harbor at 62 GB
  # (2026-10-29), leaving a .tmp in the library and the output in the cache.
  - name: Process the tdarr queue newest first, with a stall window that fits an NFS copy-back
    ansible.builtin.uri:
      url: "http://localhost:{{ tdarr_port_web }}/api/v2/cruddb"
      method: POST
      body_format: json
      body:
        data:
          collection: SettingsGlobalJSONDB
          mode: update
          docID: globalsettings
          obj:
            queueSortType: sortDateNewest
            workerStallDetectorInterval: 1800
    changed_when: false

  # Worker limits live in tdarr's DB, not the node config, and the API only
  # steps them one at a time, so step toward the committed count.
  - name: Read tdarr node worker limits
    ansible.builtin.uri:
      url: "http://localhost:{{ tdarr_port_web }}/api/v2/get-nodes"
      method: GET
    register: tdarr_nodes
    retries: 30
    delay: 10
    until: tdarr_nodes.status == 200 and (tdarr_nodes.json | dict2items | selectattr('value.nodeName', 'equalto', inventory_hostname ~ '.home') | list | length) > 0

  - name: Step tdarr GPU transcode workers to the committed count
    vars:
      node: "{{ tdarr_nodes.json | dict2items | selectattr('value.nodeName', 'equalto', inventory_hostname ~ '.home') | first }}"
      delta: "{{ tdarr_transcode_gpu_workers - (node.value.workerLimits.transcodegpu | int) }}"
    ansible.builtin.uri:
      url: "http://localhost:{{ tdarr_port_web }}/api/v2/alter-worker-limit"
      method: POST
      body_format: json
      body:
        data:
          nodeID: "{{ node.key }}"
          process: "{{ 'increase' if (delta | int) > 0 else 'decrease' }}"
          workerType: transcodegpu
    loop: "{{ range(delta | int | abs) | list }}"
    changed_when: true

  - name: Install the playback-window pause script
    ansible.builtin.template:
      src: "{{ playbook_dir }}/../../../../files/ocean-tdarr/tdarr-playback-window.sh.j2"
      dest: /usr/local/bin/tdarr-playback-window.sh
      mode: '0755'

  - name: Install the playback-window unit and timer
    ansible.builtin.template:
      src: "{{ playbook_dir }}/../../../../files/ocean-tdarr/{{ item }}.j2"
      dest: "/etc/systemd/system/{{ item }}"
      mode: '0644'
    loop:
      - tdarr-playback-window.service
      - tdarr-playback-window.timer
    register: tdarr_window_units

  - name: Enable the playback-window timer
    ansible.builtin.systemd:
      name: tdarr-playback-window.timer
      enabled: true
      state: started
      daemon_reload: "{{ tdarr_window_units is changed }}"

  # Run once now, so a deploy inside the window pauses the nodes immediately
  # instead of waiting for the next boundary.
  - name: Apply the playback window for the current hour
    ansible.builtin.systemd:
      name: tdarr-playback-window.service
      state: started
