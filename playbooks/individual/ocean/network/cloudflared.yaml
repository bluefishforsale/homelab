---
# Runs cloudflared on every host. Tunnel ingress is remote config owned by
# terraform-root (cloudflare-tunnel-configs.tf); the rendered config.yaml only
# carries process settings.
#
# Every Cloudflare object this play used to create through the API (tunnels,
# CNAMEs, Access apps and policies, rulesets, zone settings) is owned by
# bluefishforsale/terraform-root now, and this play only reads: it looks up the
# host's ssh-<host> tunnel and fetches its token. A new host or service needs
# its tunnel, CNAME and Access app merged and applied in terraform-root before
# this runs; a missing tunnel fails the play instead of being created. See
# agents.md, "Cloud infrastructure lives in terraform-root".
- name: Configure systemd service for cloudflared
  become: true
  gather_facts: true
  hosts: all:!macos  # Can run on any host

  vars_files:
    - "{{ playbook_dir }}/../../../../vault/secrets.yaml"

  vars:
    package: cloudflared
    service: cloudflared
    files: "{{ playbook_dir }}/../../../../files/{{ service }}"
    path_home: "/etc/{{ service }}"
    local_cert_path: "/tmp/cloudflared-ansible-cert.pem"
    config: "{{ path_home }}/config.yaml"
    cert: "{{ path_home }}/cert.pem"
    # Ocean gets the main tunnel (web apps + SSH), others get SSH-only
    tunnel_name: "{{ 'main' if inventory_hostname == 'ocean' else 'ssh_only' }}"
    # Dynamically set based on host - will be overridden by set_fact for non-ocean hosts
    cred_file: "{{ path_home }}/{{ ssh_tunnel_id | default(cloudflare.tunnel_ids[tunnel_name]) }}.json"
    tunnel: "{{ ssh_tunnel_id | default(cloudflare.tunnel_ids[tunnel_name]) }}"

  tasks:

  # Write vault cert to temp file for local cloudflared commands
  - name: Create temporary cert file from vault for local commands
    ansible.builtin.copy:
      content: "{{ cloudflare.cert_pem }}"
      dest: "{{ local_cert_path }}"
      mode: '0600'
    delegate_to: localhost
    run_once: true
    become: false
    changed_when: false

  # Tunnel Management Tasks
  - name: Check if SSH tunnel already exists for non-ocean hosts
    ansible.builtin.command: >
      cloudflared tunnel --origincert {{ local_cert_path }} info ssh-{{ inventory_hostname }}
    register: tunnel_check
    failed_when: false
    changed_when: false
    when: inventory_hostname != 'ocean'
    delegate_to: localhost
    become: false

  - name: Debug tunnel_check variable
    ansible.builtin.debug:
      msg: 
        - "tunnel_check defined: {{ tunnel_check is defined }}"
        - "tunnel_check content: {{ tunnel_check | default('undefined') }}"
    when: inventory_hostname != 'ocean'

  # NOTE: terraform-root creates ssh-<host> tunnels (cloudflare-tunnels.tf),
  # along with their CNAME and Access app. Creating one here would leave it
  # unmanaged and with no DNS route, since this play no longer writes DNS.
  - name: Fail when the host's SSH tunnel doesn't exist yet
    ansible.builtin.fail:
      msg: >-
        Tunnel ssh-{{ inventory_hostname }} doesn't exist. Add it, its CNAME and
        its Access app in bluefishforsale/terraform-root, merge and apply, then
        rerun this play.
    when:
      - inventory_hostname != 'ocean'
      - (tunnel_check is not defined) or (tunnel_check.rc is not defined) or (tunnel_check.rc != 0)
      - not ansible_check_mode

  - name: Get existing tunnel ID if tunnel already existed
    ansible.builtin.command: >
      cloudflared tunnel --origincert {{ local_cert_path }} --output json info ssh-{{ inventory_hostname }}
    register: existing_tunnel_info
    when: 
      - inventory_hostname != 'ocean'
      - tunnel_check is defined
      - tunnel_check.rc is defined
      - tunnel_check.rc == 0
    delegate_to: localhost
    become: false

  - name: Extract existing tunnel ID
    ansible.builtin.set_fact:
      ssh_tunnel_id: "{{ (existing_tunnel_info.stdout | from_json).id }}"
    when: 
      - inventory_hostname != 'ocean'
      - existing_tunnel_info is defined
      - existing_tunnel_info.stdout is defined
      - existing_tunnel_info.stdout != ""
      - not ansible_check_mode

  - name: Display tunnel creation success
    ansible.builtin.debug:
      msg: "SSH tunnel ready: ssh-{{ inventory_hostname }} ({{ ssh_tunnel_id }})"
    when:
      - inventory_hostname != 'ocean'
      - ssh_tunnel_id is defined

  - name: Test SSH tunnel connectivity
    ansible.builtin.command: >
      cloudflared access ssh --hostname ssh-{{ inventory_hostname }}.terrac.com --dry-run
    register: ssh_test
    failed_when: false
    when: 
      - inventory_hostname != 'ocean'
      - ssh_tunnel_id is defined
    delegate_to: localhost
    become: false

  - name: Display SSH test result
    ansible.builtin.debug:
      msg: "SSH tunnel test: {{ 'PASS' if ssh_test.rc == 0 else 'FAIL - ' + ssh_test.stderr }}"
    when:
      - inventory_hostname != 'ocean'
      - ssh_test is defined
      - ssh_test.rc is defined

  # SSH Server Setup (required for SSH tunnels)
  # Refresh the cache best-effort: a broken unrelated third-party repo (e.g. a
  # GPU host's stale nvidia apt source with a rotated key) must not fail the
  # whole tunnel deploy. apt still indexes the good repos on partial failure.
  - name: Refresh apt cache (best-effort)
    apt:
      update_cache: yes
    become: yes
    failed_when: false

  - name: Install OpenSSH server
    apt:
      name: openssh-server
      state: present
    become: yes

  - name: Ensure SSH service is enabled and started
    systemd:
      name: ssh
      state: started
      enabled: yes
    become: yes

  # NOTE: key-only SSH. sshd is internet-reachable through the ssh-<host> tunnels,
  # so password auth is attack surface (CVE-2026-123158 needed it, though this
  # glibc+PAM fleet was not exposed). KbdInteractive is pinned off because with
  # UsePAM it is a second password path. sshd takes the FIRST value it reads and
  # Debian includes sshd_config.d/*.conf at the top, so the 00- drop-in is what
  # actually wins; a later drop-in (cloud-init's 50-cloud-init.conf) cannot
  # override it, and the sshd -T assert fails the play if anything else does.
  - name: Enforce key-only SSH auth via a first-sorting drop-in
    ansible.builtin.copy:
      dest: /etc/ssh/sshd_config.d/00-key-only.conf
      content: |
        PasswordAuthentication no
        KbdInteractiveAuthentication no
      owner: root
      group: root
      mode: '0644'
      validate: '/usr/sbin/sshd -t -f %s'
    become: true
    notify: restart ssh

  - name: Configure SSH for tunnel access
    lineinfile:
      path: /etc/ssh/sshd_config
      regexp: '^#?{{ item.key }}'
      line: '{{ item.key }} {{ item.value }}'
      backup: yes
      validate: '/usr/sbin/sshd -t -f %s'
    with_items:
      - { key: 'PermitRootLogin', value: 'no' }
      - { key: 'PasswordAuthentication', value: 'no' }
      - { key: 'KbdInteractiveAuthentication', value: 'no' }
      - { key: 'PubkeyAuthentication', value: 'yes' }
      - { key: 'Port', value: '22' }
    become: yes
    notify: restart ssh

  # Restart now, not at play end: a later task failing would skip the handler,
  # leaving files at key-only but the running sshd still accepting passwords,
  # and the next run would see no change and never restart it.
  - name: Apply sshd config changes now
    ansible.builtin.meta: flush_handlers

  - name: Read effective sshd auth settings
    ansible.builtin.command: /usr/sbin/sshd -T
    register: sshd_effective
    changed_when: false
    check_mode: false
    become: true

  - name: Assert sshd is key-only
    when: not ansible_check_mode
    ansible.builtin.assert:
      that:
        - "'passwordauthentication no' in sshd_effective.stdout_lines"
        - "'kbdinteractiveauthentication no' in sshd_effective.stdout_lines"
      fail_msg: "sshd still allows password auth; check /etc/ssh/sshd_config.d/ for an override"

  - name: Verify SSH server is accessible locally
    wait_for:
      port: 22
      host: 127.0.0.1
      timeout: 10
    ignore_errors: yes
    register: ssh_check

  - name: Display SSH connectivity status
    debug:
      msg: "SSH server status: {{ 'ACCESSIBLE' if ssh_check is not failed else 'NOT ACCESSIBLE - SSH tunnels may not work' }}"

  # Standard Installation Tasks  
  - name: Ensure base directory exists
    file:
      path: "{{ path_home }}"
      state: directory
      mode: '0755'

  - name: Ensure keyrings directory exists
    file:
      path: /usr/share/keyrings
      state: directory
      mode: '0755'

  - name: Add Cloudflare package signing key
    ansible.builtin.get_url:
      url: https://pkg.cloudflare.com/cloudflare-main.gpg
      dest: /usr/share/keyrings/cloudflare-main.gpg
      mode: '0644'

  - name: Add Cloudflare repository
    ansible.builtin.copy:
      dest: /etc/apt/sources.list.d/cloudflared.list
      content: |
        deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main
      mode: '0644'

  # Best-effort refresh so the just-added cloudflare repo is indexed, without
  # letting a broken unrelated repo abort the play (apt still indexes the good
  # repos on partial failure; cloudflared is already installed fleet-wide).
  - name: Refresh apt cache after adding cloudflare repo (best-effort)
    ansible.builtin.apt:
      update_cache: yes
    failed_when: false

  - name: Install cloudflared
    ansible.builtin.apt:
      name: cloudflared
      state: present

  - name: Write Cloudflare certificate from vault
    ansible.builtin.copy:
      content: "{{ cloudflare.cert_pem }}"
      dest: "{{ path_home }}/cert.pem"
      mode: '0600'
    notify:
      - Reload systemd daemon
      - Restart service

  - name: Create tunnel credentials JSON from vault (ocean main tunnel)
    ansible.builtin.copy:
      content: |
        {"AccountTag":"{{ cloudflare.tunnel_credentials[tunnel_name].account_tag }}","TunnelSecret":"{{ cloudflare.tunnel_credentials[tunnel_name].tunnel_secret }}","TunnelID":"{{ cloudflare.tunnel_credentials[tunnel_name].tunnel_id }}"}
      dest: "{{ path_home }}/{{ cloudflare.tunnel_ids[tunnel_name] }}.json"
      mode: '0600'
    when: inventory_hostname == 'ocean'
    notify:
      - Reload systemd daemon
      - Restart service

  # Non-ocean SSH tunnels authenticate via TUNNEL_TOKEN env var instead of
  # a per-host credentials JSON. The token is a base64 JWT containing the
  # same {account_tag, tunnel_id, tunnel_secret}; we fetch it from CF at
  # playbook runtime via the origincert so no per-host secret needs to
  # live in vault or the repo. Tunnels remain locally-managed
  # (config_src=local), so config.yaml still drives ingress.
  - name: Fetch tunnel token for non-ocean hosts
    ansible.builtin.command: >
      cloudflared tunnel --origincert {{ local_cert_path }} token ssh-{{ inventory_hostname }}
    register: tunnel_token_result
    changed_when: false
    no_log: true
    when:
      - inventory_hostname != 'ocean'
      - ssh_tunnel_id is defined
    delegate_to: localhost
    become: false

  - name: Write tunnel token EnvironmentFile on non-ocean hosts
    ansible.builtin.copy:
      content: "TUNNEL_TOKEN={{ tunnel_token_result.stdout }}\n"
      dest: "{{ path_home }}/token.env"
      mode: '0600'
      owner: root
      group: root
    no_log: true
    when:
      - inventory_hostname != 'ocean'
      - tunnel_token_result is defined
      - tunnel_token_result.stdout is defined
      - tunnel_token_result.stdout != ''
    notify:
      - Reload systemd daemon
      - Restart service

  - name: Template configuration and keys
    ansible.builtin.template:
      src: "{{ files }}/{{ item }}.j2"
      dest: "{{ path_home }}/{{item}}"
      mode: '0600'
    loop:
    - config.yaml
    notify:
    - Reload systemd daemon
    - Restart service

  - name: Create systemd service and timer
    ansible.builtin.template:
      src: "{{ files }}/{{ item }}.j2"
      dest: "/etc/systemd/system/{{ item }}"
      mode: '0644'
    with_items:
    - cloudflared.service
    notify:
    - Reload systemd daemon
    - Restart service

  - name: Enable cloudflared service
    ansible.builtin.systemd:
      name: cloudflared.service
      enabled: yes
      daemon_reload: yes

  - name: Start cloudflared service if not running
    ansible.builtin.systemd:
      name: cloudflared.service
      state: started

  # Cleanup temp cert file
  - name: Remove temporary cert file
    ansible.builtin.file:
      path: "{{ local_cert_path }}"
      state: absent
    delegate_to: localhost
    run_once: true
    become: false
    changed_when: false

  handlers:
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      daemon_reload: yes

  - name: Restart service
    ansible.builtin.systemd:
      name: cloudflared.service
      state: restarted

  - name: restart ssh
    systemd:
      name: ssh
      state: restarted
    become: yes
