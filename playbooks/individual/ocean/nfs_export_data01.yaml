---
# Export ocean's /data01 over NFSv4.2 to the data01 workers (spec:
# docs/specs/2026-10-17-node005-docker-host-design.md, 4.2). Workers mount the
# media and download payloads from here; their service state stays on their own
# local disk, because nothing with a WAL goes over NFS.
#
# Additive only: it installs the NFS server and manages two drop-in files. It
# never restarts anything on ocean except nfs-server itself, and it never
# touches ZFS (the export is plain /etc/exports.d, sharenfs stays off).

- name: Export /data01 to data01 workers
  hosts: ocean
  become: true
  gather_facts: false
  vars:
    # NOTE: one export of the whole pool, not media/complete/incoming apart.
    # The *arr apps import by hardlink from /data01/complete into
    # /data01/media, and a hardlink across two NFS mounts fails with EXDEV
    # even when the server side is one filesystem.
    nfs_export_path: /data01
    # No crossmnt, so the data01/docker child dataset is never traversed.
    nfs_export_options: rw,sync,no_subtree_check,root_squash,sec=sys,fsid=1
    # Diskless netboot hosts that opt in (vars_netboot.yaml) get only the
    # library, never all of /data01: they boot from an image anyone on the LAN
    # can fetch and sit at an address nothing else vouches for, so they must
    # not be able to reach /data01/services and its databases. all_squash maps
    # every write to the media user regardless of what the client claims.
    #
    # NOTE: subtree_check, unlike the workers' export. /data01/complete and
    # /data01/services are one dataset (data01), so without it the server
    # accepts any file handle on that filesystem and a crafted one reaches
    # service state despite the narrower path. Its usual cost, stale handles
    # when an open file is renamed across directories, does not arise: tdarr
    # builds output in the host's local tmpfs and copies it back. The real
    # boundary would be a dataset split, which is a hand-run ZFS change.
    netboot_export_path: /data01/complete
    netboot_export_options: "rw,sync,subtree_check,all_squash,anonuid={{ system_users.media.uid }},anongid={{ system_users.media.gid }},sec=sys,fsid=2"
    netboot_client_ips: "{{ netboot_hosts.values() | selectattr('nfs', 'defined') | selectattr('nfs') | map(attribute='ip') | list }}"

  vars_files:
    - ../../../vault/secrets.yaml
    - ../../../vars/vars_netboot.yaml

  tasks:
    # NOTE: an empty client list renders a bare "/data01", which exportfs
    # reads as an export to every host.
    - name: Assert there is at least one data01 worker
      ansible.builtin.assert:
        that: groups['data01_workers'] | default([]) | length > 0
        fail_msg: "[data01_workers] is empty; refusing to write an export with no clients"

    - name: Assert every data01 worker has a static address
      ansible.builtin.assert:
        that: hostvars[item].ansible_ssh_host is defined
        fail_msg: "{{ item }} has no ansible_ssh_host; the export is keyed on its IP"
      loop: "{{ groups['data01_workers'] }}"

    - name: Install NFS server
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure NFS drop-in directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /etc/nfs.conf.d
        - /etc/exports.d

    # NFSv4 only means one TCP port (2049) and no rpcbind/mountd exposure.
    - name: Disable NFSv3
      ansible.builtin.copy:
        dest: /etc/nfs.conf.d/data01-workers.conf
        content: |
          # Managed by Ansible (nfs_export_data01.yaml)
          [nfsd]
          vers3=n
        owner: root
        group: root
        mode: '0644'
      notify: Restart nfs-server

    # ocean's INPUT policy is ACCEPT, so this host list is the only access
    # control on the export.
    - name: Export /data01 to the workers
      ansible.builtin.copy:
        dest: /etc/exports.d/data01-workers.exports
        content: |
          # Managed by Ansible (nfs_export_data01.yaml)
          {{ nfs_export_path }} {% for host in groups['data01_workers'] %}{{ hostvars[host].ansible_ssh_host }}({{ nfs_export_options }}){{ ' ' if not loop.last }}{% endfor %}

        owner: root
        group: root
        mode: '0644'
      notify: Reload exports

    # Absent, not empty, when no netboot host opts in: an empty client list
    # would export the path to every host.
    - name: Export the library to netboot hosts
      ansible.builtin.copy:
        dest: /etc/exports.d/netboot-hosts.exports
        content: |
          # Managed by Ansible (nfs_export_data01.yaml)
          {{ netboot_export_path }} {% for ip in netboot_client_ips %}{{ ip }}({{ netboot_export_options }}){{ ' ' if not loop.last }}{% endfor %}

        owner: root
        group: root
        mode: '0644'
      when: netboot_client_ips | length > 0
      notify: Reload exports

    - name: Drop the netboot export when no netboot host opts in
      ansible.builtin.file:
        path: /etc/exports.d/netboot-hosts.exports
        state: absent
      when: netboot_client_ips | length == 0
      notify: Reload exports

    - name: Enable and start nfs-server
      ansible.builtin.systemd:
        name: nfs-server
        state: started
        enabled: true

    - name: Apply pending NFS config before verifying
      ansible.builtin.meta: flush_handlers

    # nfs.conf.d support depends on the nfs-utils version; a drop-in it never
    # reads would leave v3 on while the play reports success.
    - name: Read the NFS versions nfsd is serving
      ansible.builtin.command: cat /proc/fs/nfsd/versions
      register: nfsd_versions
      changed_when: false
      check_mode: false

    - name: Read the live export table
      ansible.builtin.command: exportfs -v
      register: live_exports
      changed_when: false
      check_mode: false

    - name: Assert v3 is off and /data01 is exported to the workers only
      ansible.builtin.assert:
        that:
          - "'-3' in nfsd_versions.stdout.split()"
          - "'+4.2' in nfsd_versions.stdout.split()"
          - live_exports.stdout is not search('<world>|\\*\\(')
        fail_msg: "versions: {{ nfsd_versions.stdout }} / exports: {{ live_exports.stdout }}"

    - name: Assert each worker is in the live export
      ansible.builtin.assert:
        that: live_exports.stdout is search(hostvars[item].ansible_ssh_host | regex_escape ~ '\\(')
        fail_msg: "{{ item }} missing from exportfs -v: {{ live_exports.stdout }}"
      loop: "{{ groups['data01_workers'] }}"

    # The netboot export must be the library alone, squashed; a netboot host
    # showing up on the /data01 line would mean it can reach service state.
    - name: Assert each netboot host gets only the squashed library export
      ansible.builtin.assert:
        that:
          - live_exports.stdout is search(netboot_export_path ~ '\\s+' ~ (item | regex_escape) ~ '\\(.*all_squash')
          - live_exports.stdout is not search('/data01\\s+' ~ (item | regex_escape) ~ '\\(')
        fail_msg: "{{ item }} export is wrong: {{ live_exports.stdout }}"
      loop: "{{ netboot_client_ips }}"

  handlers:
    - name: Restart nfs-server
      ansible.builtin.systemd:
        name: nfs-server
        state: restarted

    - name: Reload exports
      ansible.builtin.command: exportfs -ra
      changed_when: true
