---
- name: Configure systemd service for audible-download and compress
  hosts: ocean
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../../../../vault/secrets.yaml"
  vars:
    services:
      - audible-download.timer
      - audible-download.service

  tasks:
    - name: Install pipx
      ansible.builtin.apt:
        name: pipx
        state: present
        update_cache: yes

    - name: Install ffmpeg and dependencies for AAXtoMP3 conversions
      ansible.builtin.apt:
        name:
          - ffmpeg
          - bc
          - x264
          - x265
          - mediainfo
        state: present
        update_cache: yes

    - name: Ensure pipx path is configured
      ansible.builtin.command: pipx ensurepath
      changed_when: false

    - name: Install audible-cli via pipx
      ansible.builtin.command: pipx install audible-cli
      register: pipx_install
      changed_when: "'installed package' in pipx_install.stdout"
      failed_when: pipx_install.rc != 0 and 'already installed' not in pipx_install.stderr

    - name: Check if directory exists
      ansible.builtin.stat:
        path: /data01/services/audible-downloader
      register: dir_status

    - name: Ensure directory exists with correct ownership and permissions
      ansible.builtin.file:
        path: /data01/services/audible-downloader
        state: directory
        owner: media
        group: media
        mode: '0755'
      when: dir_status.stat.exists == False or
            dir_status.stat.uid != 0 or
            dir_status.stat.gid != 0 or
            dir_status.stat.mode != '0755'

    - name: Patched version of AAXtoMP3
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../../files/audible-downloader/AAXtoMP3"
        dest: "/data01/services/audible-downloader/AAXtoMP3"
        owner: media
        group: media
        mode: '0755'

    - name: Copy additional scripts to remote machine
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../../files/audible-downloader/{{ item }}"
        dest: "/data01/services/audible-downloader/{{ item }}"
        owner: media
        group: media
        mode: '0755'
      loop:
        - download.sh
        - download_and_compress.sh

    # compress.sh carries the Audible account activation bytes, so it is
    # rendered from the vault rather than copied. The plaintext copy was
    # scrubbed from git in a8ae67f, which left this play unappliable until now.
    - name: Render compress.sh with the account activation bytes
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../../../files/audible-downloader/compress.sh.j2"
        dest: /data01/services/audible-downloader/compress.sh
        owner: media
        group: media
        mode: '0755'

    - name: Ensure audible-cli config directory exists
      ansible.builtin.file:
        path: /root/.audible
        state: directory
        owner: root
        group: root
        mode: '0750'

    # audible.json is NOT managed here. It is audible-cli's credential cache:
    # it carries an access token with an `expires` field and a refresh token,
    # and the tool rewrites the file whenever it renews them. Templating it
    # from the vault would clobber a live refreshed token with a stale one on
    # every apply. Seed it once by hand with `audible quickstart`.
    - name: Copy audible-cli config files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../../files/audible-downloader/.audible/{{ item }}"
        dest: "/root/.audible/{{ item }}"
        owner: root
        group: root
        mode: '0660'
      loop:
        - config.toml

    - name: Create systemd service and timer
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../../../files/audible-downloader/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
      loop: "{{ services }}"
      notify:
        - Reload systemd daemon

    - name: Enable and start audible-download timer
      ansible.builtin.systemd:
        name: audible-download.timer
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes
