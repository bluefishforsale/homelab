---
# mem0: the fleet's shared agent memory (REST API + MCP bridge).
#
# Why it lives here rather than on the laptop: memory that only one machine can
# reach is memory the agentbox lanes never see, and a second instance is not an
# option. mem0's add() rewrites the existing facts with an LLM instead of
# appending, so two stores fed the same input diverge immediately and cannot be
# merged back. One writer on harbor, everything else is a client.
#
# Runs on harbor, with Postgres on the passed-through 870 EVO and everything
# else on harbor's local state disk. Clients still say ocean.home:8888 and
# :8766; a TCP forwarder on ocean carries those to harbor, so no agent config
# had to change. Reached over the LAN, or from off-site through an ssh
# port-forward. Deliberately NOT on cloudflared: conversation memory is the most
# personal data in the fleet and the CF edge terminates TLS.
#
# The API image comes from GHCR, built and smoke-tested by the mem0 repo's
# build-and-push workflow, which dispatches deploy-mem0 here on merge. The
# bridge still builds from source: it publishes no image at all.
#
# The published mem0/mem0-api-server image on Docker Hub is not an option: last
# pushed 2025-09-10, well before the API-key auth this deploy depends on.

# NOTE: the first play is `hosts: ocean` on purpose. main-apply and the dispatch
# workflows take the concurrency group from a playbook's first hosts line, and
# this play stops a service on ocean, so it must hold deploy-ocean.
- name: Retire mem0 on ocean
  hosts: ocean
  become: true
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../../vault/secrets.yaml"

  vars:
    home: /data01/services/mem0
    handoff: /data01/services/mem0-to-harbor.tar
    # Root-only and off the export, so harbor can trust the tar it reads over NFS.
    handoff_sum: /root/mem0-to-harbor.sha256

  tasks:
  # On harbor before anything stops here, so a bad ghcr-private-cache credential or a cold
  # 2GB ollama pull fails or finishes with ocean still serving. The API image is
  # pulled by the harbor play, which owns the pinned version.
  - name: Log harbor into ghcr-private-cache to pull the private mem0 image
    ansible.builtin.shell: |
      echo "{{ infrastructure.registry_cache.ghcr_private.password }}" | docker login registry-cache.home:5005 -u {{ infrastructure.registry_cache.ghcr_private.username }} --password-stdin
    delegate_to: harbor
    no_log: true
    changed_when: false

  - name: Pull mem0's public images on harbor
    ansible.builtin.command:
      cmd: "docker pull {{ item }}"
    loop:
      - ankane/pgvector:v0.5.1
      - ollama/ollama:latest
    delegate_to: harbor
    register: harbor_pull
    changed_when: "'Downloaded newer image' in harbor_pull.stdout"

  - name: Read the ocean unit
    ansible.builtin.stat:
      path: /etc/systemd/system/mem0.service
    register: ocean_unit

  - name: Read harbor's migration marker
    ansible.builtin.stat:
      path: "{{ home }}/.migrated-from-ocean"
    delegate_to: harbor
    register: harbor_marker

  - name: Read whether mem0 is running on ocean
    ansible.builtin.command: systemctl is-active mem0.service
    register: ocean_active
    changed_when: false
    failed_when: false

  # NOTE: once harbor has the marker it owns the store, and this play no longer
  # hands state over. A mem0 started on ocean after that takes writes harbor
  # never sees, and the last play would stop it and drop them silently.
  - name: Refuse to run with two mem0 writers
    ansible.builtin.assert:
      that: not (harbor_marker.stat.exists and ocean_active.stdout == 'active')
      fail_msg: >-
        mem0 is running on ocean but harbor already holds the migrated store.
        Writes since ocean started exist only on ocean. To make ocean the
        source again: stop mem0 on harbor, delete harbor's
        /data01/services/mem0/.migrated-from-ocean, then rerun so ocean's state
        is handed over fresh.

  # Catches a tar the in-run delete on harbor's side never got to.
  - name: Remove a leftover handoff once harbor has it
    ansible.builtin.file:
      path: "{{ item }}"
      state: absent
    loop: ["{{ handoff }}", "{{ handoff_sum }}"]
    when: harbor_marker.stat.exists

  # Backout before harbor's marker exists: `systemctl start mem0` on ocean. After
  # it exists, ocean only becomes the source again by deleting the marker first
  # (see the assert above). Writes made while mem0 is down wait in the clients'
  # capture outbox.
  - name: Hand mem0's state to harbor
    when: ocean_unit.stat.exists and not harbor_marker.stat.exists
    block:
    # NOTE: stopped before the tar; a live Postgres copied mid-write is a torn
    # cluster. The unit's ExecStop is compose down.
    - name: Stop and disable mem0 on ocean
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - mem0-metrics.timer
        - mem0.service

    # harbor's root is squashed to nobody over NFS, and Postgres's dir is 0700
    # uid 999, so harbor can't copy the tree itself. One tar keeps numeric
    # owners and goes to nobody, 0400. The bridge source is refetched on harbor;
    # secrets (.env, compose, the bridge token) are re-rendered from the vault.
    - name: Tar mem0's state for harbor
      ansible.builtin.command:
        cmd: >-
          tar --numeric-owner -cf {{ handoff }} -C {{ home }}
          --exclude=./src-bridge --exclude=./.env --exclude=./docker-compose.yml .
      async: 7200
      poll: 15
      changed_when: true

    - name: Record the handoff's checksum
      ansible.builtin.shell: "umask 077 && sha256sum {{ handoff }} | cut -d' ' -f1 > {{ handoff_sum }}"
      async: 3600
      poll: 15
      changed_when: true

    - name: Let harbor's squashed root read the handoff
      ansible.builtin.file:
        path: "{{ handoff }}"
        owner: '65534'
        group: '65534'
        mode: '0400'

    rescue:
    - name: Bring mem0 back up on ocean
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - mem0.service
        - mem0-metrics.timer

    - name: Fail the deploy with ocean still serving
      ansible.builtin.fail:
        msg: "Handing mem0's state to harbor failed; mem0 is running on ocean again."

- name: Deploy mem0 on harbor using Docker Compose
  hosts: harbor
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../../../vault/secrets.yaml"
    - "{{ playbook_dir }}/../../../vars/vars_service_ports.yaml"

  vars:
    service: mem0
    # Pinned SHAs, not branches: an unpinned version turns every deploy into a
    # silent upgrade of the thing holding all the memory. mem0_version is an
    # image tag rather than a git ref.
    #
    # NOTE: this line is the deployed version, not a floor. deploy-mem0 passes
    # --extra-vars mem0_version=<sha> and then writes that sha back here, so
    # the file and the running container always agree.
    #
    # The write-back is load-bearing. Without it the override lives only for
    # the dispatch run, while every other apply redeploys whatever this line
    # says -- and main-apply fires on any change under playbooks/, files/,
    # roles/ or vars/. Editing an unrelated homelab file then silently rolls
    # mem0 back. Not hypothetical: a mem0.env.j2 edit rolled ocean from 09cb707
    # to 595f1989, undoing four merged PRs, with the container healthy
    # throughout. Found only by a check comparing the running image to
    # fork/main.
    mem0_image: registry-cache.home:5005/bluefishforsale/mem0-api-server
    mem0_version: c7cb52dabdf47470f15ab0bf818cf0bb8787ba11
    # https with harbor's read-only token (tasks/github_read.yaml), not ssh:
    # harbor holds no GitHub key.
    mem0_bridge_repo: https://github.com/bluefishforsale/mem0-mcp-bridge.git
    # Pinned like the fork above, now that the repo has a commit worth pinning:
    # this is the one that constrains mcp<2. On `main` the bridge crash-looped,
    # because mcp>=1.0 resolved to 2.x where FastMCP was renamed and moved.
    mem0_bridge_version: 031680a22d216086c914646020b5275fbbbe963c
    # The MCP SDK's DNS-rebinding protection trusts only localhost, so a bridge
    # published on the LAN answered 421 "Invalid Host header" to every remote
    # client: agentbox's config pointed at a working service that could not
    # answer it. Naming the hosts opts into exactly these and no others.
    # Setting this REPLACES the SDK defaults, hence localhost is listed too.
    # ocean's names stay: clients reach harbor through ocean's forwarder, which
    # passes the Host header through untouched.
    mem0_bridge_allowed_hosts:
      - "ocean.home:{{ service_ports.mem0.mcp }}"
      - "192.168.1.143:{{ service_ports.mem0.mcp }}"
      - "harbor.home:{{ service_ports.mem0.mcp }}"
      - "192.168.1.32:{{ service_ports.mem0.mcp }}"
      - "localhost:{{ service_ports.mem0.mcp }}"
      - "127.0.0.1:{{ service_ports.mem0.mcp }}"
    port_api: "{{ service_ports.mem0.api }}"
    port_mcp: "{{ service_ports.mem0.mcp }}"
    # What gets pulled, and what mem0 actually calls. They differ because
    # ollama's thread count can only be set as a model parameter: it counts the
    # host's physical cores out of /proc/cpuinfo (not namespaced, not affinity
    # aware), so a container confined to 6 CPUs still ran a 30-thread pool and
    # spent all its time in scheduler contention. OLLAMA_NUM_THREADS is not
    # honoured; a derived model carrying `PARAMETER num_thread` is the lever
    # that exists. Measured on ocean, same prompt:
    #   nomic-embed-text     (30 threads): 34.53s
    #   nomic-embed-homelab  (6 threads):   ~0.9s on an idle host
    #
    # The compose quota is embedder_parallel x embedder_threads CPUs, one per
    # thread across every slot. Do not also pin it with cpuset: one saturated
    # core in a fixed set drags the whole pool to ~7s while its neighbours idle.
    # On harbor (24 cores) the quota is a ceiling shared with Tdarr, NZBGet and
    # archmap, not a reservation.
    embedder_base_model: nomic-embed-text
    embedder_model: nomic-embed-homelab
    embedder_threads: 4
    embedder_parallel: 4
    data: /data01
    files: "{{ playbook_dir }}/../../../files/ocean-mem0"
    home: "{{ data }}/services/{{ service }}"
    # The passed-through 870 EVO. nzbget.yaml formats and mounts it; mem0 only
    # keeps a dir beside NZBGet's scratch areas, which its prune never touches
    # (nzbget-prune.py works only in intermediate/ and tmp/).
    ssd: /srv/nzbget
    ssd_label: nzbget-scratch
    pg_home: "{{ ssd }}/{{ service }}"
    pg_data: "{{ pg_home }}/postgres-data"
    ocean_data01: /mnt/ocean-data01
    # ocean's paths, as the ocean play writes them.
    ocean_handoff: /data01/services/mem0-to-harbor.tar
    ocean_handoff_sum: /root/mem0-to-harbor.sha256
    handoff: "{{ ocean_data01 }}{{ ocean_handoff | regex_replace('^/data01', '') }}"
    migrated: "{{ home }}/.migrated-from-ocean"
    local_handoff: /data01/services/.mem0-from-ocean.tar

  tasks:

  - name: Read the state mount
    ansible.builtin.command: findmnt -n -o FSTYPE /data01/services
    register: state_mount
    changed_when: false

  # NOTE: Postgres keeps a WAL and history.db is SQLite; on ocean's NFS view
  # either would corrupt.
  - name: State lands on the local disk, not ocean's NFS
    ansible.builtin.assert:
      that: state_mount.stdout == 'ext4'
      fail_msg: "/data01/services is '{{ state_mount.stdout }}', not the local ext4 disk; run data01_worker.yaml first"

  - name: Read the SSD mount
    ansible.builtin.command: "findmnt -n -o FSTYPE,LABEL {{ ssd }}"
    register: ssd_mount
    changed_when: false
    failed_when: false

  # Without the mount, Postgres would land on harbor's OS disk under an empty
  # mountpoint and vanish from view the next time the SSD mounts over it.
  - name: Postgres lands on the 870 EVO
    ansible.builtin.assert:
      that: ssd_mount.stdout.split() == ['ext4', ssd_label]
      fail_msg: "{{ ssd }} is '{{ ssd_mount.stdout }}', not the ext4 870 EVO labelled {{ ssd_label }}; run workers/nzbget.yaml first"

  - name: Read the migration marker
    ansible.builtin.stat:
      path: "{{ migrated }}"
    register: migrated_stat

  # ocean's /data01/services sits under harbor's local disk, so a second
  # read-only mount is the only way to see the handoff.
  - name: Take mem0's state from ocean
    when: not migrated_stat.stat.exists
    block:
    - name: Mount ocean's /data01 read-only
      ansible.builtin.shell: |
        set -e
        mkdir -p {{ ocean_data01 }}
        mountpoint -q {{ ocean_data01 }} || mount -t nfs4 -o ro,nfsvers=4.2,nconnect=4 {{ hostvars['ocean'].ansible_ssh_host }}:/data01 {{ ocean_data01 }}
      changed_when: true

    - name: Read the handoff
      ansible.builtin.stat:
        path: "{{ handoff }}"
      register: handoff_stat

    - name: The handoff exists
      ansible.builtin.assert:
        that: handoff_stat.stat.exists
        fail_msg: "{{ handoff }} is missing or unreadable to harbor's squashed root; the ocean play makes it when it stops mem0 there"

    - name: Read the checksum ocean recorded
      ansible.builtin.slurp:
        src: "{{ ocean_handoff_sum }}"
      delegate_to: ocean
      register: recorded_sum

    # One local, root-only copy is what gets checked and unpacked, so the file on
    # the NFS export can't change between the check and the tar.
    - name: Copy the handoff off NFS
      ansible.builtin.shell: "umask 077 && cp {{ handoff }} {{ local_handoff }}"
      async: 7200
      poll: 15
      changed_when: true

    - name: Checksum the local copy
      ansible.builtin.stat:
        path: "{{ local_handoff }}"
        checksum_algorithm: sha256
      register: handoff_check

    - name: The handoff matches ocean's checksum
      ansible.builtin.assert:
        that: handoff_check.stat.checksum == (recorded_sum.content | b64decode | trim)
        fail_msg: "{{ handoff }} does not match ocean's recorded sha256; not unpacking it"

    - name: Ensure mem0's homes exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop: ["{{ home }}", "{{ pg_home }}"]

    # -p keeps Postgres's 0700 data dir; --numeric-owner keeps its uid 999.
    - name: Unpack everything but Postgres onto the state disk
      ansible.builtin.command:
        cmd: "tar --numeric-owner -xpf {{ local_handoff }} -C {{ home }} --exclude=./postgres-data"
      async: 7200
      poll: 15
      changed_when: true

    - name: Unpack Postgres onto the SSD
      ansible.builtin.command:
        cmd: "tar --numeric-owner -xpf {{ local_handoff }} -C {{ pg_home }} ./postgres-data"
      async: 7200
      poll: 15
      changed_when: true

    - name: Mark the migration done
      ansible.builtin.file:
        path: "{{ migrated }}"
        state: touch
        mode: '0644'

    # The tar holds the whole memory store, so it goes as soon as harbor has it.
    - name: Remove the handoff and its checksum on ocean
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: ["{{ ocean_handoff }}", "{{ ocean_handoff_sum }}"]
      delegate_to: ocean

    always:
    - name: Remove the local copy
      ansible.builtin.file:
        path: "{{ local_handoff }}"
        state: absent

    - name: Unmount ocean's /data01
      ansible.builtin.shell: "! mountpoint -q {{ ocean_data01 }} || umount {{ ocean_data01 }}"
      changed_when: false

  - name: Ensure service directories exist
    ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      mode: '0755'
    loop:
      - "{{ home }}"
      - "{{ pg_home }}"
      - "{{ home }}/ollama"
      - "{{ home }}/history"
      - "{{ home }}/bridge-data/mem0-mcp-bridge"

  # The API image is private, so the pull below needs the ghcr-private-cache
  # login, the same vault key paia.yaml uses.
  - name: Log harbor into ghcr-private-cache to pull the private mem0 image
    ansible.builtin.shell: |
      echo "{{ infrastructure.registry_cache.ghcr_private.password }}" | docker login registry-cache.home:5005 -u {{ infrastructure.registry_cache.ghcr_private.username }} --password-stdin
    no_log: true
    changed_when: false

  - name: Let harbor clone private GitHub repos
    ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/github_read.yaml"

  # src-bridge was a plain unpacked archive while ocean did the cloning. git
  # refuses to clone into a non-empty dir, so a non-checkout goes first.
  - name: Look for a git checkout of the bridge on harbor
    ansible.builtin.stat:
      path: "{{ home }}/src-bridge/.git"
    register: bridge_git

  - name: Clear the archive-era bridge source
    ansible.builtin.file:
      path: "{{ home }}/src-bridge"
      state: absent
    when: not bridge_git.stat.exists

  - name: Clone mem0-mcp-bridge
    ansible.builtin.git:
      repo: "{{ mem0_bridge_repo }}"
      dest: "{{ home }}/src-bridge"
      version: "{{ mem0_bridge_version }}"
      force: true
    register: bridge_clone

  - name: Supply the bridge with a Dockerfile
    ansible.builtin.copy:
      src: "{{ files }}/Dockerfile.bridge"
      dest: "{{ home }}/src-bridge/Dockerfile"
      mode: '0644'
    register: bridge_dockerfile

  # Pre-seeded from the vault rather than left to the bridge's
  # get_or_create_token(), so the token survives a rebuild and matches the
  # Authorization header every agent config already carries.
  - name: Install bridge bearer token
    ansible.builtin.copy:
      content: "{{ ai_services.mem0.bridge_token }}\n"
      dest: "{{ home }}/bridge-data/mem0-mcp-bridge/token"
      mode: '0600'
    no_log: true
    notify: Restart mem0 service

  - name: Create mem0 environment file
    ansible.builtin.template:
      src: "{{ files }}/mem0.env.j2"
      dest: "{{ home }}/.env"
      mode: '0600'
    notify:
    - Reload systemd daemon
    - Restart mem0 service

  - name: Create docker-compose.yml
    ansible.builtin.template:
      src: "{{ files }}/docker-compose.yml.j2"
      dest: "{{ home }}/docker-compose.yml"
      mode: '0644'
    notify:
    - Reload systemd daemon
    - Restart mem0 service

  - name: Create mem0 systemd service
    ansible.builtin.template:
      src: "{{ files }}/mem0.service.j2"
      dest: "/etc/systemd/system/mem0.service"
      mode: '0644'
    notify:
    - Reload systemd daemon
    - Restart mem0 service

  # Only on a source change. `compose up -d` builds a missing image on its own,
  # but a version bump reuses the existing tag, so the rebuild has to be
  # explicit or the pin would be decorative.
  #
  # NOTE: named service, not a bare `docker compose build`. The bare form builds
  # every service carrying a build section, so a bridge change rebuilt the API
  # too. The API has no build section any more, but naming the service keeps
  # that true if one is ever added back.
  - name: Rebuild the bridge image after a source change
    ansible.builtin.command:
      cmd: docker compose build bridge
      chdir: "{{ home }}"
    environment:
      COMPOSE_PROJECT_NAME: "{{ service }}"
    when: (bridge_clone.changed | default(false)) or bridge_dockerfile.changed
    notify: Restart mem0 service

  # Image acquisition must not happen inside the unit's start: `compose up -d`
  # pulls ollama (2.1GB) on a cold host, that overran TimeoutStartSec=600, and
  # Restart=on-failure then restarted the pull from the top every cycle, a loop
  # that can never converge. Pulling here leaves `up -d` with nothing to fetch.
  # --ignore-buildable now skips only the bridge, which is built from source and
  # has no registry to pull from. The API is pulled here like any other image,
  # which is also what makes its pin real: `compose up -d` fetches only when the
  # tag is absent locally.
  - name: Pull registry images before the unit starts
    ansible.builtin.command:
      cmd: docker compose pull --ignore-buildable
      chdir: "{{ home }}"
    environment:
      COMPOSE_PROJECT_NAME: "{{ service }}"
    register: mem0_pull
    changed_when: "'Pulled' in mem0_pull.stderr or 'Downloaded' in mem0_pull.stderr"
    notify: Restart mem0 service

  - name: Enable mem0 service
    ansible.builtin.systemd:
      name: mem0.service
      enabled: true
      state: started
      daemon_reload: true

  - name: Flush handlers before probing the running stack
    ansible.builtin.meta: flush_handlers

  - name: Check whether the embedding model is present
    ansible.builtin.command:
      cmd: docker exec mem0-ollama ollama list
    register: ollama_models
    changed_when: false
    failed_when: false

  # ~270MB, CPU-only. Without it every add and search 500s on the embed call.
  - name: Pull the base embedding model
    ansible.builtin.command:
      cmd: "docker exec mem0-ollama ollama pull {{ embedder_base_model }}"
    when: embedder_base_model not in (ollama_models.stdout | default(''))

  # Lands inside the ollama volume, so the container reads it at
  # /root/.ollama without another mount.
  - name: Write the embedder Modelfile
    ansible.builtin.copy:
      content: |
        FROM {{ embedder_base_model }}
        PARAMETER num_thread {{ embedder_threads }}
      dest: "{{ home }}/ollama/Modelfile.homelab"
      mode: '0644'
    register: embedder_modelfile

  - name: Derive the thread-pinned embedding model
    ansible.builtin.command:
      cmd: >
        docker exec mem0-ollama ollama create {{ embedder_model }}
        -f /root/.ollama/Modelfile.homelab
    when: >
      embedder_modelfile.changed
      or embedder_model not in (ollama_models.stdout | default(''))

  # mem0 has no /metrics of its own, so statistics reach Prometheus through the
  # node_exporter textfile collector, the same route db-backup uses.
  - name: Deploy the metrics collector
    ansible.builtin.copy:
      src: "{{ files }}/mem0-metrics.sh"
      dest: "{{ home }}/mem0-metrics.sh"
      mode: '0755'

  - name: Install the metrics timer
    ansible.builtin.template:
      src: "{{ files }}/{{ item }}.j2"
      dest: "/etc/systemd/system/{{ item }}"
      mode: '0644'
    loop:
      - mem0-metrics.service
      - mem0-metrics.timer
    notify: Reload systemd daemon

  - name: Enable the metrics timer
    ansible.builtin.systemd:
      name: mem0-metrics.timer
      enabled: true
      state: started
      daemon_reload: true

  # The LAN address, not loopback: the compose port is bound to it explicitly so
  # the service is unreachable from anywhere the host itself doesn't route.
  - name: Verify the API is serving
    ansible.builtin.uri:
      url: "http://{{ ansible_default_ipv4.address }}:{{ port_api }}/docs"
      status_code: 200
    retries: 12
    delay: 10
    register: mem0_probe
    until: mem0_probe is succeeded

  handlers:
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      daemon_reload: true

  - name: Restart mem0 service
    ansible.builtin.systemd:
      name: mem0.service
      state: restarted

# Last, so clients point at a live harbor before ocean's ports are taken over.
- name: Forward ocean's mem0 addresses to harbor
  hosts: ocean
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../../../vars/vars_service_ports.yaml"

  vars:
    service: mem0-forward
    home: "/data01/services/{{ service }}"
    files: "{{ playbook_dir }}/../../../files/ocean-mem0"
    port_api: "{{ service_ports.mem0.api }}"
    port_mcp: "{{ service_ports.mem0.mcp }}"
    upstream: "{{ hostvars['harbor'].ansible_ssh_host }}"

  tasks:
  # The handoff already stopped these; this catches a rerun after a manual start
  # and keeps two mem0 writers from ever running at once.
  - name: Stop and disable mem0 on ocean
    ansible.builtin.systemd:
      name: "{{ item }}"
      state: stopped
      enabled: false
    loop:
      - mem0-metrics.timer
      - mem0.service
    failed_when: false

  - name: Remove ocean's mem0 units
    ansible.builtin.file:
      path: "/etc/systemd/system/{{ item }}"
      state: absent
    loop:
      - mem0.service
      - mem0-metrics.service
      - mem0-metrics.timer
    register: ocean_units_removed

  - name: Reload systemd after removing the units
    ansible.builtin.systemd:
      daemon_reload: true
    when: ocean_units_removed.changed

  # node_exporter would keep exporting ocean's last values under instance=ocean
  # forever, beside harbor's live ones, and Mem0MetricsStale would never clear.
  - name: Remove ocean's frozen mem0 metrics
    ansible.builtin.file:
      path: "/data01/services/node-exporter/text_files/{{ item }}"
      state: absent
    loop:
      - mem0.prom
      - .mem0-llm-probe-stamp
      - .mem0-llm-probe-value

  - name: Ensure the forwarder dir exists
    ansible.builtin.file:
      path: "{{ home }}"
      state: directory
      mode: '0755'

  - name: Write the forwarder config
    ansible.builtin.template:
      src: "{{ files }}/forward-nginx.conf.j2"
      dest: "{{ home }}/nginx.conf"
      mode: '0644'
    register: forward_conf

  - name: Write the forwarder compose file
    ansible.builtin.template:
      src: "{{ files }}/forward-compose.yml.j2"
      dest: "{{ home }}/docker-compose.yml"
      mode: '0644'
    register: forward_compose

  - name: Start the forwarder
    ansible.builtin.command:
      cmd: "docker compose up -d {{ '--force-recreate' if (forward_conf.changed or forward_compose.changed) else '' }}"
      chdir: "{{ home }}"
    environment:
      COMPOSE_PROJECT_NAME: "{{ service }}"
    register: forward_up
    changed_when: "'Started' in forward_up.stderr or 'Recreated' in forward_up.stderr or 'Created' in forward_up.stderr"

  - name: Verify mem0 answers through ocean
    ansible.builtin.uri:
      url: "http://{{ ansible_default_ipv4.address }}:{{ port_api }}/docs"
      status_code: 200
    retries: 6
    delay: 5
    register: forward_probe
    until: forward_probe is succeeded

  # ocean's copy was the backout while harbor proved itself. harbor has served
  # since 2026-11-11, backs up to GCS (mem0-postgres/, mem0/), and just answered
  # through the forwarder above, so the copy and the old bridge clone go. Only
  # once harbor holds the migrated store and no mem0 container runs here.
  - name: Read harbor's migration marker
    ansible.builtin.stat:
      path: /data01/services/mem0/.migrated-from-ocean
    delegate_to: harbor
    register: harbor_marker

  - name: List mem0 containers still on ocean
    ansible.builtin.command:
      cmd: docker ps -aq --filter name=^mem0(-postgres|-ollama|-bridge)?$
    register: ocean_mem0_containers
    changed_when: false

  - name: Refuse to delete under a live mem0 container
    ansible.builtin.assert:
      that: ocean_mem0_containers.stdout == ''
      fail_msg: "mem0 containers exist on ocean ({{ ocean_mem0_containers.stdout_lines | join(' ') }}); its old dir stays until they are gone."
    when: harbor_marker.stat.exists

  # NOTE: a mountpoint here would be a dataset; removing it is a ZFS change and
  # out of scope for a playbook, so the delete refuses one.
  - name: Check ocean's old mem0 dir is a plain directory
    ansible.builtin.command:
      cmd: findmnt -n /data01/services/mem0
    register: ocean_mem0_mount
    changed_when: false
    failed_when: ocean_mem0_mount.rc == 0
    when: harbor_marker.stat.exists

  - name: Delete ocean's old mem0 dir and bridge clone
    ansible.builtin.file:
      path: "{{ item }}"
      state: absent
    loop:
      - /data01/services/mem0
      - /root/mem0-mcp-bridge
    async: 3600
    poll: 15
    when: harbor_marker.stat.exists
