---
# Homelab service-database backup to GCS. Dumps every in-scope database (RDBMS
# via `docker exec` logical dumps, SQLite via online `.backup`) into one tarball
# and pushes it to a GCS bucket authenticated by a dedicated service-account key.
# Runs ON ocean and every data01 worker (wherever DB containers live), not the
# control node; each host dumps only the containers running on it.
#
# Lives under playbooks/operations/backup/ so the impact detector keeps it
# DISPATCH-ONLY (never auto-applies on push) - see
# .github/workflows/lib/detect-impacted-playbooks.sh emit() guard. Recurring runs
# come from the installed systemd timer, not the deploy pipeline.
#
# ocean uploads with backup_storage.gcs.service_account_key; a worker uploads only
# with its own backup_storage.gcs.<host>_service_account_key. A host without a key
# runs local-only with a 2-tarball retention.
- name: Configure homelab database backup to GCS
  hosts: ocean:data01_workers
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../../../vault/secrets.yaml"

  vars:
    service: db-backup
    home: "/data01/services/{{ service }}"
    files: "{{ playbook_dir }}/../../../files/{{ service }}"
    backup_gcs_bucket: homelab-db-backups
    gcs_key_name: "{{ 'service_account_key' if inventory_hostname == 'ocean' else inventory_hostname + '_service_account_key' }}"
    # Dispatch with db_backup_run_now=true to take a backup at the end of the run.
    db_backup_run_now: false

  tasks:
    - name: Ensure base + staging directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ home }}"
        # ocean stages on the pool; a worker's root is squashed over NFS, so it stages locally.
        - "{{ '/data01/backups/db-staging' if inventory_hostname == 'ocean' else home + '/staging' }}"

    - name: Deploy backup script
      ansible.builtin.copy:
        src: "{{ files }}/db-backup.sh"
        dest: "{{ home }}/db-backup.sh"
        mode: '0755'

    - name: Render backup env (DB creds from vault, mode 0600)
      ansible.builtin.template:
        src: "{{ files }}/db-backup.env.j2"
        dest: "{{ home }}/db-backup.env"
        mode: '0600'

    # NOTE: each host gets its own key, scoped in terraform-root to the dumps it
    # makes. A worker with no vaulted key loses its file and uploads nothing,
    # rather than falling back to ocean's bucket-wide key.
    - name: Land this host's GCS service-account key
      ansible.builtin.copy:
        content: "{{ backup_storage.gcs[gcs_key_name] | default('') }}"
        dest: "{{ home }}/gcs-sa.json"
        mode: '0600'
      when: (backup_storage.gcs[gcs_key_name] | default('')) | length > 100
      no_log: true

    - name: Remove a key this host has no vaulted copy of
      ansible.builtin.file:
        path: "{{ home }}/gcs-sa.json"
        state: absent
      when: (backup_storage.gcs[gcs_key_name] | default('')) | length <= 100

    - name: Deploy systemd service + timer
      ansible.builtin.template:
        src: "{{ files }}/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
      loop:
        - db-backup.service
        - db-backup.timer
      notify: Reload systemd daemon

    - name: Enable and start the daily backup timer
      ansible.builtin.systemd:
        name: db-backup.timer
        enabled: true
        state: started
        daemon_reload: true

    # Oneshot: this waits for the script. A failed run still falls through to the
    # metrics below, which say what failed, before the play fails on it.
    - name: Take a backup now
      ansible.builtin.systemd:
        name: db-backup.service
        state: started
      register: db_backup_run
      failed_when: false
      when: db_backup_run_now | bool

    - name: Read the backup's result
      ansible.builtin.slurp:
        src: /data01/services/node-exporter/text_files/db_backup.prom
      register: db_backup_prom
      when: db_backup_run_now | bool

    - name: Show the backup's result
      ansible.builtin.debug:
        msg: "{{ db_backup_prom.content | b64decode | split('\n') | select('match', '^homelab_') | list }}"
      when: db_backup_run_now | bool

    - name: Fail if the backup failed
      ansible.builtin.fail:
        msg: "db-backup.service failed: {{ db_backup_run.msg | default('see journalctl -u db-backup') }}"
      when: db_backup_run_now | bool and db_backup_run is failed

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
