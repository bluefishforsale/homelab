---
# One-time teardown of the globalview frontend SPA on ocean.
#
# globalview is being retired in favour of a proper God's Eye build reached
# through a Cloudflare tunnel rather than the nginx host proxy. See the tracking
# issue for that work.
#
# One of three: the stack is three independent units and compose projects, so
# it tears down as three plays. Order matters only in that the frontend and
# backend should go before globalview-stack, which holds the database they talk
# to. Nothing enforces that ordering here; run them in that order.
#
# No data paths: /data01/services/globalview holds only the generated
# docker-compose.yml (19K measured 2026-09-17). The SPA is baked into the image.
#
# Dispatch via the Decommission Service workflow. Never auto-applies on push.
- name: Decommission globalview
  hosts: ocean
  become: true
  gather_facts: false

  vars:
    decom_service: globalview
    decom_reason: "Retired ahead of the God's Eye rebuild behind a Cloudflare tunnel"

    decom_unit: globalview.service
    decom_container: globalview
    decom_compose_dir: /data01/services/globalview
    decom_config_paths: []
    decom_data_paths: []
    decom_image: "ghcr.io/bluefishforsale/globalview:latest"

  roles:
    - decommission
