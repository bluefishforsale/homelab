---
# DNS Infrastructure HA Role - Default Variables

# HA Configuration
ha_enabled: true
ha_role: primary
ha_peer_ip: ""
ha_heartbeat_delay: 10000
ha_max_response_delay: 60000
ha_max_ack_delay: 10000
ha_max_unacked_clients: 5

# Service configuration
dns_home: /opt/dns-stack
dns_service_name: dns-stack
enable_dhcp: true
enable_pxe: true
enable_monitoring: true

# PowerDNS configuration
pdns_primary_ip: 192.168.1.3
pdns_allow_axfr: "192.168.1.2,192.168.1.3"
pdns_api_key: "{{ vault_powerdns.api_key }}"

# Network configuration
dns_interface: eth0
dns_domain: home
cluster_domain: cluster.local

# User/Group
dns_user: root
dns_group: root

# Docker configuration
docker_compose_version: "2.40.3"

# iPXE served to PXE clients (tasks/netboot.yaml). Kea names the binaries
# snponly.efi / undionly.kpxe and the netbootxyz container ships neither, so
# they come from upstream iPXE's release tarball.
ipxe_version: v2.0.0
ipxe_sha256: 01a526d4cc791fc30362259c609d6c506cc64a7bdff51b9a5eb788354e17eee1

# Every <name>.home that nginx on ocean serves, each a CNAME to nginx.home so
# moving the proxy is one record. Kept in step with the server_name lines in
# files/nginx-compose/proxy_hostname_web_proxy.conf by
# .github/workflows/lib/nginx-vhosts-have-dns.test.sh.
# NOTE: there is no *.home wildcard, so a vhost missing here does not resolve.
nginx_lb_vhosts:
  - alertmanager
  - archmap
  - bazarr
  - etrading
  - grafana
  - hass
  - homeassistant
  - homepage
  - jellyfin
  - jellystat
  - karma
  - lidarr
  - llama
  - loki
  - nzbget
  - open-webui
  - overseerr
  - paia
  - plex
  - portainer
  - prometheus
  - prowlarr
  - radarr
  - saetnere
  - sonarr
  - ta
  - tautulli
  - tdarr
  - unpoller

# Image registries. Hosts in dns_cache_hosts pull through registry-cache-01,
# the rest straight from upstream. The upstream prefixes render to exactly what
# the refs were before the cache, so moving one host over leaves the other's
# compose file byte-identical and its stack untouched.
# NOTE: dns01 and dns02 resolve registry-cache.home themselves. A pull while
# both resolvers are down cannot reach the cache; a restart never pulls, so
# only a deploy or refresh in that window is exposed. Move one host at a time,
# on a weekday morning (docs/specs/2026-11-08-docker-weekly-restart-design.md).
dns_cache_hosts: [dns01]
dns_reg_hub: "{{ 'registry-cache.home:5001/' if inventory_hostname in dns_cache_hosts else '' }}"
dns_reg_ghcr: "{{ 'registry-cache.home:5002/' if inventory_hostname in dns_cache_hosts else 'ghcr.io/' }}"
