---
# Common setup tasks for DNS infrastructure

- name: Wait for cloud-init to complete
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Wait for dpkg lock to be released
  ansible.builtin.include_tasks: ../../../../playbooks/tasks/dpkg_lock.yaml

- name: Stop and disable systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  failed_when: false

- name: Configure resolv.conf for static DNS
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver {{ ha_peer_ip }}
      nameserver 1.1.1.1
      search {{ dns_domain }}
    mode: '0644'

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - sqlite3
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker CE packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure /etc/docker directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

# The fleet template, not a dns-only file. The old one held only log-driver and
# overwrote what docker_ce.yaml wrote, so the mirror and live-restore that
# dockerd was running with existed only in memory and would have vanished on
# the next dockerd restart.
- name: Configure Docker daemon
  ansible.builtin.template:
    src: "{{ role_path }}/../../files/docker/daemon.json.j2"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    validate: dockerd --validate --config-file %s
  register: dns_daemon_json

# Reloaded here rather than from a handler, so the check below sees the result
# and so no flush pulls the dns-stack handlers forward. SIGHUP leaves every DNS
# container running: see the handler NOTE in
# playbooks/individual/infrastructure/docker_ce.yaml.
- name: Reload docker to apply daemon.json
  ansible.builtin.systemd:
    name: docker
    state: reloaded
  when: dns_daemon_json is changed

- name: Read dockerd's live registry config
  ansible.builtin.command: docker info --format '{{ "{{" }}json .RegistryConfig{{ "}}" }}'
  register: dns_docker_registry_config
  changed_when: false
  check_mode: false
  failed_when: false

# failed_when above and the rc guard here: on a first install docker is not
# running yet at this point, and the role starts it two tasks later with the
# file already in place.
- name: Assert dockerd picked up the registry cache
  when: not ansible_check_mode and dns_docker_registry_config.rc == 0
  ansible.builtin.assert:
    that:
      - "'registry-cache.home:5005' in dns_docker_registry_config.stdout"
    fail_msg: "dockerd is not running with the insecure-registries in daemon.json; check journalctl -u docker for 'Error reconfiguring'"

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

- name: Create service directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ dns_home }}"
    - "{{ dns_home }}/config"
    - "{{ dns_home }}/data/pdns"
    - "{{ dns_home }}/data/kea"
    - "{{ dns_home }}/data/netboot/config"
    - "{{ dns_home }}/data/netboot/assets"
