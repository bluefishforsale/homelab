---
# Models the llmeval VM serves to `axiomd eval` (axiomd config/eval.toml names
# them; the router exposes each by file or directory name, so these names ARE
# the model ids). Every one is Q4-class so quantization is not the variable.
# sha256 is the Hugging Face LFS oid, checked after download, so a truncated
# or swapped file fails loudly instead of skewing a day of evals.
# Sharded models list every shard and get their own directory, as router mode
# requires.
llmeval_models:
  - name: Qwen3-Coder-30B-A3B-Instruct-Q4_K_M  # the baseline, what ocean runs
    files:
      - url: https://huggingface.co/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF/resolve/main/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
